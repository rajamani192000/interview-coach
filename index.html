  jobApplied: id => { const j = S.jobs.find(x => x.id === id); setJobStatus(j, 'Applied'); save(true); render(); toast('Marked as applied. Follow up in a week if you hear nothing.'); },
  jobPrepGo: id => {
    const j = S.jobs.find(x => x.id === id); if (!j) return; const A = jobAssess(j), plan = jobPrepPlan(j, A); const items = [], used = new Set();
    for (const it of plan.items.filter(i => i.kind === 'skill' && i.inBank)) { const ids = jobPrepQuestions(it.label, Math.max(3, Math.round(it.minutes / 2.5))).filter(x => !used.has(x)); ids.forEach(x => used.add(x)); if (ids.length) items.push(mkItem('weak', ids, { why: `${it.label} · needed for ${j.company}` })); }
    const talk = [...used].filter(id => qById(id).srs.attempts).slice(0, 2); const talkIds = talk.length ? talk : [...used].slice(0, 2);
    if (talkIds.length) items.push(mkItem('comm', talkIds, { target: 60 }));
    items.push(mkItem('story', [], { minutes: 10 }));
    if (j.status === 'Saved') setJobStatus(j, 'Considering');
    j.prep = Object.assign(j.prep || {}, { startedAt: Date.now() }); save();
    adhoc(`Prepare: ${j.role} — ${j.company}`, items, { jobId: j.id });
  },
  jobAI: async id => {
    const j = S.jobs.find(x => x.id === id); U.jobAIBusy = id; render();
    try { j.ai = await CareerAI.fit(j); save(true); } catch (e) { toast('Claude analysis failed: ' + (e.message || e)); }
    U.jobAIBusy = null; render();
  },
  careerProfile: async () => {
    U.cpBusy = true; render();
    try { S.career.candidate = await CareerAI.profile(); if (S.career.prefs.expYears === '' && S.career.candidate.experienceYears != null) S.career.prefs.expYears = S.career.candidate.experienceYears; save(true); toast('Profile updated from your resume'); } catch (e) { toast('Could not analyse: ' + (e.message || e)); }
    U.cpBusy = false; render();
  }
});

/* =================== ACCOUNT (UI): register, sign in, sync =================== */
function accountAvailable() { return Account.configured() && !inArtifact(); }
function syncLabel() {
  const u = Account.user(); if (!u) return 'Not signed in: saved on this device only';
  const t = Account.lastSync ? new Date(Account.lastSync).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
  return { synced: `Synced to your account${t ? ' · ' + t : ''}`, syncing: 'Syncing…', offline: 'Offline: saved on this device, will sync when online', error: 'Sync paused: ' + (Account.lastError || 'error'), idle: 'Signed in', signedout: 'Signed in' }[Account.status] || 'Signed in';
}
VIEWS.account = () => {
  if (!accountAvailable()) return topbar('Account', '') + `<div class="card"><h3>Accounts are not set up yet</h3><p class="small">${inArtifact() ? 'This claude.ai version already saves to your Claude account. Sign-in is for the installed app.' : 'Sign-in needs a free Firebase project connected to this app (one-time setup by the app owner). Until then, your data stays on this device; use Backup to move it.'}</p></div>`;
  const u = Account.user();
  if (!u) {
    const mode = U.authMode || 'signin';
    return topbar(mode === 'signup' ? 'Create your account' : 'Sign in', 'Keep your progress safe and use the same data on your phone and computer.') + `
    <div class="card auth">${Account.googleConfigured() ? `<div class="gwrap"><div id="gbtn" class="gbtn"></div><span class="xs muted" id="gmsg">${U.gErr ? esc(U.gErr) : ''}</span></div><div class="or"><span>or with email</span></div>` : ''}<div class="row tabs-scroll">${[['signin', 'Sign in'], ['signup', 'Create account']].map(([k, l]) => `<button class="chip ${mode === k ? 'on' : ''}" data-act="authMode" data-arg="${k}">${l}</button>`).join('')}</div>
     <div class="field"><label for="au_email">Email</label><input class="input" id="au_email" type="email" autocomplete="email" inputmode="email" value="${esc(U.authEmail || '')}"></div>
     <div class="field"><label for="au_pw">Password</label><input class="input" id="au_pw" type="password" autocomplete="${mode === 'signup' ? 'new-password' : 'current-password'}" minlength="8"></div>
     ${mode === 'signup' ? '<div class="field"><label for="au_pw2">Confirm password</label><input class="input" id="au_pw2" type="password" autocomplete="new-password"></div><span class="xs muted">At least 8 characters. You\'ll get an email to verify your address.</span>' : ''}
     ${U.authErr ? `<div class="banner bad small">${esc(U.authErr)}</div>` : ''}${U.authMsg ? `<div class="banner good small">${esc(U.authMsg)}</div>` : ''}
     <button class="btn primary big block" data-act="authGo" ${U.authBusy ? 'disabled' : ''}>${U.authBusy ? 'Please wait…' : mode === 'signup' ? 'Create account' : 'Sign in'}</button>
     ${mode === 'signin' ? '<button class="btn ghost sm" data-act="authReset">Forgot password?</button>' : ''}
     <p class="xs muted">Your progress, notes, resume text and jobs are stored in your private account space (only you can read it). Passwords are handled by Google Firebase and never stored by this app. Your AI API key never leaves this device.</p></div>
    <div><button class="btn ghost sm" data-act="go" data-arg="today">Continue without an account</button></div>`;
  }
  return topbar('Account', '') + `<div class="card"><div class="stack" style="gap:4px"><span class="eyebrow">Signed in</span><h3>${esc(u.email)}</h3>
    ${u.provider === 'google' ? '<span class="small">Signed in with Google</span>' : ''}<span class="small">${u.verified ? '✓ Email verified' : `Email not verified yet · <button class="btn sm ghost" data-act="authVerify">Send link again</button><button class="btn sm ghost" data-act="authRecheck">I've verified</button>`}</span>
    <span class="small"><b>${esc(syncLabel())}</b></span></div>
   <div class="row"><button class="btn primary sm" data-act="syncNow">Sync now</button><button class="btn sm" data-act="authSignOut">Sign out</button></div>
   <p class="xs muted">Everything syncs automatically a few seconds after a change and when you open the app. If two devices change data while offline, the newest version wins and the other is kept on that device as an undo copy (Settings → Backup & data).</p></div>
  ${u.provider === 'google' ? '' : '<div class="card"><h3>Password</h3><button class="btn sm" data-act="authResetMe">Email me a password reset link</button></div>'}
  <div class="card"><h3>Delete account</h3>${U.confirmDelAcc ? `<div class="banner bad"><b>Permanently delete your account and all cloud data? This device keeps its copy until you reset it.</b><div class="row"><button class="btn danger" data-act="authDelete">Yes, delete my account</button><button class="btn ghost" data-act="authDelCancel">Cancel</button></div></div>` : '<button class="btn ghost danger sm" data-act="authDelAsk">Delete account and cloud data</button>'}</div>`;
};
after.account = () => {
  const el = $('#gbtn'); if (!el || Account.user()) return;
  Account.renderGoogle(el, async cred => { U.gErr = ''; U.authErr = ''; U.authBusy = true; render(); try { await Account.signInGoogle(cred); U.authBusy = false; await afterSignIn(); } catch (e) { U.authBusy = false; U.authErr = e.message; render(); } },
    e => { const m = $('#gmsg'); if (m) m.textContent = e.message; });
};
function accountPromptCard() {
  if (!accountAvailable() || Account.user() || (S.meta.accountPromptOff || '') >= today()) return '';
  return `<div class="card slim"><div class="row between"><div class="stack" style="gap:0"><b class="small">Keep your progress safe</b><span class="xs muted">Create a free account to back up automatically and use it on any device.</span></div><div class="row"><button class="btn sm primary" data-act="go" data-arg="account">Sign in</button><button class="btn sm ghost" data-act="accountLater">Later</button></div></div></div>`;
}
function syncModal(kind) {
  const m = Account.pendingMeta;
  if (kind === 'conflict') return modal(`<h2>Which progress should we keep?</h2><p class="small">Your account already has saved progress${m ? ` (last saved ${new Date(m.updatedAt).toLocaleString()}${m.device ? ' on ' + esc(m.device) : ''})` : ''}. This device also has progress.</p>
   <div class="stack"><button class="btn primary block" data-act="syncUseCloud">Use my account's progress</button><button class="btn block" data-act="syncUseDevice">Use this device's progress (replaces the account copy)</button></div>
   <p class="xs muted">The one you don't choose is kept on this device as an undo copy.</p>`);
  if (kind === 'conflict-empty') return modal(`<h2>Upload this device's progress?</h2><p class="small">This device has progress from another sign-in. Your account is empty.</p>
   <div class="stack"><button class="btn primary block" data-act="syncUseDevice">Upload it to this account</button><button class="btn block" data-act="syncFresh">Start fresh in this account</button></div>`);
}
async function afterSignIn() {
  const r = await Account.syncOnOpen();
  if (r === 'conflict' || r === 'conflict-empty') return syncModal(r);
  applyTheme(); ensurePlan(); U.authMsg = ''; go('today');
  toast(r === 'loaded' || r === 'loaded-kept-copy' ? 'Loaded your progress from your account' : r === 'pushed' ? 'Your progress is now saved to your account' : r === 'error' ? 'Signed in. Sync will retry: ' + (Account.lastError || '') : 'Signed in');
}
async function syncOnFocus() {
  if (!accountAvailable() || !Account.user() || route === 'session' || route === 'vi') return;
  const r = await Account.syncOnOpen(); if (r === 'loaded' || r === 'loaded-kept-copy') { applyTheme(); ensurePlan(); render(); toast('Updated with your latest progress from another device'); } else shell();
}
Object.assign(ACT, {
  authMode: m => { U.authMode = m; U.authErr = U.authMsg = ''; render(); },
  authGo: async () => {
    const email = ($('#au_email').value || '').trim().toLowerCase(), pw = $('#au_pw').value || '', mode = U.authMode || 'signin'; U.authEmail = email; U.authErr = U.authMsg = '';
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { U.authErr = 'Enter a valid email address.'; return render(); }
    if (mode === 'signup') { if (pw.length < 8) { U.authErr = 'Use at least 8 characters for the password.'; return render(); } if (pw !== $('#au_pw2').value) { U.authErr = 'The two passwords do not match.'; return render(); } }
    U.authBusy = true; render();
    try { if (mode === 'signup') await Account.signUp(email, pw); else await Account.signIn(email, pw); U.authBusy = false; await afterSignIn(); }
    catch (e) { U.authBusy = false; U.authErr = e.message; render(); }
  },
  authReset: async () => { const email = ($('#au_email').value || '').trim(); if (!email) { U.authErr = 'Type your email first, then tap Forgot password.'; return render(); } try { await Account.sendReset(email); U.authMsg = 'If an account exists for ' + email + ', a reset link is on its way.'; U.authErr = ''; } catch (e) { U.authErr = e.message; } render(); },
  authResetMe: async () => { try { await Account.sendReset(Account.user().email); toast('Reset link sent to ' + Account.user().email); } catch (e) { toast(e.message); } },
  authVerify: async () => { try { await Account.sendVerify(); toast('Verification email sent'); } catch (e) { toast(e.message); } },
  authRecheck: async () => { try { await Account.lookup(); render(); } catch (e) { toast(e.message); } },
  syncNow: async () => { Account.status = 'syncing'; render(); const r = await Account.syncOnOpen(); if (r === 'conflict' || r === 'conflict-empty') return syncModal(r); if (r === 'same') await Account.pushState().catch(() => { }); render(); toast(r === 'error' ? 'Sync failed: ' + Account.lastError : 'Synced'); },
  syncUseCloud: async () => { try { await Account.useCloud(); closeModal(); applyTheme(); ensurePlan(true); go('today'); toast('Loaded your account progress. This device\'s old data is kept as an undo copy.'); } catch (e) { toast(e.message); } },
  syncUseDevice: async () => { try { await Account.useDevice(); closeModal(); go('today'); toast('This device\'s progress is now saved to your account'); } catch (e) { toast(e.message); } },
  syncFresh: async () => { try { localStorage.setItem(SAFE_KEY, JSON.stringify(packState(S))); } catch (e) { } S = defaultState(); migrate(); S.profile.onboarded = true; S.meta.ownerUid = Account.user().uid; save(true); await Account.pushState().catch(() => { }); closeModal(); go('today'); toast('Fresh start in this account. The previous device data is kept as an undo copy.'); },
  authSignOut: () => modal(`<h2>Sign out?</h2><p class="small">Your progress stays safe in your account.</p><div class="stack"><button class="btn block" data-act="authOut" data-arg="keep">Sign out, keep a copy on this device</button><button class="btn block danger" data-act="authOut" data-arg="remove">Sign out and remove my data from this device</button><button class="btn ghost" data-act="closeModal">Cancel</button></div>`),
  authOut: async how => { await Account.signOut(how === 'remove'); closeModal(); applyTheme(); ensurePlan(true); go('today'); toast(how === 'remove' ? 'Signed out. This device no longer has your data.' : 'Signed out'); },
  authDelAsk: () => { U.confirmDelAcc = true; render(); },
  authDelCancel: () => { U.confirmDelAcc = false; render(); },
  authDelete: async () => { try { await Account.deleteEverything(); U.confirmDelAcc = false; go('today'); toast('Account and cloud data deleted'); } catch (e) { toast(e.message + (/sign in again/i.test(e.message) ? '' : '')); } },
  accountLater: () => { S.meta.accountPromptOff = addDays(today(), 14); save(); render(); },
  restoreUndo: () => { let raw = null; try { raw = localStorage.getItem(SAFE_KEY); } catch (e) { } if (!raw) { toast('No undo copy on this device'); return; } restorePreview(JSON.stringify(unpackState(JSON.parse(raw)))); }
});

boot();
</script></body></html>
