<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1F6B57"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="favicon-32.png" sizes="32x32"><link rel="apple-touch-icon" href="apple-touch-icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Interview Coach"><meta name="description" content="Daily Senior Full-Stack interview preparation"><title>Interview Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>:root{
  --bg:#F3F4F1; --surface:#FFFFFF; --surface-2:#F8F9F6; --ink:#17201D; --ink-2:#44504B; --muted:#6B7772; --line:#DDE2DC; --line-2:#C9D0C8;
  --accent:#1F6B57; --accent-ink:#FFFFFF; --accent-soft:#E2EFEA; --focus:#C1661B; --focus-soft:#F8EADC;
  --good:#1E7A4A; --good-soft:#E0F1E6; --warn:#A8700C; --warn-soft:#F6ECD4; --bad:#B23A32; --bad-soft:#F6E1DE; --info:#2F5A9E; --info-soft:#E3EAF5;
  --shadow:0 1px 2px rgba(23,32,29,.06),0 4px 16px rgba(23,32,29,.05);
  --r:10px; --r-sm:7px;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111715; --surface:#18201D; --surface-2:#1D2622; --ink:#E6ECE8; --ink-2:#BAC5BF; --muted:#8C9993; --line:#2A3531; --line-2:#37443F;
  --accent:#4FB395; --accent-ink:#0E1512; --accent-soft:#1D332B; --focus:#E39A57; --focus-soft:#3A2A1B;
  --good:#5CC48B; --good-soft:#18301F; --warn:#E0B04E; --warn-soft:#33291A; --bad:#E57A70; --bad-soft:#3A1F1C; --info:#86A9E0; --info-soft:#1E2838;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#111715; --surface:#18201D; --surface-2:#1D2622; --ink:#E6ECE8; --ink-2:#BAC5BF; --muted:#8C9993; --line:#2A3531; --line-2:#37443F;
  --accent:#4FB395; --accent-ink:#0E1512; --accent-soft:#1D332B; --focus:#E39A57; --focus-soft:#3A2A1B;
  --good:#5CC48B; --good-soft:#18301F; --warn:#E0B04E; --warn-soft:#33291A; --bad:#E57A70; --bad-soft:#3A1F1C; --info:#86A9E0; --info-soft:#1E2838;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:26px;font-weight:700;line-height:1.15}
h2{font-size:19px;font-weight:650}
h3{font-size:15px;font-weight:650}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* layout */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);background:var(--surface);padding:20px 12px;display:flex;flex-direction:column;gap:4px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 16px}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 13px var(--f-mono)}
.brand b{font-family:var(--f-display);font-size:16px;display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:12px}
.nav-btn{display:flex;align-items:center;gap:10px;border:0;background:none;padding:9px 10px;border-radius:8px;cursor:pointer;text-align:left;color:var(--ink-2);font-weight:500}
.nav-btn:hover{background:var(--surface-2);color:var(--ink)}
.nav-btn.on{background:var(--accent-soft);color:var(--accent);font-weight:650}
.nav-btn svg{width:18px;height:18px;flex:none}
.nav-btn .pill{margin-left:auto}
.side-foot{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.main{min-width:0;padding-block:24px 96px;padding-inline:28px}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.topbar .search{flex:1;min-width:180px;max-width:420px;margin-left:auto}
.bottom-nav{display:none}

@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .main{padding-inline:16px;padding-block:14px 110px}
  .bottom-nav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:30}
  .bottom-nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:4px;cursor:pointer}
  .bottom-nav button.on{color:var(--accent);font-weight:650}
  .bottom-nav svg{width:22px;height:22px}
  h1{font-size:22px}
}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.flat{box-shadow:none}
.card.hero{border-color:var(--line-2);box-shadow:var(--shadow);gap:14px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:860px){.g2,.g3{grid-template-columns:1fr}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:8px}
.stack.lg{gap:14px}
.muted{color:var(--muted)}
.small{font-size:13px}
.xs{font-size:12px}
.eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:650}
.divider{height:1px;background:var(--line);margin:2px 0}
.hide-sm{} @media (max-width:860px){.hide-sm{display:none!important}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:var(--r-sm);cursor:pointer;font-weight:600;font-size:14px;line-height:1.2;min-height:38px;text-decoration:none}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.focus{background:var(--focus);border-color:var(--focus);color:#fff}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.big{padding:14px 26px;font-size:17px;min-height:52px;border-radius:10px}
.btn.block{width:100%}
.btn.sm{padding:5px 10px;min-height:30px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13.5px;font-weight:550;color:var(--ink-2)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg{align-self:flex-start;max-width:100%;display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);padding:7px 12px;cursor:pointer;font-size:13.5px;font-weight:550;color:var(--ink-2);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--accent-soft);color:var(--accent)}

/* pills / states */
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:650;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.pill.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.pill.focus{background:var(--focus-soft);color:var(--focus);border-color:transparent}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:currentColor}

/* forms */
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.lbl{font-size:12.5px;font-weight:650;color:var(--ink-2)}
.input,select.input,textarea.input{border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r-sm);padding:9px 11px;width:100%;min-width:0}
textarea.input{resize:vertical;min-height:90px;line-height:1.5}
.input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.check{display:flex;gap:8px;align-items:flex-start;font-size:14px;cursor:pointer}
.check input{margin-top:3px;accent-color:var(--accent)}

/* progress */
.bar{height:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.thin{height:6px}
.bar.focus>i{background:var(--focus)}

/* plan list */
.plan{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.plan-item{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--surface)}
.plan-item:last-child{border-bottom:0}
.plan-item .tick{width:22px;height:22px;border-radius:50%;border:2px solid var(--line-2);display:grid;place-items:center;font-size:12px;color:var(--accent-ink)}
.plan-item.done .tick{background:var(--accent);border-color:var(--accent)}
.plan-item.done .t{text-decoration:line-through;color:var(--muted)}
.plan-item.cur{background:var(--accent-soft)}
.plan-item .t{font-weight:600}
.plan-item .why{font-size:12.5px;color:var(--muted)}

/* stat tile */
.stat{display:flex;flex-direction:column;gap:2px;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);min-width:0}
.stat b{font:650 24px/1.15 var(--f-mono);font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}

/* goal strip */
.goal{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.goal .target{font-family:var(--f-display);font-weight:650;font-size:15px}
.ring{--p:0;width:44px;height:44px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--surface-2) 0);display:grid;place-items:center;flex:none}
.ring::after{content:attr(data-v);width:34px;height:34px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font:650 11px var(--f-mono)}

/* banners */
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 16px;border-radius:var(--r);border:1px solid transparent}
.banner.focus{background:var(--focus-soft);border-color:color-mix(in srgb,var(--focus) 35%,transparent)}
.banner.info{background:var(--info-soft)}
.banner.acc{background:var(--accent-soft)}
.banner.bad{background:var(--bad-soft)}
.banner b{font-weight:700}

/* question card */
.qcard{display:flex;flex-direction:column;gap:14px}
.qtext{font-family:var(--f-display);font-size:22px;font-weight:600;line-height:1.3;text-wrap:balance}
@media (max-width:860px){.qtext{font-size:19px}}
.answer{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:14px;line-height:1.6;white-space:pre-wrap}
.frame{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12.5px}
.frame span{padding:3px 8px;border-radius:6px;background:var(--info-soft);color:var(--info);font-weight:650}
.frame i{color:var(--muted);font-style:normal}
.timer{font:600 28px var(--f-mono);font-variant-numeric:tabular-nums}
.timer.over{color:var(--bad)}
.rate{display:flex;gap:6px}
.rate button{width:40px;height:40px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font:600 15px var(--f-mono)}
.rate button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grade button{padding:12px 6px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-weight:650}
.grade button.g.on{background:var(--good);color:#fff;border-color:var(--good)}
.grade button.p.on{background:var(--warn);color:#fff;border-color:var(--warn)}
.grade button.b.on{background:var(--bad);color:#fff;border-color:var(--bad)}
.kw{display:flex;flex-wrap:wrap;gap:5px}
.kw span{font-size:12px;padding:2px 7px;border-radius:5px;border:1px solid var(--line)}
.kw span.hit{background:var(--good-soft);color:var(--good);border-color:transparent}
.kw span.miss{color:var(--muted);border-style:dashed}

/* list */
.qlist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.qrow{display:grid;grid-template-columns:1fr auto;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer;align-items:center}
.qrow:last-child{border-bottom:0}
.qrow:hover{background:var(--surface-2)}
.qrow .q{font-weight:550;line-height:1.35}
.qrow .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line-2);border-radius:var(--r)}

/* heatmap */
.heat{display:flex;flex-direction:column;gap:12px}
.heat-row{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:start}
.heat-cells{display:flex;flex-wrap:wrap;gap:6px}
.cell{font-size:12.5px;padding:6px 10px;border-radius:7px;cursor:pointer;border:1px solid var(--line);background:var(--surface);font-weight:550;display:flex;gap:6px;align-items:center}
.cell[data-s="new"]{color:var(--muted)}
.cell[data-s="learning"]{background:var(--info-soft);color:var(--info);border-color:transparent}
.cell[data-s="weak"]{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.cell[data-s="improving"]{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.cell[data-s="strong"]{background:var(--good-soft);color:var(--good);border-color:transparent}
.cell[data-s="mastered"]{background:var(--good);color:#fff;border-color:transparent}
@media (max-width:600px){.heat-row{grid-template-columns:1fr}}

/* table */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:13.5px;background:var(--surface)}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:650;background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,15,13,.45);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:14px;max-width:560px;width:100%;max-height:calc(100vh - 32px);overflow:auto;padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;z-index:60;font-weight:600;font-size:14px;max-width:calc(100% - 32px)}
@media (min-width:861px){.toast{bottom:24px}}

/* charts */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:11px var(--f-mono)}
.chart .grid-l{stroke:var(--line);stroke-width:1}
.chart .mk{fill:var(--accent)}
.chart .mk:hover{fill:var(--focus)}
.chart .ln{stroke:var(--accent);stroke-width:2;fill:none}
.chart .ar{fill:var(--accent);opacity:.12}
.chart .pt{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.hbar{display:grid;grid-template-columns:120px 1fr 48px;gap:10px;align-items:center;font-size:13px}
.hbar .bar{height:10px}
.insight{padding:10px 12px;border-left:3px solid var(--accent);background:var(--surface-2);border-radius:0 8px 8px 0;font-size:14px}
.kbd{font:600 11px var(--f-mono);padding:1px 5px;border:1px solid var(--line-2);border-radius:4px}

.reduce-motion *,.reduce-motion *::before,.reduce-motion *::after{animation:none!important;transition:none!important}
.tabs-scroll{gap:6px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-bottom:2px}.tabs-scroll::-webkit-scrollbar{display:none}.tabs-scroll .chip{flex:0 0 auto}
.rec-dot{width:12px;height:12px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 0 color-mix(in srgb,var(--bad) 60%,transparent);animation:recp 1.2s infinite}
@keyframes recp{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--bad) 55%,transparent)}70%{box-shadow:0 0 0 10px transparent}100%{box-shadow:0 0 0 0 transparent}}
.pulse{width:12px;height:12px;border-radius:50%;background:var(--accent);animation:pl 1s ease-in-out infinite alternate}
@keyframes pl{from{opacity:.35;transform:scale(.8)}to{opacity:1;transform:scale(1.1)}}
.problem{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line)}
.problem:last-child{border-bottom:0}
.problem .ar{font-weight:650;white-space:nowrap}
.checkl{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.checkl:last-child{border-bottom:0}
.checkl .tick{flex:0 0 auto}
.hintline{font:600 12.5px/1.3 var(--f-mono);color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:4px 8px;align-self:flex-start;max-width:100%}
.stat .up{color:var(--good);font-weight:650}.stat .down{color:var(--bad);font-weight:650}
.card.improve{border-color:var(--good);background:color-mix(in srgb,var(--good-soft) 60%,var(--surface))}
.ans-row{border-bottom:1px solid var(--line);padding:8px 0}.ans-row summary{cursor:pointer;list-style:none}.ans-row summary::-webkit-details-marker{display:none}
.focus-task h1{font-size:28px}
body.focusing .side,body.focusing .bottom-nav{display:none!important}
body.focusing .app{grid-template-columns:1fr}
body.focusing .main{padding-bottom:32px}
body.focusing .wrap{max-width:760px}
.hline{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;font-size:15px}
.today-card h2{font-size:30px;font-family:var(--f-mono);font-weight:650}
.tasks{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px}
.task{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}.task .tick{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;font-size:11px;color:var(--accent-ink)}
.task.done .tick{background:var(--accent);border-color:var(--accent)}.task.done .tl{color:var(--muted);text-decoration:line-through}.task.cur{background:var(--accent-soft)}
.time-chips{gap:6px}.chip.sm{padding:4px 10px;font-size:12.5px}
.sticky-start{position:sticky;bottom:12px;z-index:5}
@media (max-width:860px){.sticky-start{bottom:calc(70px + env(safe-area-inset-bottom))}}

<script>window.BANK=[{"id":"c01","category":".NET","topic":"OOPS Concepts","difficulty":"Medium","question":"What are the four pillars of OOP? Explain each with a real example.","answer":"One line: OOP organises code around objects that combine data and behaviour. The four pillars are encapsulation, abstraction, inheritance and polymorphism.\n\n• Encapsulation – keep data private and expose it through methods/properties that protect the rules. Example: Employee has a private _salary and a Salary property that rejects negative values.\n• Abstraction – expose only what the caller needs, hide the how. Example: IPaymentService.Pay(order); the controller doesn't know whether it's Razorpay or Stripe.\n• Inheritance – a derived class reuses and extends a base class. Example: PermanentEmployee : Employee reuses Name, Id and CalculateSalary().\n• Polymorphism – one call, different behaviour by type. Compile time = overloading; runtime = virtual/override. Example: employee.CalculateSalary() runs the permanent or contract version depending on the actual object.\n\nIn my project: our services are all behind interfaces (abstraction), registered in DI, and swapped in unit tests with mocks (polymorphism).","source":"Core priority list","core":true,"tier":1},{"id":"c02","category":".NET","topic":"OOPS Concepts","difficulty":"Medium","question":"What is an abstract class? When would you use one?","answer":"An abstract class is a base class that cannot be instantiated. It can contain both implemented members and abstract members (no body) that derived classes must override. It can have fields, constructors and access modifiers.\n\npublic abstract class Employee {\n  public string Name { get; set; }\n  public decimal Basic { get; set; }\n  public abstract decimal CalculateSalary();      // must implement\n  public string GetInfo() => $\"{Name}\";           // shared code\n}\npublic class PermanentEmployee : Employee {\n  public override decimal CalculateSalary() => Basic * 1.4m;\n}\n\nUse it when related classes share real code/state and you want a common base (\"is-a\" relationship). Its constructor runs when a derived object is created.\nTrade-off: a class can inherit only one abstract class, so it couples the hierarchy more tightly than an interface.","source":"Core priority list","core":true,"tier":1},{"id":"c03","category":".NET","topic":"OOPS Concepts","difficulty":"Medium","question":"What is an interface? What are its advantages, and why do interfaces work so well in real projects?","answer":"An interface is a contract: it declares what a type must do (methods, properties, events) without saying how. A class can implement many interfaces.\n\npublic interface IEmailSender { Task SendAsync(string to, string body); }\npublic class SmtpEmailSender : IEmailSender { ... }\n\nAdvantages / why they work:\n1. Loose coupling – callers depend on IEmailSender, not SmtpEmailSender, so the implementation can change without touching callers (Dependency Inversion).\n2. Dependency Injection – builder.Services.AddScoped<IEmailSender, SmtpEmailSender>(); the container supplies it.\n3. Unit testing – mock the interface (Moq) so tests don't send real emails or hit the DB.\n4. Multiple inheritance of type – class Report : IExportable, IPrintable.\n5. Consistency – every implementation is forced to provide the same members.\n\nSince C# 8, interfaces can have default implementations, but they still cannot hold instance fields or constructors.","source":"Core priority list","core":true,"tier":1},{"id":"c04","category":".NET","topic":"OOPS Concepts","difficulty":"Medium","question":"Abstract class vs Interface – what are the differences and when do you choose which?","answer":"• Implementation: abstract class can have full methods + abstract ones; interface is mainly declarations (default methods allowed since C# 8).\n• State: abstract class can have fields and constructors; interface cannot have instance fields or constructors.\n• Inheritance: a class inherits only ONE abstract class but can implement MANY interfaces.\n• Access modifiers: abstract class members can be private/protected; interface members are public by default.\n• Relationship: abstract class = \"is-a\" with shared code; interface = \"can-do\" capability/contract.\n\nChoose abstract class when related types share code and state (Employee → Permanent/Contract).\nChoose interface for contracts across unrelated types, for DI and mocking, and when you need multiple inheritance (IRepository<T>, ILogger).\nIn practice I usually combine them: IEmployeeService interface for DI, and an abstract base class for shared logic inside the implementations.","source":"Core priority list","core":true,"tier":1},{"id":"c05","category":".NET","topic":"OOPS Concepts","difficulty":"Medium","question":"What is the virtual keyword? How is it used with override, sealed and new?","answer":"virtual marks a base-class method/property as overridable. A derived class uses override to replace it, and the call is resolved at RUNTIME based on the actual object type (runtime polymorphism).\n\nclass Employee { public virtual decimal Bonus() => 1000; }\nclass Manager : Employee { public override decimal Bonus() => 5000; }\nEmployee e = new Manager();\ne.Bonus();   // 5000 – runtime type wins\n\n• Without virtual you cannot override (compile error).\n• sealed override stops further overriding down the chain.\n• new hides the base member instead of overriding: calling through a base reference runs the base version.\n• abstract members are implicitly virtual; static and private members cannot be virtual.\nTrade-off: virtual calls allow extension but make behaviour depend on subclasses, so mark only intended extension points as virtual.","source":"Core priority list","core":true,"tier":1},{"id":"c06","category":".NET","topic":"OOPS Concepts","difficulty":"Easy","question":"Method overloading vs method overriding?","answer":"Overloading (compile-time polymorphism): same method name, different parameter list (number, type or order) in the same class. Return type alone is not enough.\n  int Add(int a, int b); double Add(double a, double b); int Add(int a, int b, int c);\n\nOverriding (runtime polymorphism): derived class provides a new implementation of a base method with the SAME signature. Base must be virtual/abstract, derived uses override.\n  class Shape { public virtual double Area() => 0; }\n  class Circle : Shape { public override double Area() => Math.PI * r * r; }\n\nKey differences: same class vs base/derived; different vs same signature; resolved at compile time vs runtime; no keyword vs virtual/override.\nInterview line: \"Overloading is compile-time polymorphism; overriding is runtime polymorphism – it enables behaviour substitution at execution time.\"","source":"Core priority list","core":true,"tier":1},{"id":"c07","category":".NET","topic":"OOPS Concepts","difficulty":"Senior","question":"Inheritance ambiguity: what is the diamond problem and how does C# solve it?","answer":"Diamond problem: if class D inherited from B and C, and both override A's method, D wouldn't know which version to use. C# avoids it by not allowing multiple CLASS inheritance.\n\nWith interfaces, two interfaces can declare the same member. If the meaning is the same, one public method satisfies both. If they differ, use explicit interface implementation:\n\ninterface IPrinter { void Print(); }\ninterface IScanner { void Print(); }\nclass Device : IPrinter, IScanner {\n  void IPrinter.Print() => Console.WriteLine(\"Printer\");\n  void IScanner.Print() => Console.WriteLine(\"Scanner\");\n}\n((IPrinter)d).Print();  // Printer\n((IScanner)d).Print();  // Scanner\n\nExplicit implementations are only reachable through the interface reference. For C# 8 default interface methods with the same name, the class must provide its own implementation, otherwise it's a compile error, so ambiguity is always resolved explicitly.","source":"Core priority list","core":true,"tier":1},{"id":"c08","category":".NET","topic":"OOPS Concepts","difficulty":"Senior","question":"Output question: base and derived classes with virtual, override and new. What prints?","answer":"class A { public virtual void Show() => Console.Write(\"A \");\n          public void Hi() => Console.Write(\"A-Hi \"); }\nclass B : A { public override void Show() => Console.Write(\"B \");\n              public new void Hi() => Console.Write(\"B-Hi \"); }\n\nA obj = new B();\nobj.Show();   // B      → override: runtime type (B) decides\nobj.Hi();     // A-Hi   → new hides: compile-time type (A) decides\n((B)obj).Hi(); // B-Hi\n\nB b = new B(); b.Show(); // B\n\nRule to say in the interview: \"override is resolved by the object's runtime type; new (hiding) is resolved by the reference's compile-time type.\" Also: a derived reference can't point to a base object (B b = new A() is a compile error).","source":"Core priority list","core":true,"tier":1},{"id":"c09","category":".NET","topic":"OOPS Concepts","difficulty":"Senior","question":"Output question: in what order do constructors run in an inheritance chain (including static constructors)?","answer":"class A { static A() => Write(\"sA \"); public A() => Write(\"A \"); }\nclass B : A { static B() => Write(\"sB \"); public B() => Write(\"B \"); }\nnew B();   // sB sA A B\n\nWhy:\n• Static constructors run once per type, before first use. Creating B triggers B's static ctor, then initialising the base triggers A's static ctor.\n• Instance constructors run base first, then derived (base part of the object must exist first). With parameters use : base(x).\n• Field initialisers of the derived class run BEFORE the base constructor call.\nDestruction/finalizers run in the reverse order (derived, then base).\nCommon follow-up: a virtual call from the base constructor runs the derived override before the derived constructor body has run, so avoid calling virtual methods in constructors.","source":"Core priority list","core":true,"tier":1},{"id":"c10","category":".NET","topic":"C# Essentials","difficulty":"Easy","question":"ref vs out (and in) parameters?","answer":"All three pass an argument by reference (no copy).\n• ref – variable MUST be initialised before the call; the method may read and change it. Two-way.\n• out – need not be initialised before the call; the method MUST assign it before returning. Used to return extra values.\n• in – read-only reference; the method cannot modify it. Useful for large structs to avoid copying.\n\nvoid Increase(ref int x) => x += 10;\nbool TryParseAge(string s, out int age) => int.TryParse(s, out age);\ndouble Length(in Point p) => Math.Sqrt(p.X * p.X + p.Y * p.Y);\n\nReal use: int.TryParse(input, out var value) – returns success and the value together. Trade-off: many out params hurt readability; today a tuple or result object is often cleaner.","source":"Core priority list","core":true,"tier":1},{"id":"c11","category":".NET","topic":"C# Essentials","difficulty":"Easy","question":"readonly vs const (and static readonly)?","answer":"const\n• Compile-time constant, value fixed at declaration, implicitly static.\n• Only primitive types/strings/enums. The value is copied into calling assemblies, so changing it requires recompiling them.\nreadonly\n• Runtime constant: assigned at declaration OR in the constructor, then cannot change.\n• Can be any type, and can differ per instance (e.g. set from constructor parameter).\nstatic readonly\n• One value for the class, set once at runtime, e.g. from config or DateTime.Now.\n\npublic const double Pi = 3.14159;\npublic readonly DateTime CreatedOn;          // set in ctor\npublic static readonly HttpClient Client = new();\n\nRule: const for values that never change (tax codes, math constants); readonly/static readonly for values known only at runtime or non-primitive objects.\nNote: const values are inlined into the calling assembly's IL at compile time, so changing a public const needs every consumer recompiled. In real apps prefer static readonly for values that might change.","source":"Core priority list","core":true,"tier":1},{"id":"c12","category":".NET","topic":"C# Essentials","difficulty":"Easy","question":"What are the uses of the using keyword in C#?","answer":"1. using directive – import a namespace: using System.Text;  (plus global using in .NET 6+ and aliases: using Json = System.Text.Json;)\n2. using static – access static members directly: using static System.Math; Sqrt(4);\n3. using statement / declaration – guarantees Dispose() is called on IDisposable objects even if an exception occurs:\n\nusing (var con = new SqlConnection(cs)) { con.Open(); ... }   // Dispose at end of block\nusing var reader = cmd.ExecuteReader();                        // C# 8: disposed at end of scope\nawait using var stream = ...;                                   // IAsyncDisposable\n\nThe compiler turns the statement into try/finally { Dispose(); }. Use it for DB connections, file streams, HttpResponseMessage – anything holding unmanaged resources. Note: don't wrap HttpClient in using per request; reuse it via IHttpClientFactory.","source":"Core priority list","core":true,"tier":1},{"id":"c13","category":".NET","topic":"C# Essentials","difficulty":"Medium","question":"Class vs Structure (struct)?","answer":"• Type: class is a reference type (heap, variable holds a reference); struct is a value type (stored inline/stack, variable holds the data).\n• Assignment: copying a class copies the reference (both point to one object); copying a struct copies the whole value.\n• Inheritance: classes support inheritance; structs cannot inherit (they can implement interfaces) and are implicitly sealed.\n• Null: class can be null; struct cannot (unless Nullable<T>).\n• Default constructor: struct always has a default value; classes need new.\n• GC: structs avoid heap allocation and GC pressure, but boxing a struct (to object/interface) allocates.\n\nUse struct for small, immutable, value-like data (Point, Money, DateTime is a struct). Use class for entities, services and anything large or with identity. A big mutable struct causes expensive copies and bugs from modifying copies.","source":"Core priority list","core":true,"tier":1},{"id":"c14","category":".NET","topic":"C# Essentials","difficulty":"Easy","question":"Exception handling: how do try, catch and finally work? Does finally run after a return?","answer":"try – code that may throw.\ncatch – handles specific exceptions; order from most specific to most general (only the first matching catch runs).\nfinally – always runs, success or failure, for cleanup (close connection, release lock).\n\ntry {\n  var order = await repo.GetAsync(id);\n  return Ok(order);\n}\ncatch (SqlException ex) { _log.LogError(ex, \"DB error\"); return StatusCode(503); }\ncatch (Exception ex)   { _log.LogError(ex, \"Unexpected\"); throw; }\nfinally { _timer.Stop(); }\n\nYes, finally runs even after return inside try/catch; the return value is computed first, then finally runs. It doesn't run only if the process is killed (e.g. Environment.FailFast, StackOverflow).\nBest practice: catch only what you can handle; don't swallow exceptions; use when-filters: catch (HttpRequestException ex) when (ex.StatusCode == 404).","source":"Core priority list","core":true,"tier":1},{"id":"c15","category":".NET","topic":"C# Essentials","difficulty":"Medium","question":"What is the difference between throw and throw ex?","answer":"throw;   – rethrows the SAME exception and preserves the original stack trace, so logs show where the error actually happened.\nthrow ex; – rethrows but RESETS the stack trace to the current line; you lose the original source of the error.\n\ncatch (Exception ex) {\n  _logger.LogError(ex, \"Failed saving order\");\n  throw;                       // ✓ keeps stack trace\n  // throw ex;                 // ✗ trace starts here\n  // throw new OrderException(\"Save failed\", ex);  // ✓ wrap with context, original kept as InnerException\n}\n\nRule: use throw; to rethrow, or throw a new custom exception passing the original as innerException when adding context. Never throw ex.\nInterview line: \"In production code I always use throw; (or wrap with an inner exception) so the original stack trace is preserved.\"","source":"Core priority list","core":true,"tier":1},{"id":"c16","category":".NET","topic":"C# Essentials","difficulty":"Medium","question":"How do you implement global exception handling in ASP.NET Core?","answer":"Goal: one place that catches unhandled exceptions, logs them, and returns a consistent error response (ProblemDetails) instead of stack traces.\n\nOptions:\n1. Custom middleware (most common answer):\npublic class ExceptionMiddleware(RequestDelegate next, ILogger<ExceptionMiddleware> log) {\n  public async Task InvokeAsync(HttpContext ctx) {\n    try { await next(ctx); }\n    catch (NotFoundException ex) { ctx.Response.StatusCode = 404; await ctx.Response.WriteAsJsonAsync(new { error = ex.Message }); }\n    catch (Exception ex) {\n      log.LogError(ex, \"Unhandled\");\n      ctx.Response.StatusCode = 500;\n      await ctx.Response.WriteAsJsonAsync(new { error = \"Something went wrong\", traceId = ctx.TraceIdentifier });\n    }\n  }\n}\napp.UseMiddleware<ExceptionMiddleware>();   // register FIRST in the pipeline\n2. Built-in: app.UseExceptionHandler(\"/error\") + AddProblemDetails().\n3. .NET 8+: implement IExceptionHandler, register with AddExceptionHandler<GlobalExceptionHandler>().\n4. Exception filters (IExceptionFilter) – only catch MVC action exceptions, not middleware errors.\nMention: map custom exceptions to status codes, log with correlation id, never leak internal details in production.\nAlso mention: return errors as ProblemDetails (RFC 7807), log with a correlation/trace ID, never leak stack traces to clients. Interview line: \"Centralised exception handling ensures consistency and observability.\"","source":"Core priority list","core":true,"tier":1},{"id":"c17","category":".NET","topic":"C# Essentials","difficulty":"Medium","question":"How do async and await work? Does async create a new thread?","answer":"async marks a method that contains await; the compiler turns it into a state machine. await on a Task pauses the METHOD (not the thread): the thread returns to the pool, and when the I/O completes the method resumes (possibly on another thread).\n\npublic async Task<Order> GetOrderAsync(int id) {\n  var order = await _db.Orders.FindAsync(id);   // thread freed during DB call\n  return order;\n}\n\n• No, async/await doesn't create a new thread for I/O work. Task.Run is what queues CPU work to a thread-pool thread.\n• Benefit: scalability – a web server handles more concurrent requests with the same threads, because threads aren't blocked waiting on DB/HTTP.\n• Rules: async all the way; return Task/Task<T> (async void only for event handlers); don't block with .Result/.Wait(); use Task.WhenAll for independent calls in parallel; pass CancellationToken.","source":"Core priority list","core":true,"tier":1},{"id":"c18","category":".NET","topic":"C# Essentials","difficulty":"Medium","question":"Task.Delay vs Thread.Sleep?","answer":"Thread.Sleep(2000) – BLOCKS the current thread for 2 seconds. The thread can do nothing else; in ASP.NET it wastes a thread-pool thread, and on a UI thread it freezes the UI.\nawait Task.Delay(2000) – asynchronous wait. It creates a timer-based Task; the thread is released and the method resumes after 2 seconds. Supports cancellation: Task.Delay(2000, token).\n\nUse Task.Delay in async code (retry back-off, polling, background services). Thread.Sleep only in rare synchronous code such as simple console tools or tests.\nFollow-up: Task.Delay(...).Wait() is as bad as Thread.Sleep because .Wait() blocks.","source":"Core priority list","core":true,"tier":1},{"id":"c19","category":".NET","topic":"C# Essentials","difficulty":"Senior","question":"What causes an async deadlock with .Result or .Wait(), and how do you avoid it?","answer":"Blocking on async code (.Result, .Wait(), GetAwaiter().GetResult()) blocks the calling thread. In apps with a synchronization context (WinForms/WPF, old ASP.NET), the awaited continuation needs that same blocked thread to resume → both wait forever = deadlock. ASP.NET Core has no sync context, so it usually doesn't deadlock, but it still causes thread-pool starvation under load.\n\nAvoid it:\n• Async all the way down – make callers async and await.\n• In library code use ConfigureAwait(false) so continuations don't need the original context.\n• Never async void except event handlers (exceptions can't be caught and can crash the process).\n• For fire-and-forget background work use a queue + BackgroundService, not unawaited tasks.","source":"Core priority list","core":true,"tier":1},{"id":"c20","category":"Architecture","topic":"SOLID Principles","difficulty":"Medium","question":"What is the Single Responsibility Principle? Give an example.","answer":"A class should have only one reason to change – one job.\n\nViolation:\nclass InvoiceService { Calculate(); SaveToDb(); SendEmail(); GeneratePdf(); }\nAny change to email, DB or PDF logic changes this class.\n\nFix – split by responsibility:\nInvoiceCalculator, IInvoiceRepository, IEmailSender, IPdfGenerator, and an InvoiceService that coordinates them.\n\nBenefit: smaller classes, easier testing, fewer merge conflicts, changes don't ripple. Trade-off: too much splitting creates many tiny classes, so group by reason to change, not by method count.","source":"Core priority list","core":true,"tier":1},{"id":"c21","category":"Architecture","topic":"SOLID Principles","difficulty":"Medium","question":"What is the Open/Closed Principle? Give an example.","answer":"Software entities should be open for extension but closed for modification: add new behaviour by adding code, not by editing tested code.\n\nViolation:\ndecimal GetDiscount(string type) { if (type==\"Gold\") ... else if (type==\"Silver\") ... }  // every new type edits this method\n\nFix – polymorphism/strategy:\ninterface IDiscountStrategy { decimal Apply(decimal amount); }\nclass GoldDiscount : IDiscountStrategy { ... }\nclass PlatinumDiscount : IDiscountStrategy { ... }   // new type = new class, no edit\n\nIn ASP.NET Core, middleware and DI follow OCP: you add a new middleware or register a new implementation without changing existing ones.","source":"Core priority list","core":true,"tier":1},{"id":"c22","category":"Architecture","topic":"SOLID Principles","difficulty":"Senior","question":"What is the Liskov Substitution Principle? Give an example of a violation.","answer":"Objects of a derived class must be usable wherever the base class is expected without breaking correctness. A subclass must honour the base class's contract.\n\nClassic violation: Square : Rectangle. Setting Width on a Square also changes Height, so code that sets width 5, height 4 and expects area 20 gets 16.\nAnother: ReadOnlyFile : File where Write() throws NotSupportedException – callers of File break.\n\nFix: rethink the hierarchy – use a common abstraction (IShape with Area()) or separate interfaces (IReadable, IWritable).\nSigns of violation: overrides that throw NotImplementedException, type checks like if (x is Square), or subclasses that weaken guarantees.","source":"Core priority list","core":true,"tier":1},{"id":"c23","category":"Architecture","topic":"SOLID Principles","difficulty":"Medium","question":"What is the Interface Segregation Principle? Give an example.","answer":"Clients should not be forced to depend on methods they don't use. Prefer several small, focused interfaces over one fat interface.\n\nViolation:\ninterface IWorker { void Work(); void Eat(); }   // a Robot must implement Eat()\n\nFix:\ninterface IWorkable { void Work(); }\ninterface IFeedable { void Eat(); }\nclass Human : IWorkable, IFeedable {}\nclass Robot : IWorkable {}\n\nProject example: instead of one IRepository with 20 methods, have IReadRepository<T> and IWriteRepository<T>, so report services only get read access. Benefit: fewer dummy implementations, easier mocking, clearer intent.","source":"Core priority list","core":true,"tier":1},{"id":"c24","category":"Architecture","topic":"SOLID Principles","difficulty":"Medium","question":"What is the Dependency Inversion Principle? How is it different from Dependency Injection?","answer":"DIP: high-level modules should not depend on low-level modules; both depend on abstractions. Abstractions shouldn't depend on details.\n\nViolation:\nclass OrderService { private SqlOrderRepository _repo = new SqlOrderRepository(); }   // tied to SQL\n\nFix:\nclass OrderService {\n  private readonly IOrderRepository _repo;\n  public OrderService(IOrderRepository repo) => _repo = repo;\n}\n\nDIP is the principle (depend on interfaces). Dependency Injection is the technique that supplies the concrete object from outside (constructor injection via the ASP.NET Core container). IoC container is the tool that does it.\nBenefit: swap SQL for Mongo or a mock in tests without changing OrderService.","source":"Core priority list","core":true,"tier":1},{"id":"c25","category":".NET","topic":"Project Architecture","difficulty":"Medium","question":"Explain the ASP.NET Core request lifecycle (from request to response).","answer":"1. Client sends HTTP request → Kestrel (optionally behind IIS/Nginx reverse proxy).\n2. Program.cs has built the host: services registered in the DI container, and the middleware pipeline configured.\n3. Request flows through middleware in order: exception handling → HTTPS redirection → static files → routing → CORS → authentication → authorization → custom middleware → endpoint.\n4. Routing matches the URL to a controller action (endpoint).\n5. MVC filters run: authorization → resource → model binding & validation → action filters → the action executes (calls services/repositories via DI).\n6. The action returns a result (Ok(dto), NotFound()) → result filters → response is serialized to JSON.\n7. Response flows back through the middleware in reverse order to the client.\nOne scoped DI scope is created per request and disposed at the end (DbContext lives here).","source":"Core priority list","core":true,"tier":1},{"id":"c26","category":".NET","topic":"Project Architecture","difficulty":"Medium","question":"Explain your project structure (root components and folder structure).","answer":"Root files: Program.cs (host, DI registration, middleware pipeline), appsettings.json + appsettings.{Environment}.json (config, connection strings), Properties/launchSettings.json (local profiles), .csproj (packages).\n\nTypical layered / clean structure I use:\n• API (presentation): Controllers, Middlewares, Filters, Extensions (service registration), DTOs/Request models.\n• Application: services / use cases, interfaces, validators (FluentValidation), AutoMapper profiles.\n• Domain: entities, enums, business rules – no framework dependencies.\n• Infrastructure: EF Core DbContext, configurations, migrations, repositories, external clients (email, payment).\n• Tests: unit tests (xUnit + Moq) and integration tests.\n\nDependency direction: API → Application → Domain; Infrastructure implements Application's interfaces. Angular client sits in a separate project (src/app with core/, shared/, features/). Say one line about your real project here.","source":"Core priority list","core":true,"tier":1},{"id":"c27","category":".NET","topic":"Middleware","difficulty":"Medium","question":"What is middleware? Explain authentication, authorization and custom middleware, and why order matters.","answer":"Middleware are components in the request pipeline; each can handle the request, call next() to pass it on, and act on the response on the way back.\n\nOrder in Program.cs:\napp.UseExceptionHandler();   // first: catches everything below\napp.UseHttpsRedirection();\napp.UseStaticFiles();\napp.UseRouting();\napp.UseCors(\"AllowAngular\");\napp.UseAuthentication();     // who are you? reads JWT → HttpContext.User\napp.UseAuthorization();      // what can you do? checks [Authorize] roles/policies\napp.MapControllers();\nAuthentication must come before authorization; CORS before auth so preflight gets headers. Wrong order = silent 401s.\n\nCustom middleware:\npublic class RequestTimingMiddleware(RequestDelegate next, ILogger<RequestTimingMiddleware> log) {\n  public async Task InvokeAsync(HttpContext ctx) {\n    var sw = Stopwatch.StartNew();\n    await next(ctx);                               // pass to next\n    log.LogInformation(\"{Path} took {Ms}ms\", ctx.Request.Path, sw.ElapsedMilliseconds);\n  }\n}\napp.UseMiddleware<RequestTimingMiddleware>();\nUses: logging, correlation id, global exception handling, tenant resolution.","source":"Core priority list","core":true,"tier":1},{"id":"c28","category":".NET","topic":"Middleware","difficulty":"Medium","question":"What is the difference between app.Run(), app.Use(), app.Map() and next()?","answer":"• Use – adds middleware that can do work and call next() to continue the pipeline:\n  app.Use(async (ctx, next) => { /* before */ await next(); /* after */ });\n• next() – invokes the next middleware. If you don't call it, you short-circuit (e.g. return 401 early).\n• Run – terminal middleware; receives no next, ends the pipeline. Anything registered after it never runs:\n  app.Run(async ctx => await ctx.Response.WriteAsync(\"Hello\"));\n• Map – branches the pipeline by path prefix: app.Map(\"/health\", b => b.Run(...)). MapWhen branches by any condition; UseWhen branches and rejoins.\nIn minimal APIs, app.MapGet(\"/api/x\", ...) maps an endpoint (different from Map branching).\nInterview line: \"Run ends the pipeline; Use can continue it; Map branches it by path.\"","source":"Core priority list","core":true,"tier":1},{"id":"c29","category":".NET","topic":"EF Core","difficulty":"Medium","question":"EF Core: Code First vs Database First? How do migrations work?","answer":"Code First – you write C# entity classes and DbContext; EF generates the database through migrations.\n  dotnet ef migrations add AddOrderTable\n  dotnet ef database update\n  Schema is versioned in source control; good for new projects and teams owning the DB.\n\nDatabase First – the database already exists; you scaffold entities and DbContext from it:\n  dotnet ef dbcontext scaffold \"connection-string\" Microsoft.EntityFrameworkCore.SqlServer -o Models\n  Good for legacy/DBA-managed databases; regenerate after schema changes.\n\nConfiguration: data annotations or Fluent API in OnModelCreating (keys, relationships, indexes).\nProduction tip: review generated migration SQL (dotnet ef migrations script) instead of auto-migrating on startup; use AsNoTracking for read-only queries; avoid N+1 with Include or projection.","source":"Core priority list","core":true,"tier":1},{"id":"c30","category":".NET","topic":"Routing","difficulty":"Easy","question":"Attribute routing vs conventional routing?","answer":"Conventional routing – one central template maps URLs to controllers/actions by naming convention. Common in MVC apps:\n  app.MapControllerRoute(\"default\", \"{controller=Home}/{action=Index}/{id?}\");\n\nAttribute routing – routes declared on controllers/actions. Standard for Web APIs:\n[ApiController]\n[Route(\"api/[controller]\")]\npublic class OrdersController : ControllerBase {\n  [HttpGet(\"{id:int}\")]  public IActionResult Get(int id) ...\n  [HttpPost]            public IActionResult Create(OrderDto dto) ...\n}\nAdvantages of attribute routing: precise RESTful URLs, route constraints ({id:int}), versioning (api/v1/...), easy to read next to the code. Conventional is less code for many similar MVC pages. [ApiController] requires attribute routing.","source":"Core priority list","core":true,"tier":1},{"id":"c31","category":"Architecture","topic":"Design Patterns","difficulty":"Medium","question":"Explain the controller flow and the MVC pattern.","answer":"MVC separates an app into Model (data + business rules), View (UI/HTML) and Controller (handles the request, coordinates model and view).\n\nFlow: Request → routing picks controller/action → model binding maps the request to parameters → validation (ModelState) → controller calls a service → service uses repository/DbContext → controller returns a result: View(model) for MVC, or Ok(dto)/JSON for Web API → response.\n\nGood practice in controllers: keep them thin (no business logic), accept/return DTOs not entities, use async actions, return correct status codes (201 CreatedAtAction, 204, 404). Benefits: separation of concerns, testability, parallel UI and backend work.","source":"Core priority list","core":true,"tier":1},{"id":"c32","category":"Architecture","topic":"Design Patterns","difficulty":"Senior","question":"What is CQRS? When would you use it?","answer":"Command Query Responsibility Segregation: separate the WRITE side (commands change state: CreateOrderCommand) from the READ side (queries return data: GetOrderByIdQuery), each with its own model and handler.\n\nCommon .NET implementation with MediatR:\npublic record GetOrderQuery(int Id) : IRequest<OrderDto>;\npublic class GetOrderHandler(AppDbContext db) : IRequestHandler<GetOrderQuery, OrderDto> {\n  public async Task<OrderDto> Handle(GetOrderQuery q, CancellationToken ct) =>\n    await db.Orders.AsNoTracking().Where(o => o.Id == q.Id).Select(o => new OrderDto(...)).FirstAsync(ct);\n}\nController: return Ok(await _mediator.Send(new GetOrderQuery(id)));\n\nBenefits: thin controllers, optimised reads (projections, Dapper, read replicas), clear single-purpose handlers, pipeline behaviours for validation/logging.\nTrade-off: more classes and indirection; overkill for simple CRUD. Separate read/write databases add eventual consistency.","source":"Core priority list","core":true,"tier":1},{"id":"c33","category":"Architecture","topic":"Design Patterns","difficulty":"Medium","question":"What is the Singleton pattern? How do you make it thread-safe, and how is it different from AddSingleton?","answer":"Singleton ensures a class has exactly one instance with a global access point: private constructor + static instance.\n\nThread-safe (preferred):\npublic sealed class ConfigCache {\n  private static readonly Lazy<ConfigCache> _instance = new(() => new ConfigCache());\n  public static ConfigCache Instance => _instance.Value;\n  private ConfigCache() { }\n}\nLazy<T> is thread-safe by default. Alternative: double-checked locking with lock.\n\nIn ASP.NET Core we rarely hand-write it: builder.Services.AddSingleton<ICacheService, CacheService>() lets the DI container keep one instance for the app lifetime while keeping it injectable and mockable.\nUse for: caching, configuration, logging. Caution: singletons must be thread-safe and must not depend on scoped services such as DbContext.","source":"Core priority list","core":true,"tier":1},{"id":"c34","category":"Architecture","topic":"Design Patterns","difficulty":"Medium","question":"What is the Factory pattern? Give an example.","answer":"Factory moves object creation into a dedicated method/class, so callers ask for an object by type/key without knowing the concrete class.\n\npublic interface INotifier { Task SendAsync(string msg); }\npublic class NotifierFactory(IServiceProvider sp) {\n  public INotifier Create(string channel) => channel switch {\n    \"email\" => sp.GetRequiredService<EmailNotifier>(),\n    \"sms\"   => sp.GetRequiredService<SmsNotifier>(),\n    _ => throw new ArgumentException(\"Unknown channel\")\n  };\n}\nUsage: await _factory.Create(user.PreferredChannel).SendAsync(\"Order shipped\");\n\nBenefits: removes if/else + new scattered around the code, follows Open/Closed (add a channel = new class + one mapping), easy to test. Variants: Factory Method (subclasses decide), Abstract Factory (families of related objects). In .NET, IHttpClientFactory and ILoggerFactory are real examples.","source":"Core priority list","core":true,"tier":1},{"id":"c35","category":".NET","topic":"Web API","difficulty":"Easy","question":"What are HTTP verbs? Which are safe and idempotent, and which status codes do you return?","answer":"• GET – read. Safe + idempotent. 200 OK / 404.\n• POST – create / non-idempotent action. 201 Created with Location header (CreatedAtAction), or 202 Accepted for queued work.\n• PUT – replace the whole resource. Idempotent. 200 or 204 No Content.\n• PATCH – partial update. Not guaranteed idempotent. 200/204.\n• DELETE – remove. Idempotent. 204 (or 404 if not found).\n• HEAD / OPTIONS – headers only / allowed methods (CORS preflight).\nIdempotent = repeating the same request gives the same result (important for retries). Other codes to know: 400 validation error, 401 not authenticated, 403 not allowed, 409 conflict, 500 server error.","source":"Core priority list","core":true,"tier":1},{"id":"c36","category":".NET","topic":"Web API","difficulty":"Medium","question":"PUT vs PATCH?","answer":"PUT replaces the ENTIRE resource: the client sends the full object; missing fields become default/null. Idempotent.\nPATCH updates only the fields sent (partial update). Can use JSON Patch ([{ \"op\":\"replace\",\"path\":\"/email\",\"value\":\"a@b.com\" }]) or a partial DTO.\n\n[HttpPut(\"{id}\")]   public async Task<IActionResult> Update(int id, UpdateUserDto dto) { ... return NoContent(); }\n[HttpPatch(\"{id}\")] public async Task<IActionResult> Patch(int id, JsonPatchDocument<UserDto> patch) { patch.ApplyTo(dto, ModelState); ... }\n\nUse PUT when the client has the whole object (edit form). Use PATCH for small changes on large resources (update status, change email). Trade-off: PATCH must distinguish \"set to null\" from \"not sent\", so it's more complex; PUT is simpler and my default for internal APIs.","source":"Core priority list","core":true,"tier":1},{"id":"c37","category":".NET","topic":"Filters & State","difficulty":"Medium","question":"What are filters in ASP.NET Core? Explain the types and their order.","answer":"Filters run code before/after specific stages of MVC action execution (unlike middleware, they know the action, its arguments and results).\nOrder:\n1. Authorization filters – [Authorize]; run first, can short-circuit with 401/403.\n2. Resource filters – before model binding; caching, short-circuit.\n3. Action filters – before/after the action; validation, logging, auditing (OnActionExecuting / OnActionExecuted).\n4. Exception filters – handle exceptions thrown by actions.\n5. Result filters – before/after the result executes; add headers, wrap responses.\n\npublic class LogActionFilter(ILogger<LogActionFilter> log) : IActionFilter {\n  public void OnActionExecuting(ActionExecutingContext c) => log.LogInformation(\"Calling {A}\", c.ActionDescriptor.DisplayName);\n  public void OnActionExecuted(ActionExecutedContext c) { }\n}\nRegister globally (options.Filters.Add<LogActionFilter>()), per controller, or per action ([ServiceFilter(typeof(LogActionFilter))]).\nFilter vs middleware: middleware for every request (auth, CORS, logging); filters for MVC-specific concerns.\nMiddleware vs Filters: middleware runs for every request at the HTTP pipeline level (auth, logging, CORS, exception handling) and knows nothing about MVC; filters run inside the MVC/API pipeline and have access to action context, arguments, model state and results. Use middleware for cross-cutting HTTP concerns, filters for controller/action-specific concerns.","source":"Core priority list","core":true,"tier":1},{"id":"c38","category":".NET","topic":"Filters & State","difficulty":"Easy","question":"ViewBag vs ViewData vs TempData?","answer":"All pass data from controller to view in MVC.\n• ViewData – dictionary (ViewData[\"Title\"] = \"Orders\"); needs casting; lives for the current request.\n• ViewBag – dynamic wrapper over ViewData (ViewBag.Title = \"Orders\"); no casting, no compile-time checking; current request only.\n• TempData – survives ONE redirect (stored in cookie/session); read once, then removed. Keep() or Peek() to retain. Used for \"Saved successfully\" messages after Post-Redirect-Get.\nBest practice: use strongly typed view models for real data; ViewBag/ViewData only for small extras. Not used in Web API (APIs return JSON).","source":"Core priority list","core":true,"tier":1},{"id":"c39","category":".NET","topic":"Security","difficulty":"Medium","question":"Authentication vs Authorization, and how do you implement JWT in ASP.NET Core?","answer":"Authentication = who you are (verify credentials, issue token). Authorization = what you can do (roles, policies).\n\nJWT flow:\n1. POST /api/auth/login with username/password → validate → create JWT with claims (sub, email, role), signed with a secret key, short expiry (15–60 min) + refresh token.\n2. Angular stores the token and an HttpInterceptor sends Authorization: Bearer <token> on every request.\n3. API validates signature, issuer, audience, expiry on each request – stateless, no session.\n\nbuilder.Services.AddAuthentication(JwtBearerDefaults.AuthenticationScheme)\n  .AddJwtBearer(o => o.TokenValidationParameters = new() {\n     ValidateIssuer = true, ValidateAudience = true, ValidateLifetime = true, ValidateIssuerSigningKey = true,\n     ValidIssuer = cfg[\"Jwt:Issuer\"], ValidAudience = cfg[\"Jwt:Audience\"],\n     IssuerSigningKey = new SymmetricSecurityKey(Encoding.UTF8.GetBytes(cfg[\"Jwt:Key\"])) });\napp.UseAuthentication(); app.UseAuthorization();\n[Authorize(Roles = \"Admin\")] or [Authorize(Policy = \"CanApprove\")] on controllers.\n\nJWT = header.payload.signature (Base64Url). Payload is readable, not encrypted – never put secrets in it. Keep the key in secrets/Key Vault.\nCookie-based auth keeps a session server-side (or in an encrypted cookie) – good for server-rendered apps. Token-based (JWT) auth sends a signed token in each request – no server session. Interview line: \"Token-based authentication supports stateless, scalable systems.\"","source":"Core priority list","core":true,"tier":1},{"id":"c40","category":".NET","topic":"Security","difficulty":"Senior","question":"What is OAuth 2.0 / OpenID Connect, and how is it different from JWT?","answer":"OAuth 2.0 is an AUTHORIZATION framework: it lets an app get limited access to an API on a user's behalf via an access token issued by an authorization server (Azure AD/Entra ID, Google, IdentityServer, Auth0) without sharing the password.\nOpenID Connect adds AUTHENTICATION on top of OAuth: an ID token telling the app who the user is (\"Login with Google/Microsoft\").\n\nCommon flows: Authorization Code + PKCE (SPAs like Angular, mobile), Client Credentials (service-to-service).\nJWT is a TOKEN FORMAT, not a protocol. OAuth/OIDC servers usually issue access tokens as JWTs. So: OAuth/OIDC = the process of getting tokens; JWT = what the token looks like.\nIn .NET the API still just validates the bearer JWT (AddJwtBearer with Authority = the identity provider). Angular uses a library like angular-oauth2-oidc or MSAL for the login redirect.","source":"Core priority list","core":true,"tier":1},{"id":"c41","category":".NET","topic":"Dependency Injection","difficulty":"Medium","question":"What is Dependency Injection and what are the service lifetimes (Singleton, Scoped, Transient)?","answer":"DI: a class receives its dependencies (usually via constructor) from the container instead of creating them with new. Gives loose coupling, testability and central lifetime management.\n\nbuilder.Services.AddTransient<IEmailBuilder, EmailBuilder>();\nbuilder.Services.AddScoped<IOrderService, OrderService>();\nbuilder.Services.AddSingleton<ICacheService, MemoryCacheService>();\n\n• Transient – new instance every time it's requested. Lightweight, stateless services.\n• Scoped – one instance per HTTP request, shared within that request. DbContext, unit of work, repositories.\n• Singleton – one instance for the application lifetime. Caches, configuration, HttpClient-like shared objects; must be thread-safe.\n\nTrap (captive dependency): injecting a scoped service (DbContext) into a singleton keeps one DbContext forever → thread-safety bugs and stale data. Fix: inject IServiceScopeFactory and create a scope. Rule: a service may only depend on services with equal or longer lifetime.\nRule of thumb: DbContext is always Scoped; never inject a Scoped service into a Singleton (captive dependency); avoid stateful singletons.","source":"Core priority list","core":true,"tier":1},{"id":"c42","category":"SQL","topic":"SQL Differences","difficulty":"Easy","question":"DELETE vs TRUNCATE vs DROP?","answer":"DELETE – DML; removes rows one by one; supports WHERE; fully logged; fires triggers; identity NOT reset; can roll back.\n  DELETE FROM Orders WHERE Status = 'Cancelled';\nTRUNCATE – DDL; removes ALL rows by deallocating pages; no WHERE; minimal logging (faster); resets identity; no row triggers; can roll back inside an explicit transaction in SQL Server; not allowed if referenced by a foreign key.\nDROP – removes the table itself (structure, data, indexes, constraints).\nUse DELETE for selective removal, TRUNCATE to empty staging tables fast, DROP to remove the table.","source":"Core priority list","core":true,"tier":1},{"id":"c43","category":"SQL","topic":"SQL Differences","difficulty":"Easy","question":"WHERE vs HAVING, and UNION vs UNION ALL?","answer":"WHERE filters rows BEFORE grouping and cannot use aggregates. HAVING filters groups AFTER GROUP BY and can use aggregates.\n  SELECT DeptId, COUNT(*) AS Cnt FROM Employees\n  WHERE IsActive = 1            -- row filter\n  GROUP BY DeptId\n  HAVING COUNT(*) > 5;          -- group filter\n\nUNION combines results and REMOVES duplicates (extra sort/distinct cost). UNION ALL keeps duplicates and is faster. Both need the same number of columns with compatible types. Use UNION ALL unless you really need de-duplication.","source":"Core priority list","core":true,"tier":1},{"id":"c44","category":"SQL","topic":"SQL Differences","difficulty":"Easy","question":"Primary key vs Unique key vs Foreign key?","answer":"Primary key – uniquely identifies each row; NOT NULL; only one per table; creates a clustered index by default.\nUnique key – enforces uniqueness on a column (e.g. Email); allows one NULL in SQL Server; many per table; non-clustered index by default.\nForeign key – column that references another table's primary/unique key; enforces referential integrity (can't insert an order for a customer that doesn't exist); supports ON DELETE CASCADE / NO ACTION.\nExample: Orders.CustomerId FOREIGN KEY REFERENCES Customers(Id).","source":"Core priority list","core":true,"tier":1},{"id":"c45","category":"SQL","topic":"SQL Differences","difficulty":"Medium","question":"Temp table vs table variable vs CTE vs View?","answer":"• #Temp table – real table in tempdb for the session; can have indexes and statistics; good for large intermediate results reused several times.\n• @Table variable – also in tempdb, scoped to the batch/procedure; no statistics (optimizer assumes few rows); good for small row sets.\n• CTE (WITH ...) – named result for ONE statement only; improves readability; supports recursion (hierarchies). Not stored.\n• View – saved query stored in the database, reusable across queries; used for security (expose selected columns) and simplifying joins; no data stored unless it's an indexed view.\nRule of thumb: CTE for readability within a query, view for reuse, temp table for large multi-step processing.\nInterview line: \"I use CTEs for readability and temp tables for performance on large intermediate results.\"","source":"Core priority list","core":true,"tier":1},{"id":"c46","category":"SQL","topic":"Stored Procedures & Functions","difficulty":"Medium","question":"Write a basic stored procedure and a basic function, and show how you call them.","answer":"Stored procedure (with input + output parameters):\nCREATE PROCEDURE dbo.usp_GetOrdersByCustomer\n  @CustomerId INT,\n  @TotalCount INT OUTPUT\nAS\nBEGIN\n  SET NOCOUNT ON;\n  SELECT Id, OrderDate, Amount FROM dbo.Orders WHERE CustomerId = @CustomerId;\n  SELECT @TotalCount = COUNT(*) FROM dbo.Orders WHERE CustomerId = @CustomerId;\nEND\n-- EXEC dbo.usp_GetOrdersByCustomer @CustomerId = 5, @TotalCount = @cnt OUTPUT;\n\nScalar function:\nCREATE FUNCTION dbo.fn_GetAge(@Dob DATE) RETURNS INT\nAS BEGIN RETURN DATEDIFF(YEAR, @Dob, GETDATE()) END\n-- SELECT Name, dbo.fn_GetAge(Dob) FROM Employees;\n\nInline table-valued function:\nCREATE FUNCTION dbo.fn_OrdersAbove(@Min DECIMAL(10,2)) RETURNS TABLE\nAS RETURN (SELECT * FROM dbo.Orders WHERE Amount > @Min);\n-- SELECT * FROM dbo.fn_OrdersAbove(1000);\nFrom EF Core: context.Database.ExecuteSqlInterpolatedAsync / FromSqlInterpolated.","source":"Core priority list","core":true,"tier":1},{"id":"c47","category":"SQL","topic":"Stored Procedures & Functions","difficulty":"Medium","question":"Stored Procedure vs Function – what are the differences?","answer":"• Return: function MUST return a value (scalar or table); procedure may return nothing, result sets, or output params.\n• Usage: function can be used inside SELECT/WHERE/JOIN; procedure is called with EXEC and can't be used in a SELECT.\n• Data changes: procedure can INSERT/UPDATE/DELETE; function cannot modify database state.\n• Parameters: procedure supports input and OUTPUT params; function only input.\n• Transactions & error handling: procedure supports BEGIN TRAN and TRY/CATCH; function doesn't.\n• Calling: procedure can call functions; function cannot call procedures.\nUse a function for reusable calculations/filters in queries; a procedure for business operations that change data.\nInterview line: \"Functions compute and return a value and can be used inside queries; procedures perform operations – DML, transactions, multiple result sets.\"","source":"Core priority list","core":true,"tier":1},{"id":"c48","category":"SQL","topic":"Queries","difficulty":"Medium","question":"Find the 2nd / 3rd / Nth highest salary (and handle duplicates).","answer":"Best answer – DENSE_RANK handles duplicate salaries:\nWITH Ranked AS (\n  SELECT Name, Salary, DENSE_RANK() OVER (ORDER BY Salary DESC) AS Rnk\n  FROM Employees\n)\nSELECT Name, Salary FROM Ranked WHERE Rnk = 3;     -- Nth: Rnk = @N\n\nOther ways:\n-- OFFSET/FETCH (distinct salaries)\nSELECT DISTINCT Salary FROM Employees ORDER BY Salary DESC OFFSET 2 ROWS FETCH NEXT 1 ROW ONLY;\n-- Subquery (2nd highest)\nSELECT MAX(Salary) FROM Employees WHERE Salary < (SELECT MAX(Salary) FROM Employees);\n-- TOP\nSELECT TOP 1 Salary FROM (SELECT DISTINCT TOP 3 Salary FROM Employees ORDER BY Salary DESC) t ORDER BY Salary;\n\nExplain: RANK leaves gaps after ties (1,1,3), DENSE_RANK doesn't (1,1,2), ROW_NUMBER is always unique.\nWhy DENSE_RANK: simple, readable, and it handles duplicate salaries correctly.","source":"Core priority list","core":true,"tier":1},{"id":"c49","category":"SQL","topic":"Queries","difficulty":"Medium","question":"GROUP BY queries: highest salary per department, employee count per department, and finding duplicate rows.","answer":"Highest salary per department (with employee name):\nSELECT DeptId, Name, Salary FROM (\n  SELECT DeptId, Name, Salary, ROW_NUMBER() OVER (PARTITION BY DeptId ORDER BY Salary DESC) rn\n  FROM Employees) t\nWHERE rn = 1;\nOnly the value: SELECT DeptId, MAX(Salary) FROM Employees GROUP BY DeptId;\n\nCount per department (with names, only depts with > 5):\nSELECT d.Name, COUNT(e.Id) AS Total\nFROM Departments d LEFT JOIN Employees e ON e.DeptId = d.Id\nGROUP BY d.Name HAVING COUNT(e.Id) > 5;\n\nDuplicates by email:\nSELECT Email, COUNT(*) FROM Users GROUP BY Email HAVING COUNT(*) > 1;\nDelete duplicates keeping one:\nWITH d AS (SELECT *, ROW_NUMBER() OVER (PARTITION BY Email ORDER BY Id) rn FROM Users)\nDELETE FROM d WHERE rn > 1;\nRule: every non-aggregated column in SELECT must be in GROUP BY.","source":"Core priority list","core":true,"tier":1},{"id":"c50","category":"SQL","topic":"Joins","difficulty":"Easy","question":"Explain INNER, LEFT, RIGHT and FULL OUTER JOIN with an example.","answer":"Employees(Id, Name, DeptId) and Departments(Id, Name).\n• INNER JOIN – only matching rows in both tables (employees who have a department).\n  SELECT e.Name, d.Name FROM Employees e INNER JOIN Departments d ON e.DeptId = d.Id;\n• LEFT JOIN – all rows from the left + matches from the right; NULL where no match (all employees, even without department).\n• RIGHT JOIN – all rows from the right + matches from the left (all departments, even empty ones).\n• FULL OUTER JOIN – all rows from both, NULLs where missing.\n• CROSS JOIN – every combination (cartesian product).\n• SELF JOIN – table joined to itself: employees with their manager (Employees e JOIN Employees m ON e.ManagerId = m.Id).\nFind rows with no match: LEFT JOIN ... WHERE d.Id IS NULL (e.g. employees without a department).","source":"Core priority list","core":true,"tier":1},{"id":"c51","category":"SQL","topic":"Transactions","difficulty":"Medium","question":"How do you use transactions inside a stored procedure with error handling?","answer":"CREATE PROCEDURE dbo.usp_TransferMoney @From INT, @To INT, @Amount DECIMAL(18,2)\nAS\nBEGIN\n  SET NOCOUNT ON;\n  SET XACT_ABORT ON;             -- any runtime error aborts the transaction\n  BEGIN TRY\n    BEGIN TRANSACTION;\n      UPDATE Accounts SET Balance = Balance - @Amount WHERE Id = @From;\n      IF (SELECT Balance FROM Accounts WHERE Id = @From) < 0\n          THROW 50001, 'Insufficient balance', 1;\n      UPDATE Accounts SET Balance = Balance + @Amount WHERE Id = @To;\n    COMMIT TRANSACTION;\n  END TRY\n  BEGIN CATCH\n    IF @@TRANCOUNT > 0 ROLLBACK TRANSACTION;\n    THROW;                         -- rethrow to the caller/app\n  END CATCH\nEND\nExplain ACID: both updates succeed or neither does. Keep transactions short to avoid locking. In EF Core, SaveChanges is already one transaction; for multiple SaveChanges use await using var tx = await db.Database.BeginTransactionAsync(); ... await tx.CommitAsync();","source":"Core priority list","core":true,"tier":1},{"id":"c52","category":"SQL","topic":"Indexing","difficulty":"Medium","question":"What are indexes? Clustered vs non-clustered, and other index types?","answer":"An index is a B-tree structure that lets SQL Server find rows without scanning the whole table – like a book's index.\n\nClustered – sorts and stores the table's data rows by the key. Only ONE per table (the data can be sorted one way). Created on the primary key by default. Great for range queries.\nNon-clustered – separate structure holding key values + a pointer (row locator / clustered key) to the data. Many per table. May need a key lookup to fetch other columns.\n\nOther types: unique, composite (multi-column – order of columns matters), covering index with INCLUDE columns (avoids key lookups), filtered index (WHERE IsActive = 1), columnstore (analytics), full-text.\nCREATE NONCLUSTERED INDEX IX_Orders_CustomerId ON Orders(CustomerId) INCLUDE (OrderDate, Amount);\n\nWhich column to index: columns in WHERE, JOIN, ORDER BY with good selectivity. Trade-off: indexes speed reads but slow INSERT/UPDATE/DELETE and use storage, so don't index everything; check the execution plan.","source":"Core priority list","core":true,"tier":1},{"id":"c53","category":".NET","topic":"LINQ & Data Access","difficulty":"Medium","question":"IEnumerable vs IQueryable – which one for database queries and why?","answer":"IEnumerable<T> – LINQ-to-Objects. Works on in-memory data; filters run in C# AFTER the data is loaded. Namespace System.Collections.Generic.\nIQueryable<T> – builds an expression tree that the provider (EF Core) translates to SQL; filters, sorting and paging run IN THE DATABASE. Namespace System.Linq.\n\nIQueryable<Order> q = db.Orders.Where(o => o.Amount > 1000);   // SQL: WHERE Amount > 1000\nvar page = await q.OrderBy(o => o.Id).Skip(20).Take(10).ToListAsync();  // one SQL with OFFSET/FETCH\n\nIEnumerable<Order> e = db.Orders.ToList();   // loads ALL rows\ne.Where(o => o.Amount > 1000);               // filters in memory – slow, heavy\n\nBoth use deferred execution (runs on ToList/foreach/Count). Use IQueryable while building a DB query, materialise with ToListAsync at the end; return IEnumerable/List from repositories to avoid leaking query logic.","source":"Core priority list","core":true,"tier":1},{"id":"c54","category":"SQL","topic":"Performance","difficulty":"Senior","question":"What is a deadlock? How do you detect and prevent it?","answer":"A deadlock happens when two transactions each hold a lock the other needs: T1 locks Orders then wants Customers; T2 locks Customers then wants Orders. SQL Server detects the cycle and kills one as the deadlock victim (error 1205).\n\nDetect: system_health Extended Events (xml_deadlock_report), SQL Profiler deadlock graph, error 1205 in app logs.\nPrevent:\n• Access tables in the same order in all procedures.\n• Keep transactions short; don't wait for user input or API calls inside a transaction.\n• Proper indexes so queries lock fewer rows (scans escalate locks).\n• Use READ COMMITTED SNAPSHOT (row versioning) so readers don't block writers.\n• Lower lock scope; avoid unnecessary UPDLOCK/serializable.\n• Handle 1205 in code with a retry (EF Core EnableRetryOnFailure / Polly).\nRelated .NET deadlock: blocking async code with .Result – different thing, mention you know both.","source":"Core priority list","core":true,"tier":1},{"id":"c55","category":"SQL","topic":"Performance","difficulty":"Senior","question":"How do you optimize a slow query or database?","answer":"Steps I follow:\n1. Measure: find the slow query (Query Store, profiler, EF Core logging, SET STATISTICS IO/TIME ON).\n2. Read the execution plan: look for table/index scans, key lookups, high estimated vs actual rows, sorts, implicit conversions.\n3. Fix indexing: add/adjust non-clustered indexes on WHERE/JOIN/ORDER BY columns, covering indexes with INCLUDE,
