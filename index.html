alue is the last one's.","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q043","category":".NET","topic":"Methods & Delegates","difficulty":"Medium","question":"What are Anonymous Delegates in C#?","answer":"Inline method bodies written with the delegate keyword and no name. Lambdas are the modern form.","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q044","category":".NET","topic":"Methods & Delegates","difficulty":"Medium","question":"What are the differences between Events and Delegates?","answer":"A delegate is a method reference. An event wraps a delegate so outside code can only subscribe/unsubscribe (+=/-=), not invoke or reset it. Publisher-subscriber notification.","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q045","category":".NET","topic":"Important Keywords","difficulty":"Easy","question":"What is this keyword in C#? When to use it?","answer":"Refers to the current instance. Used to disambiguate fields from parameters, chain constructors, and in extension methods.","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q047","category":".NET","topic":"Important Keywords","difficulty":"Medium","question":"What is the difference between is and as operators?","answer":"is checks type compatibility and returns bool (and supports pattern matching). as casts to a reference/nullable type and returns null instead of throwing.","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q048","category":".NET","topic":"Important Keywords","difficulty":"Medium","question":"What is the difference between Readonly and Constant variables?","answer":"const: compile-time, set at declaration, implicitly static. readonly: runtime, set at declaration or in the constructor, can differ per instance.","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q049","category":".NET","topic":"Important Keywords","difficulty":"Easy","question":"What is a Static class? When to use it?","answer":"Cannot be instantiated or inherited; only static members. Used for helpers/utilities with no state.","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q051","category":".NET","topic":"Important Keywords","difficulty":"Easy","question":"What is Enum keyword used for?","answer":"Defines a set of named constants (default int starting at 0) for readable code, e.g. Level.Medium.","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q052","category":".NET","topic":".NET Framework Basics","difficulty":"Medium","question":"What are the important components of .NET framework?","answer":"CLR (runtime: JIT, GC, security), CTS (common types), CLS (cross-language rules), FCL/BCL (class libraries). Lets C#, VB.NET, F# interoperate.","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q053","category":".NET","topic":".NET Framework Basics","difficulty":"Medium","question":"What is an Assembly? What are the different types of assembly in .NET?","answer":"Compiled deployment unit (DLL/EXE) containing IL and metadata. Private (one app), shared/public (GAC), satellite (localised resources).","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q054","category":".NET","topic":".NET Framework Basics","difficulty":"Easy","question":"What is GAC?","answer":"Global Assembly Cache: machine-wide store for shared, strong-named assemblies (.NET Framework). Added via gacutil.","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q055","category":".NET","topic":".NET Framework Basics","difficulty":"Medium","question":"What is Reflection?","answer":"Inspecting assemblies, types, and members at runtime via System.Reflection (Type, MethodInfo), e.g. reading attributes or invoking methods dynamically.","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q056","category":".NET","topic":".NET Framework Basics","difficulty":"Medium","question":"What are Serialization and Deserialization? Types of serialization?","answer":"Converting an object to a storable/transferable format and back. Types: binary, XML, JSON (System.Text.Json in modern .NET, used by Web APIs).","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q057","category":".NET","topic":".NET Framework Basics","difficulty":"Easy","question":"What is meant by Globalization and Localization?","answer":"Globalization: designing the app to support many cultures. Localization: adapting it to one specific culture (translations, formats).","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q058","category":".NET","topic":".NET Framework Basics","difficulty":"Easy","question":"What are Windows Services?","answer":"Long-running background processes managed by Windows, started automatically or manually. Modern equivalent: Worker Service / BackgroundService.","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q059","category":".NET","topic":"Garbage Collection","difficulty":"Easy","question":"What is Garbage Collection (GC)?","answer":"The CLR's automatic memory manager: finds objects no longer referenced and reclaims heap memory.","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q060","category":".NET","topic":"Garbage Collection","difficulty":"Medium","question":"What are Generations in garbage collection?","answer":"Gen 0 (short-lived, collected most often), Gen 1 (buffer), Gen 2 (long-lived). Survivors are promoted. Large objects go to the LOH.","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q061","category":".NET","topic":"Garbage Collection","difficulty":"Medium","question":"What is the difference between Dispose and Finalize?","answer":"Dispose is explicit and deterministic (IDisposable, using) for releasing unmanaged resources. Finalize is called by the GC non-deterministically as a safety net.","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q062","category":".NET","topic":"Garbage Collection","difficulty":"Easy","question":"What is the difference between Finalize and Finally?","answer":"Finalize is a GC cleanup method on an object. finally is an exception-handling block that always runs.","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q063","category":".NET","topic":"Garbage Collection","difficulty":"Medium","question":"Can we force Garbage Collector to run?","answer":"Yes with GC.Collect(), but it's discouraged because it hurts performance. Dispose resources explicitly instead.","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q064","category":".NET","topic":"Threading & Async","difficulty":"Easy","question":"What is the difference between Process and Thread?","answer":"A process has its own memory and resources; threads run inside a process and share its memory.","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q065","category":".NET","topic":"Threading & Async","difficulty":"Easy","question":"Explain Multithreading?","answer":"Running multiple threads concurrently in one process, e.g. downloading while updating a progress bar. System.Threading namespace.","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q066","category":".NET","topic":"Threading & Async","difficulty":"Medium","question":"Difference between synchronous and asynchronous programming? Role of Task?","answer":"Synchronous blocks until each step finishes. Asynchronous frees the thread while waiting for I/O. Task represents that ongoing work and its result.","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q067","category":".NET","topic":"Threading & Async","difficulty":"Medium","question":"What is the difference between Threads and Tasks?","answer":"Thread is an OS thread, heavy to create. Task is a higher-level unit of work scheduled on the thread pool, supports results, continuation, cancellation, and better exception handling.","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q068","category":".NET","topic":"Threading & Async","difficulty":"Medium","question":"What is Async and Await in Task?","answer":"async marks a method that awaits; await pauses the method without blocking the thread until the Task completes, then resumes. Improves scalability for I/O.","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q069","category":"SQL","topic":"Basics","difficulty":"Easy","question":"What is the difference between DBMS and RDBMS?","answer":"DBMS stores data without enforced relationships. RDBMS stores data in related tables with keys, constraints, and normalization (SQL Server).","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q070","category":"SQL","topic":"Basics","difficulty":"Easy","question":"What is a Constraint in SQL? What are its types?","answer":"Rules on data: PRIMARY KEY, FOREIGN KEY, UNIQUE, NOT NULL, CHECK, DEFAULT.","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q072","category":"SQL","topic":"Basics","difficulty":"Medium","question":"What are Triggers and types of triggers?","answer":"Code that fires automatically on INSERT/UPDATE/DELETE. AFTER triggers and INSTEAD OF triggers (plus DDL/logon triggers). Common use: audit/history tables.","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q073","category":"SQL","topic":"Basics","difficulty":"Easy","question":"What is a View?","answer":"A virtual table defined by a stored query over one or more tables. Simplifies queries and restricts columns; data is not stored (unless indexed view).","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q074","category":"SQL","topic":"Basics","difficulty":"Easy","question":"What is the difference between Having clause and Where clause?","answer":"WHERE filters rows before GROUP BY and cannot use aggregates. HAVING filters groups after GROUP BY and can use aggregates.","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q075","category":"SQL","topic":"Basics","difficulty":"Easy","question":"What is a Sub query or Nested query in SQL?","answer":"A query inside another query (in WHERE, FROM, SELECT). The inner result drives the outer filter.","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q076","category":"SQL","topic":"Basics","difficulty":"Easy","question":"What is Auto Increment / Identity column in SQL Server?","answer":"IDENTITY(seed, increment) auto-generates numeric values, typically for primary keys.","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q077","category":"SQL","topic":"Joins & Indexes","difficulty":"Easy","question":"What are Joins in SQL?","answer":"Combining rows from two tables based on a related column.","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q078","category":"SQL","topic":"Joins & Indexes","difficulty":"Easy","question":"What are the types of Joins in SQL Server?","answer":"INNER, LEFT OUTER, RIGHT OUTER, FULL OUTER, CROSS, and SELF join.","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q079","category":"SQL","topic":"Joins & Indexes","difficulty":"Medium","question":"What is Self-Join?","answer":"Joining a table to itself with aliases, e.g. Employee e JOIN Employee m ON e.ManagerId = m.Id to list employees with their manager.","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q080","category":"SQL","topic":"Joins & Indexes","difficulty":"Easy","question":"What are Indexes in SQL Server?","answer":"Structures (B-trees) that speed up lookups on columns used in WHERE/JOIN/ORDER BY, at the cost of storage and slower writes.","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q081","category":"SQL","topic":"Joins & Indexes","difficulty":"Medium","question":"What is Clustered index?","answer":"Defines the physical order of rows in the table. Only one per table; created by default on the primary key.","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q084","category":"SQL","topic":"Joins & Indexes","difficulty":"Medium","question":"How to create Clustered and Non-Clustered index in a table?","answer":"CREATE CLUSTERED INDEX IX_Name ON Table(Col); CREATE NONCLUSTERED INDEX IX_Name ON Table(Col). Drop the PK clustered index first if replacing it.","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q085","category":"SQL","topic":"Joins & Indexes","difficulty":"Senior","question":"In which column will you apply indexing to optimize this query?","answer":"On the columns in the WHERE/JOIN condition (e.g. Name) as a non-clustered index, optionally INCLUDE the selected columns to cover the query. Not on columns only in SELECT.","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q086","category":"SQL","topic":"Procedures, Functions & More","difficulty":"Medium","question":"What is the difference between Stored Procedure and Functions (at least 3)?","answer":"Procedure may or may not return a value, can have output params, can run DML, cannot be used in SELECT. Function must return a value, input params only, cannot modify data, can be used in SELECT/WHERE.","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q087","category":"SQL","topic":"Procedures, Functions & More","difficulty":"Senior","question":"How to optimize a Stored Procedure or SQL Query?","answer":"SET NOCOUNT ON, select explicit columns, schema-qualify names, proper indexes, EXISTS instead of COUNT, avoid functions on indexed columns, avoid cursors/dynamic SQL, keep transactions short, read the execution plan.","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q088","category":"SQL","topic":"Procedures, Functions & More","difficulty":"Medium","question":"What is a Cursor? Why to avoid them?","answer":"Row-by-row processing (DECLARE, OPEN, FETCH, CLOSE, DEALLOCATE). Slow and resource-heavy compared with set-based queries.","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q089","category":"SQL","topic":"Procedures, Functions & More","difficulty":"Medium","question":"What is the difference between SCOPE_IDENTITY and @@IDENTITY?","answer":"Both return the last identity value. SCOPE_IDENTITY is limited to the current scope and session, so a trigger inserting elsewhere won't affect it. @@IDENTITY can ards & Interceptors","difficulty":"Medium","question":"How to implement Authentication with JWT in Angular?","answer":"AuthService (login via HttpClient, store token, isLoggedIn), reactive login form, route guard, interceptor for the header, logout clears token.","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q285","category":"Angular","topic":"Auth, JWT, Guards & Interceptors","difficulty":"Medium","question":"What is Auth Guard?","answer":"A CanActivate guard that checks auth before route activation and redirects to login if not authenticated.","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q286","category":"Angular","topic":"Auth, JWT, Guards & Interceptors","difficulty":"Medium","question":"What is HTTP Interceptor?","answer":"Intercepts every HttpClient request/response to add headers (Bearer token), handle errors, logging, loaders.","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q287","category":"Angular","topic":"Auth, JWT, Guards & Interceptors","difficulty":"Medium","question":"How to Retry automatically if there is an error response from API?","answer":"RxJS retry(3) (or retry with delay) in the service or interceptor.","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q288","category":"Angular","topic":"Auth, JWT, Guards & Interceptors","difficulty":"Easy","question":"What are the parts of JWT Token? (Angular)","answer":"Header, payload (claims), signature.","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q289","category":"Angular","topic":"Auth, JWT, Guards & Interceptors","difficulty":"Easy","question":"What is Postman?","answer":"A tool for sending and testing HTTP API requests with headers, bodies, and auth.","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q290","category":"Angular","topic":"Auth, JWT, Guards & Interceptors","difficulty":"Easy","question":"Which part of the request has the token stored when sending to API?","answer":"The Authorization header: Bearer <token>.","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q291","category":"Angular","topic":"Component Communication","difficulty":"Medium","question":"What are the various ways to communicate between components?","answer":"@Input/@Output, shared service with Subject/BehaviorSubject or signals, ViewChild/ContentChild, router params, state management (NgRx).","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q292","category":"Angular","topic":"Component Communication","difficulty":"Medium","question":"What is Content Projection? What is ng-content?","answer":"Passing HTML from parent into child's template slots with <ng-content> (select for multiple slots).","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q293","category":"Angular","topic":"Component Communication","difficulty":"Easy","question":"What is Template Reference Variable in Angular?","answer":"#name on an element to reference it in the template (e.g. read input.value).","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q294","category":"Angular","topic":"Component Communication","difficulty":"Medium","question":"What is the role of ViewChild in Angular?","answer":"@ViewChild gets a reference to an element/child component/directive from the component's own template; available in ngAfterViewInit.","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q295","category":"Angular","topic":"Component Communication","difficulty":"Medium","question":"How to access the child component from parent with ViewChild?","answer":"@ViewChild(ChildComponent) child; then call child.method() in ngAfterViewInit.","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q296","category":"Angular","topic":"Component Communication","difficulty":"Medium","question":"Difference between ViewChild and ViewChildren? What is QueryList?","answer":"ViewChild returns the first match; ViewChildren returns all as a QueryList (live, iterable, changes observable).","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q297","category":"Angular","topic":"Component Communication","difficulty":"Medium","question":"What is ContentChild?","answer":"Queries projected content (from ng-content) in the child; available in ngAfterContentInit.","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q298","category":"Angular","topic":"Component Communication","difficulty":"Medium","question":"What is the difference between ContentChild and ContentChildren?","answer":"ContentChild: first projected match. ContentChildren: all matches as QueryList.","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q299","category":"Angular","topic":"Component Communication","difficulty":"Senior","question":"Compare ng-content, ViewChild, ViewChildren, ContentChild and ContentChildren?","answer":"ng-content projects parent HTML. View* query the component's own template (AfterViewInit). Content* query projected content (AfterContentInit). *Children return QueryList.","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q300","category":".NET","topic":"C# General","difficulty":"Medium","question":"Difference between IEnumerable, IQueryable, and List in C#?","answer":"IEnumerable: in-memory, forward-only iteration. IQueryable: deferred, translated to SQL by the provider. List: concrete in-memory collection with index access.","source":"Articles (Medium: Yaseer Arafat, Platform sharks, Sanjula R)","core":false,"tier":3},{"id":"q301","category":".NET","topic":"C# General","difficulty":"Easy","question":"Difference between Equals() and == in C#?","answer":"== compares values for value types and references for classes unless overloaded (string overloads it). Equals() is virtual and can be overridden for value equality.","source":"Articles (Medium: Yaseer Arafat, Platform sharks, Sanjula R)","core":false,"tier":3},{"id":"q303","category":".NET","topic":"C# General","difficulty":"Easy","question":"Value types vs Reference types?","answer":"Value types (int, struct) hold data directly and copy on assignment. Reference types (class) hold a reference to heap data.","source":"Articles (Medium: Yaseer Arafat, Platform sharks, Sanjula R)","core":false,"tier":3},{"id":"q304","category":".NET","topic":"Web API","difficulty":"Easy","question":"ControllerBase vs Controller?","answer":"ControllerBase for APIs (no views). Controller adds view support for MVC.","source":"Articles (Medium: Yaseer Arafat, Platform sharks, Sanjula R)","core":false,"tier":3},{"id":"q306","category":".NET","topic":"Web API","difficulty":"Medium","question":"What are Action Filters?","answer":"Run custom logic before/after an action: logging, validation, caching.","source":"Articles (Medium: Yaseer Arafat, Platform sharks, Sanjula R)","core":false,"tier":3},{"id":"q307","category":".NET","topic":"Web API","difficulty":"Senior","question":"gRPC vs REST?","answer":"gRPC: Protocol Buffers, binary, HTTP/2, fast, streaming, strongly typed contracts; good service-to-service. REST: JSON over HTTP, human-readable, universally supported.","source":"Articles (Medium: Yaseer Arafat, Platform sharks, Sanjula R)","core":false,"tier":3},{"id":"q308","category":".NET","topic":"Web API","difficulty":"Medium","question":"What caching strategies exist in ASP.NET Core?","answer":"In-memory, distributed (Redis), response caching, output caching, HybridCache (.NET 9+).","source":"Articles (Medium: Yaseer Arafat, Platform sharks, Sanjula R)","core":false,"tier":3},{"id":"q309","category":".NET","topic":"Web API","difficulty":"Easy","question":"What is API Versioning?","answer":"Supporting multiple API versions side by side (URL /v1, query string, header) so clients don't break.","source":"Articles (Medium: Yaseer Arafat, Platform sharks, Sanjula R)","core":false,"tier":3},{"id":"q310","category":".NET","topic":"Web API","difficulty":"Easy","question":"What is API Routing?","answer":"Mapping URLs to API actions, usually attribute routing [Route(\"api/[controller]\")].","source":"Articles (Medium: Yaseer Arafat, Platform sharks, Sanjula R)","core":false,"tier":3},{"id":"q311","category":".NET","topic":"Web API","difficulty":"Medium","question":"What is the Repository Pattern? Why is it used?","answer":"Abstracts data access behind an interface so controllers/services don't depend on EF directly; easier testing and separation of concerns.","source":"Articles (Medium: Yaseer Arafat, Platform sharks, Sanjula R)","core":false,"tier":3},{"id":"q312","category":"SQL","topic":"Procedures, Functions & More","difficulty":"Medium","question":"Query to find the 2nd highest salary?","answer":"SELECT MAX(Salary) FROM Employees WHERE Salary < (SELECT MAX(Salary) FROM Employees); or DENSE_RANK = 2.","source":"Articles (Medium: Yaseer Arafat, Platform sharks, Sanjula R)","core":false,"tier":3},{"id":"q313","category":"SQL","topic":"Procedures, Functions & More","difficulty":"Medium","question":"How do transactions work in SQL Server / EF Core?","answer":"BEGIN TRAN/COMMIT/ROLLBACK. EF Core: SaveChanges is transactional; for multiple operations use Database.BeginTransaction().","source":"Articles (Medium: Yaseer Arafat, Platform sharks, Sanjula R)","core":false,"tier":3},{"id":"q315","category":"SQL","topic":"Procedures, Functions & More","difficulty":"Easy","question":"What are Migrations in EF Core?","answer":"Versioned schema changes: Add-Migration / dotnet ef migrations add, then Update-Database.","source":"Articles (Medium: Yaseer Arafat, Platform sharks, Sanjula R)","core":false,"tier":3},{"id":"q316","category":"SQL","topic":"Procedures, Functions & More","difficulty":"Easy","question":"What are the types of Indexes in SQL?","answer":"Clustered, non-clustered, unique, composite, filtered, columnstore, full-text.","source":"Articles (Medium: Yaseer Arafat, Platform sharks, Sanjula R)","core":false,"tier":3},{"id":"q318","category":"Angular","topic":"Framework Basics","difficulty":"Easy","question":"ngIf vs hidden?","answer":"*ngIf removes/creates the element in the DOM. [hidden] keeps it and toggles CSS visibility.","source":"Articles (Medium: Yaseer Arafat, Platform sharks, Sanjula R)","core":false,"tier":3},{"id":"q319","category":"Angular","topic":"Framework Basics","difficulty":"Medium","question":"What is State management (NgRx/Redux)?","answer":"A single store with actions, reducers, selectors, effects: predictable one-way data flow, time-travel debugging.","source":"Articles (Medium: Yaseer Arafat, Platform sharks, Sanjula R)","core":false,"tier":3},{"id":"q321","category":"Angular","topic":"Framework Basics","difficulty":"Medium","question":"What are Route Guards?","answer":"CanActivate, CanDeactivate, CanMatch, Resolve: control navigation for auth and unsaved changes.","source":"Articles (Medium: Yaseer Arafat, Platform sharks, Sanjula R)","core":false,"tier":3},{"id":"q322","category":"Angular","topic":"Framework Basics","difficulty":"Medium","question":"Subject vs BehaviorSubject?","answer":"Subject emits only to current subscribers. BehaviorSubject needs an initial value and replays the latest value to new subscribers.","source":"Articles (Medium: Yaseer Arafat, Platform sharks, Sanjula R)","core":false,"tier":3},{"id":"q323","category":"Angular","topic":"Framework Basics","difficulty":"Medium","question":"How do you pass the token in Angular (Interceptor)?","answer":"An HttpInterceptor clones the request with setHeaders: { Authorization: `Bearer ${token}` }.","source":"Articles (Medium: Yaseer Arafat, Platform sharks, Sanjula R)","core":false,"tier":3},{"id":"q324","category":"Angular","topic":"Framework Basics","difficulty":"Medium","question":"Explain the component architecture in Angular.","answer":"UI split into reusable, nested components (class + template + styles) communicating via inputs, outputs and services.","source":"Articles (Medium: Yaseer Arafat, Platform sharks, Sanjula R)","core":false,"tier":3},{"id":"q325","category":"Angular","topic":"Framework Basics","difficulty":"Medium","question":"What is the purpose of Angular CLI and how does it improve the workflow?","answer":"Scaffolding, generators, dev server with live reload, production builds, tests, ng update migrations.","source":"Articles (Medium: Yaseer Arafat, Platform sharks, Sanjula R)","core":false,"tier":3},{"id":"q326","category":"Angular","topic":"Framework Basics","difficulty":"Medium","question":"How does ASP.NET Core integrate with Angular for full-stack development?","answer":"ASP.NET Core provides the API, auth and data; Angular calls it via HttpClient; in dev use a proxy, in prod serve the Angular build from wwwroot or separately.","source":"Articles (Medium: Yaseer Arafat, Platform sharks, Sanjula R)","core":false,"tier":3},{"id":"q327","category":"Angular","topic":"Framework Basics","difficulty":"Senior","question":"How do you implement authentication and authorization in Angular with an ASP.NET Core backend?","answer":"Backend: Identity/users, JWT issuing, [Authorize] and policies. Frontend: login component, auth service storing token, interceptor, guards. API always enforces authorization.","source":"Articles (Medium: Yaseer Arafat, Platform sharks, Sanjula R)","core":false,"tier":3},{"id":"q328","category":"Angular","topic":"Framework Basics","difficulty":"Medium","question":"How do you handle CORS in an Angular + ASP.NET Core app?","answer":"Nothing in Angular; on the API AddCors with a named policy for the Angular origin and app.UseCors in the right order. Dev proxy is an alternative.","source":"Articles (Medium: Yaseer Arafat, Platform sharks, Sanjula R)","core":false,"tier":3},{"id":"q329","category":"Angular","topic":"Framework Basics","difficulty":"Medium","question":"Describe deploying an Angular app with an ASP.NET Core backend.","answer":"ng build (production) -> copy dist to wwwroot or host separately -> dotnet publish -c Release -> deploy to IIS/Nginx/Azure/container, configure HTTPS, env settings, SPA fallback routing.","source":"Articles (Medium: Yaseer Arafat, Platform sharks, Sanjula R)","core":false,"tier":3},{"id":"q330","category":"Angular","topic":"Framework Basics","difficulty":"Medium","question":"Angular pipes vs ASP.NET Core middleware?","answer":"Pipes transform data for display on the client. Middleware processes HTTP requests/responses on the server. Different layers and purposes.","source":"Articles (Medium: Yaseer Arafat, Platform sharks, Sanjula R)","core":false,"tier":3},{"id":"q331","category":"Angular","topic":"Framework Basics","difficulty":"Medium","question":"Write a custom directive example (e.g. highlight).","answer":"@Directive({selector:'[appHighlight]'}) with ElementRef and @HostListener('mouseenter'/'mouseleave') to change background colour.","source":"Articles (Medium: Yaseer Arafat, Platform sharks, Sanjula R)","core":false,"tier":3},{"id":"q333","category":"Coding","topic":"Problem Solving","difficulty":"Medium","question":"Reverse a linked list.","answer":"Iterate with prev, current, next pointers: next = cur.Next; cur.Next = prev; prev = cur; cur = next. Return prev.","source":"Articles (Medium: Yaseer Arafat, Platform sharks, Sanjula R)","core":false,"tier":3},{"id":"q336","category":"Coding","topic":"Problem Solving","difficulty":"Medium","question":"Build a CRUD API in ASP.NET Core.","answer":"Entity + DbContext, controller with GET (list/by id), POST (201 + Location), PUT (204), DELETE (204); DTOs, validation, async EF calls.","source":"Articles (Medium: Yaseer Arafat, Platform sharks, Sanjula R)","core":false,"tier":3},{"id":"q337","category":"Coding","topic":"Problem Solving","difficulty":"Medium","question":"Implement pagination in Angular with an API.","answer":"API accepts page & pageSize, returns items + total. Angular service passes params via HttpParams; component tracks page and renders with a paginator.","source":"Articles (Medium: Yaseer Arafat, Platform sharks, Sanjula R)","core":false,"tier":3},{"id":"q340","category":"Architecture","topic":"System Design","difficulty":"Medium","question":"How do you run background jobs in ASP.NET Core?","answer":"IHostedService/BackgroundService, Hangfire, Quartz.NET, or a queue + worker.","source":"Articles (Medium: Yaseer Arafat, Platform sharks, Sanjula R)","core":false,"tier":3},{"id":"q341","category":"Architecture","topic":"System Design","difficulty":"Easy","question":"Horizontal vs Vertical Scaling?","answer":"Vertical: bigger machine. Horizontal: more instances behind a load balancer (needs stateless services).","source":"Articles (Medium: Yaseer Arafat, Platform sharks, Sanjula R)","core":false,"tier":3},{"id":"q342","category":"Architecture","topic":"System Design","difficulty":"Senior","question":"How do you secure APIs with OAuth2 and JWT?","answer":"OAuth2/OIDC provider issues tokens; API validates JWT signature, issuer, audience, expiry; scopes/roles for authorization; short-lived access + refresh tokens; HTTPS only.","source":"Articles (Medium: Yaseer Arafat, Platform sharks, Sanjula R)","core":false,"tier":3},{"id":"q343","category":"Architecture","topic":"System Design","difficulty":"Senior","question":"What is Clean Architecture in .NET Core?","answer":"Domain at the centre, Application (use cases), Infrastructure and UI on the outside; dependencies point inward. Testable, framework-independent core.","source":"Articles (Medium: Yaseer Arafat, Platform sharks, Sanjula R)","core":false,"tier":3},{"id":"q344","category":"Architecture","topic":"System Design","difficulty":"Senior","question":"What is Microservices architecture in .NET Core?","answer":"Small independent services with their own data, communicating via HTTP/gRPC or messaging, containerised (Docker/Kubernetes), with gateway, service discovery, observability.","source":"Articles (Medium: Yaseer Arafat, Platform sharks, Sanjula R)","core":false,"tier":3},{"id":"q345","category":".NET","topic":"Web API","difficulty":"Medium","question":"What is CORS in MVC? (ValueCoders)","answer":"Cross-Origin Resource Sharing: browser security that blocks requests from another origin unless the server returns Access-Control-Allow-* headers. Enable with a CORS policy.","source":"Glassdoor & LinkedIn (real interviews)","core":false,"tier":3},{"id":"q346","category":".NET","topic":"Web API","difficulty":"Medium","question":"Interface uses and Web API questions (SOTI)","answer":"Interfaces as contracts for DI and testing (IRepository, IService); Web API: verbs, status codes, routing, auth.","source":"Glassdoor & LinkedIn (real interviews)","core":false,"tier":3},{"id":"q347","category":".NET","topic":"Web API","difficulty":"Easy","question":"What is SQL Injection?","answer":"Attacker input altering a SQL query. Prevent with parameterised queries/EF, input validation, least-privilege DB accounts.","source":"Glassdoor & LinkedIn (real interviews)","core":false,"tier":3},{"id":"q348","category":".NET","topic":"C# General","difficulty":"Medium","question":"IEnumerable vs ICollection: what's the difference? (DXC Senior)","answer":"IEnumerable: iterate only. ICollection adds Count, Add, Remove, Contains, Clear. IList adds index access.","source":"Glassdoor & LinkedIn (real interviews)","core":false,"tier":3},{"id":"q349","category":".NET","topic":"C# General","difficulty":"Medium","question":"Generic vs non-generic collections (Programmers.io)","answer":"Generic (List<T>): type-safe, no boxing, faster. Non-generic (ArrayList): object-based, casting and boxing.","source":"Glassdoor & LinkedIn (real interviews)","core":false,"tier":3},{"id":"q350","category":".NET","topic":"C# General","difficulty":"Medium","question":"What are query parameters in Web API?","answer":"Values in the URL after ? bound with [FromQuery]; used for filtering, paging, sorting.","source":"Glassdoor & LinkedIn (real interviews)","core":false,"tier":3},{"id":"q351","category":"SQL","topic":"Procedures, Functions & More","difficulty":"Medium","question":"SQL: View, temp table, OUTPUT clause, inner join, second highest salary, SPs vs functions, Rank functions (Programmers.io)","answer":"Temp tables (#t) live per session and are stored in tempdb; table variables are lighter. OUTPUT returns affected rows from DML. RANK leaves gaps, DENSE_RANK doesn't, ROW_NUMBER is unique.","source":"Glassdoor & LinkedIn (real interviews)","core":false,"tier":3},{"id":"q352","category":"SQL","topic":"Procedures, Functions & More","difficulty":"Medium","question":"SQL UNION vs UNION ALL; many-to-many relation (Integrant)","answer":"UNION removes duplicates (sort cost), UNION ALL keeps them (faster). Many-to-many needs a junction table with two foreign keys.","source":"Glassdoor & LinkedIn (real interviews)","core":false,"tier":3},{"id":"q353","category":"SQL","topic":"Procedures, Functions & More","difficulty":"Medium","question":"Inner join vs outer join; database integrity (Itlize)","answer":"Inner returns matches only; outer also returns non-matching rows with NULLs. Integrity: entity (PK), referential (FK), domain (constraints).","source":"Glassdoor & LinkedIn (real interviews)","core":false,"tier":3},{"id":"q354","category":"SQL","topic":"Procedures, Functions & More","difficulty":"Senior","question":"Database design: a real problem (Gartner)","answer":"Clarify entities and access patterns, normalise to 3NF, choose keys and indexes, decide on denormalisation for reads, constraints for integrity, plan growth/archival.","source":"Glassdoor & LinkedIn (real interviews)","core":false,"tier":3},{"id":"q355","category":"Angular","topic":"Framework Basics","difficulty":"Medium","question":"Difference between Observables and Promise, what is RxJS, Redux, reducers? (Programmers.io)","answer":"Observable streams vs single-value Promise. RxJS operators. Redux/NgRx: store + actions; reducers are pure functions (state, action) => new state.","source":"Glassdoor & LinkedIn (real interviews)","core":false,"tier":3},{"id":"q356","category":"Angular","topic":"Framework Basics","difficulty":"Medium","question":"How would you identify Components, Services and Directives in Angular?","answer":"By decorator: @Component (has template), @Injectable (service logic), @Directive (behaviour on existing elements, attribute selector).","source":"Glassdoor & LinkedIn (real interviews)","core":false,"tier":3},{"id":"q357","category":"Angular","topic":"Framework Basics","difficulty":"Easy","question":"What is the difference between Angular and TypeScript? (ValueCoders)","answer":"TypeScript is a language; Angular is a framework written in and using TypeScript.","source":"Glassdoor & LinkedIn (real interviews)","core":false,"tier":3},{"id":"q358","category":"Architecture","topic":"System Design","difficulty":"Senior","question":"Elasticsearch: when would you use it? (Gartner)","answer":"For full-text search, relevance ranking, faceting and log analytics over large data; keep SQL as source of truth and sync to the index.","source":"Glassdoor & LinkedIn (real interviews)","core":false,"tier":3},{"id":"q359","category":".NET","topic":"C# General","difficulty":"Medium","question":"What's the difference between a record and a class, and when do you use a record?","answer":"Record: reference type with value-based equality, ToString, and with-expressions; for immutable data (DTOs, value objects, events). Class: identity and mutable behaviour (entities, services).","source":"codewithmukesh .NET 2026 guide (scenario questions)","core":false,"tier":3},{"id":"q360","category":".NET","topic":"C# General","difficulty":"Medium","question":"What happens when you box a value type, and why should you care?","answer":"Heap allocation + copy; in hot loops it creates GC pressure and latency. Avoid with generics and Span<T>.","source":"codewithmukesh .NET 2026 guide (scenario questions)","core":false,"tier":3},{"id":"q361","category":".NET","topic":"C# General","difficulty":"Senior","question":"You see async void in a code review. Why do you flag it?","answer":"Can't be awaited, exceptions can't be caught by the caller and may crash the process. Only valid for event handlers; use async Task.","source":"codewithmukesh .NET 2026 guide (scenario questions)","core":false,"tier":3},{"id":"q362","category":".NET","topic":"Threading & Async","difficulty":"Senior","question":"What happens when you call .Result or .Wait() on a Task?","answer":"Blocks the thread; under load it causes thread-pool starvation and possible deadlocks. Go async all the way.","source":"codewithmukesh .NET 2026 guide (scenario questions)","core":false,"tier":3},{"id":"q363","category":".NET","topic":"Threading & Async","difficulty":"Medium","question":"What's the difference between Task and Thread? (scenario)","answer":"Thread is a heavy OS thread. Task is work that may use a pool thread or none at all while awaiting I/O, which is why async scales.","source":"codewithmukesh .NET 2026 guide (scenario questions)","core":false,"tier":3},{"id":"q364","category":".NET","topic":"Threading & Async","difficulty":"Medium","question":"When does a LINQ query actually execute?","answer":"Deferred: on enumeration (ToList, Count, First, foreach). Enumerating twice runs it twice; materialise if reused.","source":"codewithmukesh .NET 2026 guide (scenario questions)","core":false,"tier":3},{"id":"q365","category":".NET","topic":"Service Lifetimes, Middleware & Hosting","difficulty":"Medium","question":"What's the correct middleware order for Routing, CORS, Authentication, Authorization?","answer":"UseRouting -> UseCors -> UseAuthentication -> UseAuthorization -> endpoints. Wrong order gives silent 401s or missing CORS headers.","source":"codewithmukesh .NET 2026 guide (scenario questions)","core":false,"tier":3},{"id":"q366","category":".NET","topic":"Service Lifetimes, Middleware & Hosting","difficulty":"Senior","question":"You inject a Scoped service into a Singleton. What happens?","answer":"Captive dependency: the singleton holds one scoped instance forever (e.g. one DbContext for all requests): thread-safety bugs, stale data. Fix with IServiceScopeFactory; scope validation catches it in dev.","source":"codewithmukesh .NET 2026 guide (scenario questions)","core":false,"tier":3},{"id":"q367","category":".NET","topic":"ADO.NET & Entity Framework","difficulty":"Senior","question":"Your endpoint returns 50 rows but logs show 51 queries. What happened?","answer":"N+1 problem: one query for parents plus one per row for a navigation property. Fix with Include or projection via Select; watch EF logs.","source":"codewithmukesh .NET 2026 guide (scenario questions)","core":false,"tier":3},{"id":"q368","category":".NET","topic":"ADO.NET & Entity Framework","difficulty":"Medium","question":"When do you use AsNoTracking, and what's the catch?","answer":"Read-only queries to save memory/CPU. Catch: no identity resolution (duplicates materialise twice) and you can't SaveChanges on those entities.","source":"codewithmukesh .NET 2026 guide (scenario questions)","core":false,"tier":3},{"id":"q369","category":"Architecture","topic":"System Design","difficulty":"Senior","question":"Design a rate limiter for a multi-tenant API.","answer":"Partition by tenant/API key; token bucket or sliding window; in a multi-instance setup store counters in Redis; return 429 with Retry-After; decide fail-open vs fail-closed.","source":"codewithmukesh .NET 2026 guide (scenario questions)","core":false,"tier":3},{"id":"q370","category":"Architecture","topic":"System Design","difficulty":"Senior","question":"Your background job processor is 2 million messages behind. What do you do?","answer":"Find the bottleneck (CPU, I/O, downstream DB, single partition), scale consumers only if the bottleneck allows, make handlers idempotent, batch, add a dead-letter queue.","source":"codewithmukesh .NET 2026 guide (scenario questions)","core":false,"tier":3},{"id":"q371","category":"Architecture","topic":"System Design","difficulty":"Senior","question":"How do you make a payment API endpoint idempotent?","answer":"Client sends an idempotency key; server stores key + result atomically in the same transaction as the charge; replays return the stored result.","source":"codewithmukesh .NET 2026 guide (scenario questions)","core":false,"tier":3},{"id":"q372","category":"Architecture","topic":"System Design","difficulty":"Senior","question":"When would you NOT use microservices?","answer":"Small team, evolving domain, no independent scaling pressure, low DevOps maturity. Start with a modular monolith and extract services when a real need appears.","source":"codewithmukesh .NET 2026 guide (scenario questions)","core":false,"tier":3},{"id":"q373","category":"Architecture","topic":"System Design","difficulty":"Senior","question":"Is CQRS worth it, and when would you introduce it?","answer":"When read and write paths genuinely differ in shape or scale; not for simple CRUD, because it adds moving parts and eventual consistency.","source":"codewithmukesh .NET 2026 guide (scenario questions)","core":false,"tier":3},{"id":"q374","category":"Architecture","topic":"System Design","difficulty":"Senior","question":"200 requests hit a cold cache key at once and all go to the database. What is this and how do you stop it?","answer":"Cache stampede. Use HybridCache (built-in stampede protection) or a per-key lock so one request recomputes while others wait.","source":"codewithmukesh .NET 2026 guide (scenario questions)","core":false,"tier":3},{"id":"q375","category":"Architecture","topic":"System Design","difficulty":"Medium","question":"How do you integration-test an API that hits a real database?","answer":"WebApplicationFactory + Testcontainers with a real DB engine; the EF in-memory provider doesn't behave like SQL.","source":"codewithmukesh .NET 2026 guide (scenario questions)","core":false,"tier":3},{"id":"q376","category":"Architecture","topic":"System Design","difficulty":"Senior","question":"How do you handle graceful shutdown of a .NET API in Kubernetes?","answer":"On SIGTERM stop accepting requests, finish in-flight work within the shutdown timeout, honour stoppingToken in BackgroundService, flip readiness probe first.","source":"codewithmukesh .NET 2026 guide (scenario questions)","core":false,"tier":3},{"id":"q377","category":".NET","topic":"Web API","difficulty":"Medium","question":"Your POST creates a resource and triggers an async background job. What status code do you return?","answer":"201 Created + Location if the resource exists now; 202 Accepted + status URL if the work is only queued. Not 200.","source":"codewithmukesh .NET 2026 guide (scenario questions)","core":false,"tier":3}];window.DUPS={"q009": "c06", "q012": "c04", "q013": "c02", "q027": "c15", "q036": "c10", "q046": "c12", "q050": "p08", "q071": "c44", "q082": "c52", "q083": "c52", "q091": "c42", "q099": "c39", "q104": "c38", "q155": "p01", "q171": "c28", "q184": "c20", "q185": "c21", "q186": "c22", "q187": "c23", "q188": "c24", "q196": "c33", "q218": "c66", "q225": "c65", "q243": "p43", "q302": "c10", "q305": "c16", "q314": "c59", "q317": "c61", "q320": "c59", "q332": "p48", "q334": "p53", "q335": "p49", "q338": "p14", "q339": "c32", "q378": "c36"};</script>
<script>/* ===== Interview Coach — core: storage, SRS, analytics, plan engine, AI/voice/reminder adapters ===== */
'use strict';
const KEY = 'ipcoach.v1';
const DAY = 86400000;
const pad = n => String(n).padStart(2, '0');

const daysBetween = (a, b) => Math.round((parseD(b) - parseD(a)) / DAY);
const today = () => dkey();
const uid = p => (p || 'id') + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0;
const pct = v => Math.round(v * 100);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[a[i], a[j]] = [a[j], a[i]]; } return a; };

/* ---------- default state ---------- */
function defaultProfile() {

    goalRole: 'Senior Full-Stack Developer (.NET + Angular)', targetSalary: '₹10 LPA+', targetDate: '',

    reminderMode: 'persistent', maxReminders: 4, snoozeMin: 15, quietStart: '23:00', quietEnd: '07:00',
    intervals: [1, 3, 7, 14, 30, 60], focusMode: true, voiceOut: true, theme: 'system',
    coreOnly: true, silenceSec: 3, remindGap: 30, backupPrompt: true, sessionFocus: true, showHint: true, voiceKeep: 200, habitOverride: '', voiceRate: 1, voiceLang: 'en-IN', voiceName: '', fontScale: 1, reduceMotion: false, aiMockDefault: true, onboarded: false, askedTimeOn: '', recovery: null, scheduleHintDismissed: ''
  };
}
function freshSrs() {
  return { step: 0, due: null, attempts: 0, correct: 0, partial: 0, incorrect: 0, lapses: 0, conf: 0, lastAt: null, lastResult: null, lastCorrectAt: null, firstAt: null, avgSec: 0, revisions: 0 };
}
function makeQ(raw, src) {
  return {
    id: raw.id || uid('q'), category: raw.category || 'General', topic: raw.topic || raw.category || 'General',
    difficulty: raw.difficulty || 'Medium', question: raw.question, answer: raw.answer || '', tags: raw.tags || [],
    source: raw.source || src || 'Imported', custom: !!raw.custom, core: !!raw.core, tier: raw.tier ?? (raw.core ? 1 : 3),
    srs: freshSrs(), flags: { bookmark: false, important: false, difficult: false, tomorrow: false },

}
function defaultState() {
  return {
    v: 1, created: Date.now(), profile: defaultProfile(),
    questions: (window.BANK || []).map(q => makeQ(q)),
    attempts: [], comm: [], days: {}, plan: null, adhoc: null, active: null,
    mocks: [], jobs: [], stories: [], sessions: [], voice: [], meta: { lastBackupAt: 0, backupSnooze: '' }, resume: { text: '', fileName: '', analysedAt: 0, source: '', summary: '', skills: [], experience: [], count: 0 }, remind: { date: '', count: 0, lastAt: 0, snoozeUntil: 0, morningShown: '' }
  };
}

/* ---------- storage (localStorage with in-memory fallback) ---------- */
let S; let storageOK = true;
const SAFE_KEY = KEY + '.safety';          // copy of the previous data format / pre-restore state
let bankIdx = null; const BANKI = () => bankIdx || (bankIdx = Object.fromEntries((window.BANK || []).map(b => [b.id, b])));
// Built-in questions are stored as progress only (id + revision data); their text lives in the bank.
function packQ(q) {
  const o = { id: q.id, _ref: 1, srs: q.srs, flags: q.flags, notes: q.notes };
  if (q.realGap) { o.realGap = true; o.gapNote = q.gapNote || ''; } return o;
}
function packState(st) { const b = BANKI(); return Object.assign({}, st, { fmt: 2, questions: st.questions.map(q => (b[q.id] && !q.custom && !q.edited) ? packQ(q) : q) }); }
function unpackState(st) {
  if (!st || !Array.isArray(st.questions)) throw new Error('not Interview Coach data');
  if (!st.questions.some(q => q && q._ref)) return st;
  const b = BANKI();
  st.questions = st.questions.map(q => {
    if (!q._ref) return q;
    const base = b[q.id] ? makeQ(b[q.id]) : makeQ({ id: q.id, question: '(question no longer in the bank)', category: 'General', topic: 'Removed' });
    return Object.assign(base, { srs: q.srs || base.srs, flags: q.flags || base.flags, notes: q.notes || base.notes, realGap: !!q.realGap, gapNote: q.gapNote || '' });
  });

}
function load() {

  try { raw = localStorage.getItem(KEY); } catch (e) { storageOK = false; }

    try { S = unpackState(JSON.parse(raw)); migrate(); U_loadedFmt = raw.includes('"fmt":2') ? 2 : 1; return; }
    catch (e) {   // never overwrite data we could not read: keep it aside, then try the safety copy
      try { localStorage.setItem(KEY + '.unreadable-' + Date.now(), raw); } catch (x) { }
      try { const s2 = localStorage.getItem(SAFE_KEY); if (s2) { S = unpackState(JSON.parse(s2)); migrate(); return; } } catch (x) { }
    }
  }

}
let U_loadedFmt = 0;
function migrate() {
  const d = defaultState();

  S.profile = Object.assign(defaultProfile(), S.profile);
  // bring in questions added to the bank since this data was saved (e.g. the Core priority list)
  const bank = window.BANK || [], byId = Object.fromEntries(bank.map(b => [b.id, b])), have = new Set(S.questions.map(q => q.id));
  const added = bank.filter(b => !have.has(b.id)).map(b => makeQ(b)); if (added.length) S.questions = added.filter(q => q.core).concat(S.questions, added.filter(q => !q.core));
  S.questions.forEach(q => { if (byId[q.id]) { q.core = !!byId[q.id].core; q.tier = byId[q.id].tier || (q.core ? 1 : 3); if (q.core && !q.edited) { q.answer = byId[q.id].answer; q.question = byId[q.id].question; } } else if (q.tier == null) q.tier = q.core ? 1 : 3; });
  // duplicates of Core / Priority questions: drop if never practised, otherwise keep progress but hide from new work
  const D = window.DUPS || {};
  S.questions = S.questions.filter(q => !(D[q.id] && !q.srs?.attempts && !q.edited && !q.custom));
  S.questions.forEach(q => { if (D[q.id]) q.dupOf = D[q.id]; });
  if (typeof careerMigrate === 'function') careerMigrate();
  S.questions.forEach(q => { q.srs = Object.assign(freshSrs(), q.srs); q.flags = Object.assign({ bookmark: false, important: false, difficult: false, tomorrow: false }, q.flags); q.notes = Object.assign({ remember: '', project: '', interview: '', mistake: '' }, q.notes); });
}
let saveT = null;
function save(now) {
  S.updatedAt = Date.now();
  const run = () => {
    try {
      if (U_loadedFmt === 1) { try { localStorage.setItem(SAFE_KEY, localStorage.getItem(KEY)); } catch (x) { } U_loadedFmt = 2; }   // one-time copy of the old format
      localStorage.setItem(KEY, JSON.stringify(packState(S))); storageOK = true;
    } catch (e) { storageOK = false; }
  };
  clearTimeout(saveT); if (now) run(); else saveT = setTimeout(run, 150);
  if (typeof Cloud !== 'undefined') Cloud.schedule(now);
  if (typeof Account !== 'undefined') Account.schedule(now);
  if (typeof PWA !== 'undefined' && PWA.reg) PWA.post();
}
const qById = id => S.questions.find(q => q.id === id);

/* ---------- SRS ---------- */
// result: 'correct' | 'partial' | 'incorrect' ; conf 1..5
function schedule(q, result, conf, sec, mode) {
  const s = q.srs, iv = S.profile.intervals.length ? S.profile.intervals : [1, 3, 7, 14, 30, 60], t = today();
  const wasSeen = s.attempts > 0;
  s.attempts++; if (!s.firstAt) s.firstAt = Date.now();
  s.avgSec = s.avgSec ? Math.round(s.avgSec * .7 + (sec || 0) * .3) : (sec || 0);
  s.conf = conf || s.conf || 3;
  let days;
  if (result === 'correct') {
    s.correct++; s.lastCorrectAt = Date.now();
    days = iv[Math.min(s.step, iv.length - 1)];
    if (conf <= 2) days = Math.max(1, Math.round(days * .5));
    else if (conf >= 5 && s.step > 0) days = Math.round(days * 1.3);
    s.step = conf <= 2 ? s.step : Math.min(s.step + 1, iv.length);
  } else if (result === 'partial') {
    s.partial++; days = Math.max(1, Math.round(iv[Math.min(s.step, iv.length - 1)] / 2));
    if (conf <= 2) days = 1;
  } else {
    s.incorrect++; if (wasSeen && s.lastResult === 'correct') s.lapses++;
    s.step = 0; days = 1;
  }
  if (wasSeen) s.revisions++;
  s.lastResult = result; s.lastAt = Date.now(); s.due = addDays(t, days);
  if (q.realGap && result === 'correct' && conf >= 4 && s.step >= 3) q.realGap = false;

  save();
}
function mastery(q) {
  const s = q.srs;
  if (!s.attempts) return 'new';
  const acc = (s.correct + s.partial * .5) / s.attempts;
  if (q.realGap || s.lastResult === 'incorrect' || (s.attempts >= 2 && acc < .5) || s.conf <= 2) return 'weak';
  if (s.step >= 5 && s.lastResult === 'correct' && s.conf >= 4) return 'mastered';
  if (s.step >= 3) return 'strong';
  return 'learning';
}
const MASTERY_W = { new: 0, weak: .2, learning: .45, strong: .75, mastered: 1 };
function isDue(q, t = today()) { return q.srs.due && q.srs.due <= t; }
function overdueDays(q, t = today()) { return q.srs.due ? daysBetween(q.srs.due, t) : 0; }
function isForgotten(q, t = today()) {
  const s = q.srs; if (!s.lastCorrectAt || s.lastResult !== 'correct') return false;
  return (Date.now() - s.lastAt) / DAY >= 21 || overdueDays(q, t) >= 7;
}

/* ---------- day / streak / consistency ---------- */
function dayRec(k = today()) { if (!S.days[k]) S.days[k] = { minutes: 0, answered: 0, status: '', planDone: false }; return S.days[k]; }
function addMinutes(sec) {
  const d = dayRec(); d.minutes = Math.round((d.minutes * 60 + clamp(sec, 0, 300)) / 60 * 10) / 10; d.answered++;
  if (!d.firstAt) d.firstAt = Date.now(); d.lastAt = Date.now();
  if (d.status !== 'complete' && d.minutes >= S.profile.minMinutes) { if (d.status !== 'maintained') d.justMaintained = true; d.status = 'maintained'; }
  save();
}
function dayState(k) {
  const d = S.days[k] || {}, min = S.profile.minMinutes;
  const planDone = !!d.planDone || d.status === 'complete';
  const minDone = planDone || d.status === 'maintained' || (d.minutes || 0) >= min;
  return { minutes: d.minutes || 0, planDone, minDone, rest: d.status === 'rest', skipped: d.status === 'skipped' };
}
function dayOk(k) { const s = dayState(k); return s.minDone || s.rest; }
// The single source of truth used by the dashboard, reminders, service worker and sync.
function getTodayStudyStatus() {
  const t = today(), s = dayState(t), plan = S.plan && S.plan.date === t ? S.plan : null, pp = planProgress(plan);
  const planDone = s.planDone || !!(pp.total && pp.done === pp.total);
  return { date: t, minutes: s.minutes, minMinutes: S.profile.minMinutes, minDone: s.minDone || planDone, planDone, maintained: s.minDone || planDone,
    tasksDone: pp.done, tasksTotal: pp.total, planMinutes: planMinutes(plan), active: !!(S.active && (S.active.date || t) === t),
    skipped: s.skipped, rest: s.rest, excused: s.skipped || s.rest, recovery: recoveryInfo(), missed: missedDays() };
}
function consistency7() { let n = 0; for (let i = 0; i < 7; i++) { const k = addDays(today(), -i); if (dayOk(k)) n++; } return n; }
function consistencyDays() {   // "6/7 days"; a new user sees days since they started, and "Day 1" before the first session
  const first = Object.keys(S.days).filter(k => (S.days[k] || {}).minutes > 0 || (S.days[k] || {}).status).sort()[0];
  if (!first) return { n: 0, of: 1, text: 'Day 1' };
  const span = clamp(daysBetween(first, today()) + 1, 1, 7), n = consistency7();
  return { n, of: span, text: `${n}/${span} days` };
}
function weekKey(k = today()) { const d = parseD(k), dow = (d.getDay() + 6) % 7; return addDays(k, -dow); }   // Monday of this week
function restUsedThisWeek() { const mon = weekKey(); for (let i = 0; i < 7; i++) { const k = addDays(mon, i); if (S.days[k]?.status === 'rest') return k; } return null; }
function streak() {
  let k = today(), n = 0; if (!dayOk(k)) k = addDays(k, -1);
  while (dayOk(k)) { n++; k = addDays(k, -1); }
  return n;
}
function longestStreak() {
  const ks = Object.keys(S.days).filter(dayOk).sort(); let best = 0, cur = 0, prev = null;
  for (const k of ks) { cur = prev && daysBetween(prev, k) === 1 ? cur + 1 : 1; best = Math.max(best, cur); prev = k; }
  return best;
}
function lastActiveDay() {
  const ks = Object.keys(S.days).filter(k => (S.days[k] || {}).minutes > 0).sort(); return ks.length ? ks[ks.length - 1] : null;
}
function missedDays() {   // full days missed before today (rest days count as present)
  const t = today(); const ks = Object.keys(S.days).filter(k => k < t && ((S.days[k] || {}).minutes > 0 || (S.days[k] || {}).status === 'rest')).sort();
  if (!ks.length) return null; return Math.max(0, daysBetween(ks[ks.length - 1], t) - 1);
}
/* graduated recovery: 1 day → normal; 2–6 → 15,30; 7–13 → 15,30,45 (no new questions for 2 days); 14+ → confirm goal, then 15,30,45 */
function recoveryInfo() {
  const p = S.profile, t = today(); let r = p.recovery;
  if (r && !r.ramp) r = p.recovery = null;   // older format
  const miss = missedDays();
  if (miss != null && miss >= 2) {
    const studied = Object.keys(S.days).filter(k => k < t && (S.days[k] || {}).minutes > 0).sort(), last = studied[studied.length - 1];
    if (!r || (last && r.started <= last)) r = p.recovery = { started: t, missed: miss, confirmed: miss < 14 };
    else if (r.started !== t && miss > r.missed) r.missed = miss;   // opened before but never studied: gap keeps growing
    r.ramp = r.missed >= 7 ? [15, 30, 45] : [15, 30]; r.noNewDays = r.missed >= 7 ? 2 : 0; if (r.missed >= 14 && !r.confirmAsked) r.confirmed = false;
  }
  if (!r) return null;
  const step = Object.keys(S.days).filter(k => k >= r.started && k < t && (S.days[k] || {}).minutes > 0).length;
  if (step >= r.ramp.length) { p.recovery = null; return null; }
  return { active: true, step, day: step + 1, days: r.ramp.length + 1, minutes: r.ramp[step], noNew: step < r.noNewDays, missed: r.missed, confirmed: r.confirmed !== false, first: step === 0 };
}
function daysAway() { const l = lastActiveDay(); if (!l) return null; return daysBetween(l, today()); }
function consistency(n = 7) {
  const t = today(); let done = 0, planned = 0, min = 0, skipped = 0, comm = 0, mock = 0;
  for (let i = 1; i <= n; i++) {
    const k = addDays(t, -i), d = S.days[k]; planned++;
    if (d?.status === 'complete') done++; else if (d?.status === 'maintained') min++; else if (d?.status === 'skipped') skipped++;
  }
  const since = Date.now() - n * DAY;

/* Learn it first: the answer in small pieces, listen, a memory hook, then practise by voice or typing */
function answerPoints(ans) {
  const lines = String(ans || '').split('\n').map(l => l.trim()).filter(Boolean), out = []; let code = [];
  const isCode = l => /[;{}]\s*$|=>|^(public|private|static|var|const|let|select|from|where|join|group by|order by|with|begin|end|foreach|for\s*\(|if\s*\(|return|await)\b/i.test(l) || /^\s*(\/\/|--)/.test(l);
  const flush = () => { if (code.length) { out.push({ code: code.join('\n') }); code = []; } };
  for (const l of lines) { if (isCode(l)) { code.push(l); continue; } flush();
    if (l.length > 220 && !/^[•\-\d]/.test(l)) l.split(/(?<=[.!?])\s+(?=[A-Z])/).forEach(x => out.push({ text: x })); else out.push({ text: l.replace(/^[•\-]\s*/, '') }); }
  flush(); return out;
}
function learnTerms(q) {   // the words an interviewer listens for: line headings, acronyms, API/type names
  const A = String(q.answer || ''), skip = /^(one line|example|examples|interview line|interview tip|in my project|note|why|how|what|also|rule|rule of thumb|trade-?off|answer|best answer|other ways|explain|order|output|result|then|use|so|select|from|where|with|as|over|order|by|group|in|the|and|or|not|same|resets|after|before|database|separate|all|only|never|always|both|it|is|are|one|two)$/i, out = [];
  const add = t => { t = String(t).trim().replace(/[.,;:]+$/, ''); if (t.length < 2 || t.length > 40 || skip.test(t) || out.some(x => x.toLowerCase() === t.toLowerCase())) return; out.push(t); };
  for (const l of A.split('\n')) { const m = l.replace(/^[•\-\d.)\s]+/, '').match(/^([^–:\-]{2,40}?)\s*(?:–|—|:| - )/); if (m && m[1].split(' ').length <= 4) add(m[1]); }
  (A.match(/\b[A-Z]{2,}[a-z]?s?\b/g) || []).forEach(add);
  (A.match(/\b[A-Z][a-z]+[A-Z][A-Za-z]*\b|\b\w+\(\)|\b[A-Z]\w*\.[A-Z]\w*/g) || []).forEach(add);
  return out.slice(0, 10);
}
function learnHtml(q) {

  ${terms.length ? `<div class="stack"><span class="lbl">Key terms to say</span><div class="kw">${terms.map(k => `<span class="hit">${esc(k)}</span>`).join('')}</div></div>` : ''}
  <div class="field"><label for="n_learn">How will you remember it? (optional)</label><textarea class="input" id="n_learn" rows="2" placeholder="A one-line hook, an example from your project…">${esc(q.notes.remember || '')}</textarea></div>

function parseCSV(text) {
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true; else if (c === ',' || c === '\t' && !text.includes(',')) { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  const head = (rows.shift() || []).map(h => h.trim().toLowerCase());
  return rows.filter(r => r.some(x => x.trim())).map(r => Object.fromEntries(head.map((h, i) => [h, (r[i] || '').trim()])));
}
function normRow(o) {
  const g = (...ks) => { for (const k of ks) for (const key of Object.keys(o)) if (key.toLowerCase() === k) return o[key]; return ''; };
  let d = String(g('difficulty', 'level') || 'Medium'); d = /sen|hard|adv|s$/i.test(d) ? 'Senior' : /eas|beg|basic|^e$/i.test(d) ? 'Easy' : 'Medium';
  const tags = g('tags'); return { question: String(g('question', 'q', 'title') || '').trim(), answer: String(g('answer', 'a', 'reference', 'solution') || '').trim(), category: String(g('category', 'area', 'section') || 'General').trim(), topic: String(g('topic', 'subtopic', 'category') || 'General').trim(), difficulty: d, tags: Array.isArray(tags) ? tags : String(tags || '').split(/[;|]/).map(x => x.trim()).filter(Boolean) };
}
function previewImport(text) {
  text = String(text || '').trim(); let rows = [];
  if (text.startsWith('[') || text.startsWith('{')) { let j = JSON.parse(text); if (!Array.isArray(j)) j = j.questions || []; rows = j; } else rows = parseCSV(text);
  const existing = new Set(S.questions.map(q => norm(q.question))), seen = new Set(); const valid = [], invalid = [], dups = []; let missing = 0;
  for (const r of rows.map(normRow)) {
    if (!r.question) { invalid.push(r); continue; } const k = norm(r.question);
    if (existing.has(k) || seen.has(k)) { dups.push(r); continue; } seen.add(k); if (!r.answer || r.topic === 'General') missing++; valid.push(r);
  }
  return { valid, invalid, dups, missing };
}

function mainPool() { const base = coreActive() ? S.questions.filter(q => q.core) : S.questions; return base.filter(q => !q.dupOf); }
function studiedFirst(pool) { const seen = pool.filter(q => q.srs.attempts), due = seen.filter(q => isDue(q) || mastery(q) === 'weak' || q.realGap); return [...new Set(shuffle(due).concat(shuffle(seen), pool.filter(q => !q.srs.attempts)))]; }
function projectItems(n) {
  const st = S.stories.map(s => ({ text: `Explain your ${s.kind === 'achievement' ? 'achievement' : 'project'}: ${s.title}. What was the problem, what did you do, and what was the result?`, storyId: s.id }));
  const rq = S.questions.filter(q => q.tier === 0 && /project|architecture|experience|challeng/i.test(q.topic + ' ' + q.question)).map(q => ({ qid: q.id }));
  const generic = [{ text: 'Explain your current project end to end: users, architecture, and your part.' }, { text: 'What was the hardest technical problem in your current project, and how did you solve it?' }, { text: 'Tell me about a production issue you handled.' }];
  return st.concat(shuffle(rq), generic).slice(0, n);
}
function viItems(mode, n) {
  const M = VI_MODES[mode], pool = mainPool();
  const take = (arr, k, extra = {}) => arr.slice(0, k).map(q => Object.assign(q.id ? { qid: q.id } : q, extra));
  if (mode === 'full') {
    const used = new Set(), pick = (arr, k) => { const out = []; for (const q of arr) { if (out.length >= k) break; if (used.has(q.id)) continue; used.add(q.id); out.push(q); } return out; };
    const tech = pick(studiedFirst(pool.filter(q => ['.NET', 'Angular', 'SQL'].includes(q.category))), 3);
    const scen = pick(studiedFirst(pool.filter(q => /scenario|troubleshoot|performance|production/i.test(q.topic))), 1);
    const des = pick(studiedFirst(pool.filter(q => q.category === 'Architecture' && !/scenario/i.test(q.topic))), 1);
    return [{ text: 'Tell me about yourself.', round: 'Self introduction', kind: 'story', target: 90 }]
      .concat(projectItems(1).map(x => Object.assign(x, { round: 'Project deep dive', kind: 'story', target: 120 })))
      .concat(take(tech, 3, { round: 'Technical', target: 90 }), take(scen, 1, { round: 'Production scenario', target: 120 }), take(des, 1, { round: 'System design', target: 150 }))
      .concat([{ text: shuffle(HR_PROMPTS)[0], round: 'Behavioral / HR', kind: 'story', target: 90 }, { text: 'Do you have any questions for us?', round: 'Your questions', kind: 'story', target: 60, noFollow: true }]);
  }
  if (mode === 'project') return projectItems(n);
  if (mode === 'hr') { const rq = S.questions.filter(q => q.tier === 0 && /motivation|introduction|behavioral/i.test(q.topic)).map(q => ({ qid: q.id })); return [{ text: 'Tell me about yourself.' }].concat(shuffle(rq), shuffle(HR_PROMPTS).map(t => ({ text: t }))).slice(0, n); }
  if (mode === 'architect') return take(studiedFirst(pool.filter(q => q.category === 'Architecture')), n);
  if (mode === 'weak') { const ids = [...new Set(weekProblems().flatMap(p => p.ids || []))]; const w = ids.map(qById).filter(Boolean); return take(w.length ? w : S.questions.filter(q => mastery(q) === 'weak' || q.realGap), n); }
  return take(studiedFirst(pool).concat(newPool(jobFocusKeys())).filter((q, i, a) => a.indexOf(q) === i), n);
}

  backupLater: () => { S.meta.backupSnooze = addDays(today(), 3); save(); render(); },

async function download(name, text, type) {
  try { const dl = window.claude && window.claude.use ? await claude.use('downloads') : null; if (dl) { try { await dl.save({ filename: name, data: text }); toast('Saved ' + name); } catch (e) { if (e && e.code !== 'declined') copyText(text, 'Could not save the file here, so it was copied to your clipboard.'); } return; } } catch (e) { }
  let ok = false; try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; document.body.appendChild(a); a.click(); a.remove(); ok = true; } catch (e) { }
  copyText(text, ok ? `Download started. If nothing downloaded, the data was also copied to your clipboard.` : null);
}
function copyText(text, msg) {

  try { navigator.clipboard.writeText(text).then(() => toast(msg || 'Copied to clipboard. Paste it into a file to keep it.'), fallback); } catch (e) { fallback(); }
}

  if (r.fire) {

  if (trimTranscripts()) save();

  try { const g = new URLSearchParams(location.search).get('go'); if (g && S.profile.onboarded) { history.replaceState(null, '', location.pathname); if (g === 'start') ACT.start(); else if (g === 'losing') ACT.losing(); else if (g === 'snooze') ACT.snooze(); } } catch (e) { }
