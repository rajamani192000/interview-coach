remove unused indexes.\n4. Rewrite the query: select only needed columns (no SELECT *), avoid functions on indexed columns (WHERE YEAR(Date)=2025 → date range), EXISTS instead of COUNT/IN on big sets, avoid cursors (set-based), paginate with OFFSET/FETCH.\n5. Procedures: SET NOCOUNT ON, handle parameter sniffing (OPTION RECOMPILE / local vars), update statistics.\n6. Application side: fix N+1 in EF (Include or projection), AsNoTracking for reads, caching (IMemoryCache/Redis), batching.\nMention a real example with numbers only if it actually happened in your project.\nInterview line: \"I start with the execution plan, fix the query design, then indexing – before ever scaling hardware.\"","source":"Core priority list","core":true,"tier":1},{"id":"c56","category":"Angular","topic":"Angular Core","difficulty":"Medium","question":"Explain an Angular project structure.","answer":"Root: angular.json (build/serve config, assets, styles), package.json (dependencies, scripts), tsconfig.json (TypeScript options), src/.\nsrc/: main.ts (bootstraps the app: bootstrapApplication(AppComponent, appConfig) or AppModule), index.html (contains <app-root>), styles.scss, environments/ (API URLs per environment), assets/ (images, i18n).\nsrc/app/ (feature-based, what I use):\n• core/ – singletons used once: auth service, HTTP interceptors, guards, layout (header/sidebar).\n• shared/ – reusable components, pipes, directives, models.\n• features/ (or modules/) – orders/, customers/ each with components, services and routes, lazy loaded.\n• app.routes.ts / app-routing.module.ts, app.config.ts / app.module.ts, app.component.*.\nEach component = .ts (logic), .html (template), .scss (styles), .spec.ts (tests). Services talk to the ASP.NET Core API through HttpClient.","source":"Core priority list","core":true,"tier":1},{"id":"c57","category":"Angular","topic":"RxJS","difficulty":"Senior","question":"Which RxJS operators do you use? Explain switchMap vs mergeMap vs concatMap vs exhaustMap.","answer":"Everyday operators: map (transform), filter, tap (side effects/logging), catchError (handle errors), finalize (stop loader), debounceTime + distinctUntilChanged (search box), takeUntil / takeUntilDestroyed (unsubscribe), forkJoin (wait for several HTTP calls), combineLatest (combine latest values), retry.\n\nFlattening operators (inner observable per value):\n• switchMap – cancels the previous inner request when a new value comes. Search-as-you-type, route param changes.\n• mergeMap – runs all in parallel, no cancellation. Independent uploads.\n• concatMap – queues, one after another in order. Sequential saves.\n• exhaustMap – ignores new values while one is running. Prevent double-submit of a login button.\n\nthis.search.valueChanges.pipe(\n  debounceTime(300), distinctUntilChanged(),\n  switchMap(term => this.api.search(term).pipe(catchError(() => of([]))))\n).subscribe(r => this.results = r);","source":"Core priority list","core":true,"tier":1},{"id":"c58","category":"Angular","topic":"RxJS","difficulty":"Medium","question":"Subject vs BehaviorSubject vs ReplaySubject? How do you share data between components with them?","answer":"• Subject – multicast; subscribers only get values emitted AFTER they subscribe; no initial value.\n• BehaviorSubject – needs an initial value and always gives the LATEST value to new subscribers (getValue()). Best for state such as the current user or cart.\n• ReplaySubject(n) – replays the last n values to new subscribers.\n• AsyncSubject – emits only the last value on complete.\n\nShared service pattern:\n@Injectable({ providedIn: 'root' })\nexport class CartService {\n  private cart = new BehaviorSubject<Item[]>([]);\n  cart$ = this.cart.asObservable();          // expose read-only\n  add(i: Item) { this.cart.next([...this.cart.value, i]); }\n}\nComponents subscribe to cart$ (or use the async pipe). In newer Angular, signals (signal(), computed()) are an alternative for synchronous UI state.","source":"Core priority list","core":true,"tier":1},{"id":"c59","category":"Angular","topic":"Angular Core","difficulty":"Medium","question":"Lazy loading vs eager loading in Angular?","answer":"Eager loading – modules/components are bundled into the main bundle and loaded at startup. Fine for small apps and things needed immediately (layout, login).\nLazy loading – a feature's code is split into a separate chunk and downloaded only when its route is visited → smaller initial bundle, faster first load.\n\n// standalone\n{ path: 'orders', loadComponent: () => import('./features/orders/orders.component').then(m => m.OrdersComponent) },\n{ path: 'admin', loadChildren: () => import('./features/admin/admin.routes').then(m => m.ADMIN_ROUTES), canMatch: [adminGuard] }\n// module based\n{ path: 'orders', loadChildren: () => import('./orders/orders.module').then(m => m.OrdersModule) }\n\nPreloading: withPreloading(PreloadAllModules) loads lazy chunks in the background after startup. Also @defer blocks (Angular 17+) lazy-load parts of a template.\nTrade-off: first navigation to a lazy route has a small delay; don't lazy-load tiny features.","source":"Core priority list","core":true,"tier":1},{"id":"c60","category":"Angular","topic":"Angular Core","difficulty":"Medium","question":"What are Angular lifecycle hooks? Explain their order and when you use each.","answer":"Order:\n1. constructor – class created; inject dependencies only (inputs not set yet).\n2. ngOnChanges(changes) – whenever an @Input reference changes (first time before ngOnInit). SimpleChanges gives previous/current values.\n3. ngOnInit – once, after first ngOnChanges. Load data, set up subscriptions – most used.\n4. ngDoCheck – every change detection run; custom change detection (use carefully).\n5. ngAfterContentInit / ngAfterContentChecked – after projected content (<ng-content>) is initialised/checked; @ContentChild available.\n6. ngAfterViewInit / ngAfterViewChecked – after the component's view and child views are ready; @ViewChild available (e.g. focus an input, init a chart).\n7. ngOnDestroy – cleanup: unsubscribe, clear timers, detach listeners.\nInterview tip: constructor for DI, ngOnInit for initialisation logic, ngOnDestroy (or takeUntilDestroyed / async pipe) to prevent memory leaks.\nInterview line: \"The constructor is for dependency injection; ngOnInit is for initialisation – inputs are available there.\"","source":"Core priority list","core":true,"tier":1},{"id":"c61","category":"Angular","topic":"Angular Core","difficulty":"Senior","question":"Explain change detection in Angular: Default vs OnPush.","answer":"Change detection checks component bindings and updates the DOM when data changes. Zone.js patches async events (clicks, HTTP, timers) and triggers a check from the root down.\n\nDefault strategy – every component is checked on every change detection cycle. Simple but can be slow for large trees.\nOnPush – component is checked only when:\n• an @Input reference changes (not mutation),\n• an event fires inside the component or its children,\n• an async pipe emits / a signal it reads changes,\n• you call markForCheck().\n\n@Component({ changeDetection: ChangeDetectionStrategy.OnPush, ... })\nUse immutable updates with OnPush: this.items = [...this.items, newItem] instead of push().\nTools: ChangeDetectorRef.markForCheck(), detectChanges(); trackBy / track in lists to avoid re-rendering. Newer Angular: signals enable fine-grained updates and zoneless change detection.\nBenefit: big performance gains for large lists/dashboards. Trade-off: mutation bugs if the team isn't disciplined about immutability.","source":"Core priority list","core":true,"tier":1},{"id":"c62","category":"Angular","topic":"RxJS","difficulty":"Easy","question":"Observables vs Promises?","answer":"• Values: Promise resolves ONE value; Observable can emit MANY values over time (streams: websocket, form changes).\n• Execution: Promise is eager (starts immediately); Observable is lazy (starts on subscribe).\n• Cancellation: Promise can't be cancelled; Observable can be unsubscribed (switchMap cancels old HTTP calls).\n• Operators: Observable has RxJS operators (map, filter, retry, debounceTime); Promise only then/catch/finally.\n• Multicast: Promises share the result; cold Observables re-execute per subscriber (use shareReplay to share).\nAngular HttpClient returns Observables. Convert when needed: firstValueFrom(obs$) for async/await code; from(promise) to go the other way.","source":"Core priority list","core":true,"tier":1},{"id":"c63","category":"Angular","topic":"Implementation","difficulty":"Medium","question":"How do you create a service and consume a Web API with HttpClient (with error handling and an interceptor)?","answer":"1. Provide HttpClient: provideHttpClient(withInterceptors([authInterceptor])) in app.config.ts (or HttpClientModule in AppModule).\n2. Service:\n@Injectable({ providedIn: 'root' })\nexport class OrderService {\n  private http = inject(HttpClient);\n  private base = `${environment.apiUrl}/orders`;\n  getAll(): Observable<Order[]> {\n    return this.http.get<Order[]>(this.base).pipe(retry(1), catchError(this.handle));\n  }\n  create(o: CreateOrder) { return this.http.post<Order>(this.base, o); }\n  private handle(err: HttpErrorResponse) { return throwError(() => new Error(err.error?.message ?? 'Server error')); }\n}\n3. Component: orders$ = this.orderService.getAll();  and in the template: @for (o of orders$ | async; track o.id) { ... }\n4. Interceptor adds the JWT for every request:\nexport const authInterceptor: HttpInterceptorFn = (req, next) => {\n  const token = inject(AuthService).token();\n  return next(token ? req.clone({ setHeaders: { Authorization: `Bearer ${token}` } }) : req);\n};\nAlso handle 401 in the interceptor (redirect to login / refresh token). The API must enable CORS for the Angular origin.","source":"Core priority list","core":true,"tier":1},{"id":"c64","category":"Angular","topic":"Implementation","difficulty":"Medium","question":"NgModules vs standalone components – what's the difference?","answer":"NgModule (@NgModule) groups declarations (components, directives, pipes), imports other modules, provides services and bootstraps the root component. Every component had to be declared in exactly one module.\n\nStandalone components (default since Angular 17): standalone: true, each component imports what it needs directly:\n@Component({ selector: 'app-orders', standalone: true, imports: [CommonModule, RouterLink, OrderCardComponent], templateUrl: '...' })\nBootstrap with bootstrapApplication(AppComponent, { providers: [provideRouter(routes), provideHttpClient()] }).\n\nBenefits of standalone: less boilerplate, clearer dependencies, easier lazy loading per component (loadComponent), better tree-shaking. Modules still work and are common in older projects – be ready to explain both and how you'd migrate (ng generate @angular/core:standalone).","source":"Core priority list","core":true,"tier":1},{"id":"c65","category":"Angular","topic":"Implementation","difficulty":"Medium","question":"What are directives? Explain component, structural and attribute directives and write a custom directive.","answer":"• Component – directive with a template (@Component).\n• Structural – change the DOM layout by adding/removing elements: *ngIf, *ngFor, *ngSwitch (new control flow: @if, @for, @switch).\n• Attribute – change the appearance/behaviour of an existing element: ngClass, ngStyle, ngModel.\n\nCustom attribute directive:\n@Directive({ selector: '[appHighlight]', standalone: true })\nexport class HighlightDirective {\n  @Input() appHighlight = 'yellow';\n  constructor(private el: ElementRef) {}\n  @HostListener('mouseenter') on() { this.el.nativeElement.style.backgroundColor = this.appHighlight; }\n  @HostListener('mouseleave') off() { this.el.nativeElement.style.backgroundColor = ''; }\n}\n<p appHighlight=\"lightblue\">Hover me<\/p>\nReal examples: permission directive (*appHasRole=\"'Admin'\") that hides buttons, auto-focus directive, number-only input directive.","source":"Core priority list","core":true,"tier":1},{"id":"c66","category":"Angular","topic":"Data Binding","difficulty":"Easy","question":"What are the types of data binding in Angular? How does two-way binding work?","answer":"1. Interpolation (component → view): {{ user.name }}\n2. Property binding (component → view): [disabled]=\"isSaving\"  [src]=\"imageUrl\"\n3. Event binding (view → component): (click)=\"save()\"  (input)=\"onType($event)\"\n4. Two-way binding: [(ngModel)]=\"user.name\"  (needs FormsModule)\n\nTwo-way binding = property binding + event binding together (\"banana in a box\"):\n[(ngModel)]=\"name\"  is short for  [ngModel]=\"name\" (ngModelChange)=\"name = $event\"\n\nFor a custom component: @Input() value; @Output() valueChange = new EventEmitter(); then <app-counter [(value)]=\"count\">. Angular 17.2+: value = model<number>(0).\nAlso attribute/class/style binding: [attr.aria-label], [class.active]=\"isActive\", [style.width.px]=\"w\".","source":"Core priority list","core":true,"tier":1},{"id":"p01","category":".NET","topic":".NET Core Platform","difficulty":"Easy","question":"What are the key features of .NET Core? Why choose it over .NET Framework?","answer":".NET Core (now just \".NET 5/6/8+\") is the cross-platform, open-source, high-performance version of .NET.\n• Cross-platform – runs on Windows, Linux and macOS, so we can host on Linux containers or Azure App Service.\n• High performance – Kestrel and runtime optimisations make it much faster than .NET Framework.\n• Built-in dependency injection – DI container out of the box, which pushes clean architecture.\n• Modular – NuGet package-based, smaller footprint, side-by-side versions per app.\n• CLI tooling – dotnet new / build / test / publish for automation and CI/CD.\n• Cloud ready – container-friendly, works well with Docker and Kubernetes, config from environment variables.\n• Unified config, logging, middleware pipeline and minimal APIs.\n.NET Framework is Windows-only and in maintenance mode; use it only for legacy apps (WebForms, WCF server).\nInterview line: \".NET Core is designed for modern, scalable, cloud-native systems.\"","source":"Priority list (zip)","core":true,"tier":2},{"id":"p02","category":".NET","topic":"C# Deep Dive","difficulty":"Medium","question":"Static class vs Singleton class – what does static give you, and what doesn't it give you?","answer":"Static class: type-level global state; one shared copy; very easy to write. But it CANNOT be instantiated, inherited or implement interfaces, so:\n• No inheritance and no polymorphism – can't hide it behind an interface, can't mock it in unit tests, can't inject it via DI.\n• Everything must be static – rigid, non-OOP design.\n• Static alone does NOT give lazy loading (static constructor runs on first touch of the type), thread safety for mutable state, encapsulation of the shared object, or safe iteration.\n\nProper Singleton: a normal class with a private constructor and a controlled static accessor:\npublic sealed class CountryCache {\n  private static readonly Lazy<CountryCache> _inst = new(() => new CountryCache());   // lazy + thread-safe\n  public static CountryCache Instance => _inst.Value;\n  private readonly List<Country> _items;                  // encapsulated, private\n  private CountryCache() => _items = LoadFromDb();\n  public IEnumerable<Country> Items => _items;           // read-only exposure (safe iteration)\n}\nIt can implement an interface (ICountryCache), be registered with AddSingleton and mocked in tests.\nUse static class for stateless helpers (MathHelper, extension methods). Use a singleton (preferably via DI AddSingleton) for shared state: reference-data cache, hit counters, logger.\nKey takeaway: global state in multithreaded apps needs protection – lock or Lazy<T>, and expose read access, not write access.","source":"Priority list (zip)","core":true,"tier":2},{"id":"p03","category":".NET","topic":"C# Deep Dive","difficulty":"Medium","question":"Tricky follow-up: can the contents of a readonly List be modified?","answer":"public readonly List<string> _productNames = new();\nYes. readonly protects the REFERENCE, not the STATE of the object.\n✗ Not allowed: _productNames = new List<string>();   // compile error – reassigning the reference\n✓ Allowed:    _productNames.Add(\"New Product\");  _productNames.Clear();   // changing contents is fine\n\nreadonly locks where the variable points, not what the object contains.\nFor real immutability:\n• Expose IReadOnlyList<T> / IEnumerable<T> instead of List<T>.\n• Use ImmutableList<T> (System.Collections.Immutable) or list.AsReadOnly().\n• For your own types: records, init-only properties, no setters.\nSame rule applies to a readonly field of any reference type, e.g. a readonly Dictionary.","source":"Priority list (zip)","core":true,"tier":2},{"id":"p04","category":".NET","topic":"C# Deep Dive","difficulty":"Medium","question":"What is boxing and unboxing in C#? What happens in memory, and why does it matter?","answer":"Boxing: converting a value type (int, struct) to object (or an interface it implements). The CLR allocates a NEW object on the heap and COPIES the value into it. Implicit.\nUnboxing: extracting the value back from the heap object into a value-type variable. Needs an explicit cast; the type must match exactly or you get InvalidCastException.\n\nint x = 10;          // stack: x = 10\nobject obj = x;      // boxing: heap object [10], original x unchanged\nint y = (int)obj;    // unboxing: value copied back → y = 10\nlong z = (long)obj;  // InvalidCastException (boxed int, not long)\n\nWhy it matters: each box is a heap allocation + copy, extra CPU and GC pressure. It happens silently with ArrayList/Hashtable, string.Format with value types, calling interface methods on structs, object parameters.\nAvoid it in hot paths by using generics (List<int> instead of ArrayList, Dictionary<TKey,TValue>) and generic methods.\nInterview line: \"Boxing copies stack → heap, unboxing copies heap → stack; generics avoid both.\"","source":"Priority list (zip)","core":true,"tier":2},{"id":"p05","category":".NET","topic":"C# Deep Dive","difficulty":"Medium","question":"Output question: object a = 10; object b = 10; Console.WriteLine(a == b); What prints and why?","answer":"Output: False\n\nWhy:\n• Each assignment boxes the int into a SEPARATE heap object.\n• For object references, == compares reference equality (same memory address), not values.\n• Two different boxes → different references → False.\n\nCorrect ways to compare the values:\nConsole.WriteLine(a.Equals(b));            // True – Int32.Equals compares values\nConsole.WriteLine((int)a == (int)b);       // True\nConsole.WriteLine(object.Equals(a, b));    // True\nFollow-up: string is different – == is overloaded on string to compare values, and literals are interned.","source":"Priority list (zip)","core":true,"tier":2},{"id":"p06","category":".NET","topic":"C# Deep Dive","difficulty":"Medium","question":"Where are class members stored in memory? (value-type field inside a class) – and value types vs reference types.","answer":"public class A { public int _orderId; public Order _order = new Order(); }\nvar a = new A();\n\n• The whole A object is allocated on the managed HEAP.\n• _orderId is a value type but it lives INSIDE the A object on the heap (not on the stack).\n• _order is a reference stored inside A; the Order object it points to is a SEPARATE heap allocation.\n• Only the local variable a (the reference) is on the stack.\n\nRule: class instance fields always live on the heap, whether they're value or reference types. Only LOCAL value-type variables (and parameters) are stack-allocated (unless captured by a lambda/async method, which moves them to the heap too).\n\nValue vs reference types: value types (int, bool, struct, enum, DateTime) hold the data and copy on assignment; reference types (class, string, arrays, delegates) hold a reference, and assignment copies the reference so both variables see changes. Heap memory is cleaned by the GC.","source":"Priority list (zip)","core":true,"tier":2},{"id":"p07","category":".NET","topic":"C# Deep Dive","difficulty":"Medium","question":"What are init-only setters, records and primary constructors in modern C#?","answer":"init-only setters (C# 9): property can be set only during object creation (constructor or object initializer), then it's immutable.\npublic class Order { public int Id { get; init; } public decimal Amount { get; init; } }\nvar o = new Order { Id = 1, Amount = 500 };   // ok\no.Amount = 600;                                // compile error\n\nrecords (C# 9): reference types with value-based equality, built-in ToString, deconstruction and non-destructive copy with \"with\".\npublic record OrderDto(int Id, decimal Amount);\nvar b = a with { Amount = 700 };   // copy with one change\nGreat for DTOs, API contracts, value objects, events.\n\nPrimary constructors (C# 12) on classes: parameters declared on the class itself, usable throughout the body – very handy for DI.\npublic class OrderService(IOrderRepository repo, ILogger<OrderService> log) {\n  public Task<Order?> Get(int id) => repo.GetAsync(id);\n}\nTrade-off: primary-constructor parameters are not readonly fields by default; assign to a readonly field if you need that guarantee.","source":"Priority list (zip)","core":true,"tier":2},{"id":"p08","category":".NET","topic":"C# Deep Dive","difficulty":"Easy","question":"Is var strongly typed? What is the difference between var and dynamic?","answer":"Yes. var is resolved at COMPILE time – the compiler infers the type from the right-hand side and the variable keeps that type forever.\nvar x = 10;        // x is System.Int32\nx = \"Vineeth\";     // compile error: cannot convert string to int\nvar must be initialised on declaration and can only be used for local variables.\n\ndynamic skips compile-time checks; members are resolved at RUNTIME, so mistakes appear as RuntimeBinderException.\ndynamic d = 10;  d = \"text\";  d.AnyMethod();   // compiles, fails at runtime if missing\n\nUse var for readability when the type is obvious (var orders = new List<Order>()); use dynamic rarely – COM interop, dynamic JSON, reflection-heavy code.","source":"Priority list (zip)","core":true,"tier":2},{"id":"p09","category":".NET","topic":"EF Core","difficulty":"Medium","question":"EF Core: eager vs lazy vs explicit loading, and what is the N+1 query problem?","answer":"• Eager loading – load related data in the same query with Include/ThenInclude (SQL JOIN).\n  var emps = await db.Employees.Include(e => e.Department).ToListAsync();\n• Lazy loading – related data loads automatically the first time you touch the navigation property (needs proxies + virtual navigations). Convenient but hidden queries.\n• Explicit loading – load on demand yourself: await db.Entry(emp).Reference(e => e.Department).LoadAsync();\n\nN+1 problem: 1 query loads N employees, then accessing emp.Department inside a loop fires 1 more query PER employee → N+1 round trips. Usually caused by lazy loading or missing Include.\nFix: Include, or better a projection that fetches only needed columns in one query:\n  await db.Employees.Select(e => new { e.Name, Dept = e.Department.Name }).ToListAsync();\nFor large Includes with collections use AsSplitQuery() to avoid a cartesian explosion. Detect N+1 by enabling EF Core SQL logging and watching for repeated identical queries.","source":"Priority list (zip)","core":true,"tier":2},{"id":"p10","category":".NET","topic":"EF Core","difficulty":"Medium","question":"Tracking vs AsNoTracking() in EF Core?","answer":"By default EF Core TRACKS entities it loads: it keeps a snapshot in the change tracker so SaveChanges can detect and save modifications.\nAsNoTracking() returns entities without tracking: less memory, less CPU, faster reads.\nvar list = await db.Orders.AsNoTracking().Where(o => o.Status == \"Open\").ToListAsync();\n\nUse AsNoTracking for read-only queries (GET APIs, reports, dropdowns). Use tracking when you will update the entities in the same DbContext.\nCatches: no-tracking results aren't saved by SaveChanges (you'd have to Attach/Update); without identity resolution the same row can appear as two objects – use AsNoTrackingWithIdentityResolution() if needed. You can set it globally with UseQueryTrackingBehavior(QueryTrackingBehavior.NoTracking). Projections to DTOs are never tracked.","source":"Priority list (zip)","core":true,"tier":2},{"id":"p11","category":".NET","topic":"EF Core","difficulty":"Easy","question":"DbContext vs DbSet – and what lifetime should DbContext have?","answer":"DbContext – the session with the database: manages the connection, change tracking, transactions and SaveChanges(). One unit of work.\nDbSet<T> – a typed collection representing a table; you query it with LINQ and Add/Remove entities through it.\npublic class AppDbContext(DbContextOptions<AppDbContext> o) : DbContext(o) {\n  public DbSet<Employee> Employees => Set<Employee>();\n  public DbSet<Department> Departments => Set<Department>();\n}\nbuilder.Services.AddDbContext<AppDbContext>(o => o.UseSqlServer(cs));   // registered as Scoped\n\nLifetime: Scoped (one per HTTP request). DbContext is NOT thread-safe, so never make it Singleton and never run two queries on the same context in parallel. For background services create a scope (IServiceScopeFactory) or use IDbContextFactory. AddDbContextPool reuses instances for performance.","source":"Priority list (zip)","core":true,"tier":2},{"id":"p12","category":".NET","topic":"EF Core","difficulty":"Senior","question":"An EF Core query is slow. How do you optimize it?","answer":"1. Look at the generated SQL (logging / ToQueryString()) and its execution plan.\n2. Fetch less: project with Select to DTOs instead of loading full entities; filter and paginate in the database (IQueryable, Skip/Take) before ToListAsync.\n3. Fix N+1: Include or projection; AsSplitQuery() for multiple collection Includes (avoids cartesian explosion).\n4. AsNoTracking for read-only queries.\n5. Make sure WHERE/JOIN/ORDER BY columns and foreign keys are indexed (EF creates FK indexes by default in migrations; check existing DBs).\n6. Avoid client-side evaluation and functions on columns in WHERE; avoid loading then filtering in memory.\n7. Bulk operations: ExecuteUpdateAsync / ExecuteDeleteAsync (EF 7+) instead of loading rows one by one.\n8. Hot queries: compiled queries, caching (IMemoryCache/Redis), or raw SQL/Dapper for heavy reports.","source":"Priority list (zip)","core":true,"tier":2},{"id":"p13","category":".NET","topic":"Middleware","difficulty":"Medium","question":"Middleware vs Filters in ASP.NET Core?","answer":"Middleware\n• Runs for EVERY HTTP request in the global pipeline (Program.cs), before routing picks an action.\n• Works only with HttpContext; doesn't know about controllers, actions or model binding.\n• Use for cross-cutting HTTP concerns: exception handling, logging, CORS, authentication, compression, rate limiting, correlation IDs.\n\nFilters\n• Run inside the MVC/endpoint layer, around a specific action (authorization, resource, action, exception, result filters).\n• Have access to ActionContext: action arguments, ModelState, the result.\n• Can be applied globally, per controller or per action via attributes.\n• Use for action-specific concerns: validation, auditing, per-action caching, transforming results.\n\nRule: if it applies to all requests (including static files and non-MVC endpoints) → middleware. If it needs action context or should apply to some actions → filter.","source":"Priority list (zip)","core":true,"tier":2},{"id":"p14","category":"Architecture","topic":"Architecture","difficulty":"Medium","question":"Monolithic vs Microservices architecture – which would you choose?","answer":"Monolith: one deployable unit.\n+ Simple to build, test, deploy and debug; one database; no network calls between modules.\n– Tight coupling grows over time; must scale the whole app; one bad deployment affects everything.\nBest for small–medium apps, early-stage products, small teams.\n\nMicroservices: independent services, each with its own data, deployed separately.\n+ Independent scaling and deployment; fault isolation; teams own services; can use different tech per service.\n– Operational complexity: service discovery, API gateway, distributed tracing, eventual consistency, network failures, more DevOps.\nBest for large systems, distributed teams, parts with very different scale.\n\nMy default: start with a well-structured modular monolith (clean module boundaries), extract a service only when a real need appears (scaling, team ownership, release independence).\nInterview line: \"Architecture choice depends on scale, domain complexity and team maturity.\"","source":"Priority list (zip)","core":true,"tier":2},{"id":"p15","category":"Architecture","topic":"Architecture","difficulty":"Senior","question":"How do microservices communicate? Explain sync vs async, API gateway and resilience patterns.","answer":"Synchronous\n• REST over HTTP – simple, widely supported (HttpClient via IHttpClientFactory).\n• gRPC – binary Protocol Buffers over HTTP/2, fast, strongly typed; good for internal service-to-service.\nAsynchronous\n• Message queues (RabbitMQ, Azure Service Bus) – decouple services with reliable delivery.\n• Event-driven publish/subscribe (Kafka, Service Bus topics) – \"OrderPlaced\" event consumed by inventory, email, billing.\nAPI Gateway (Ocelot, YARP, Azure API Management): single entry point for clients – routing, authentication, rate limiting, aggregation.\nResilience (Polly / Microsoft.Extensions.Http.Resilience):\n• Retry with exponential backoff for transient failures.\n• Circuit breaker to stop calling a failing service and prevent cascading failures.\n• Timeouts, fallback, bulkhead.\nAlso: idempotent consumers, outbox pattern for reliable events, correlation IDs for tracing.\nInterview line: \"Asynchronous communication improves resilience and loose coupling.\"","source":"Priority list (zip)","core":true,"tier":2},{"id":"p16","category":".NET","topic":"LINQ & Data Access","difficulty":"Easy","question":"First vs FirstOrDefault vs Single vs SingleOrDefault?","answer":"• First() – returns the first match; THROWS if there are none. Extra matches are fine.\n• FirstOrDefault() – first match or default (null / 0) if none. Never throws for \"no match\".\n• Single() – expects EXACTLY one match; throws if zero OR more than one.\n• SingleOrDefault() – zero or one; returns default if none, throws if more than one.\n\nWhen to use: Single/SingleOrDefault when the data must be unique (lookup by primary key or unique email) – it catches data bugs. First/FirstOrDefault when you just want the first item (latest order after OrderByDescending).\nPerformance: Single must check for a second match (SQL uses TOP 2), First stops at one (TOP 1). For primary-key lookups in EF Core, FindAsync also checks the change tracker first.","source":"Priority list (zip)","core":true,"tier":2},{"id":"p17","category":".NET","topic":"LINQ & Data Access","difficulty":"Easy","question":"Select vs SelectMany in LINQ?","answer":"Select – one-to-one projection: each element maps to one result. Selecting a collection gives a collection of collections.\nSelectMany – projects each element to a sequence and FLATTENS all of them into one sequence.\n\nvar depts = new[] { new Dept(\"IT\", new[]{\"Amit\",\"Rohit\"}), new Dept(\"HR\", new[]{\"Priya\"}) };\nvar a = depts.Select(d => d.Employees);       // IEnumerable<string[]> → [[\"Amit\",\"Rohit\"],[\"Priya\"]]\nvar b = depts.SelectMany(d => d.Employees);   // IEnumerable<string>   → [\"Amit\",\"Rohit\",\"Priya\"]\n\nReal use: all order lines across orders (orders.SelectMany(o => o.Lines)), all roles of all users, flattening nested JSON. In EF Core SelectMany over a navigation becomes a JOIN.","source":"Priority list (zip)","core":true,"tier":2},{"id":"p18","category":".NET","topic":"LINQ & Data Access","difficulty":"Easy","question":"Where vs Any, and ToList() vs ToArray() vs ToHashSet()?","answer":"Where – filters and returns ALL matching elements (deferred).\nAny – returns bool; SHORT-CIRCUITS at the first match. Use it for existence checks:\n  if (orders.Any(o => o.Status == \"Pending\"))   ✓  (SQL: EXISTS)\n  if (orders.Where(o => ...).Count() > 0)       ✗  counts everything\nAlso All(predicate) short-circuits on the first failure.\n\nMaterialising:\n• ToList() – List<T>, resizable; most common; good when you'll add/remove or index.\n• ToArray() – fixed-size array; slightly less overhead once built; good for read-only fixed results.\n• ToHashSet() – unique elements with O(1) Contains lookups; use when you'll check membership repeatedly.\nAll three execute the query immediately (end deferred execution). Materialise once and reuse instead of enumerating the same query repeatedly.","source":"Priority list (zip)","core":true,"tier":2},{"id":"p19","category":"Coding","topic":"LINQ Coding","difficulty":"Medium","question":"LINQ: find the highest salary per department, and the highest-paid employee in each department.","answer":"// highest salary value per department\nvar maxByDept = employees\n  .GroupBy(e => e.Department)\n  .Select(g => new { Department = g.Key, MaxSalary = g.Max(e => e.Salary) });\n\n// the employee with the highest salary in each department\nvar topEmp = employees\n  .GroupBy(e => e.Department)\n  .Select(g => g.OrderByDescending(e => e.Salary).First());\n// .NET 6+: .Select(g => g.MaxBy(e => e.Salary))\n\nSample data → IT: Rohit 150,000; HR: Pooja 85,000; Payroll: Sneha 95,000.\nExplain: GroupBy creates IGrouping<key, items>; g.Key is the department. Ties: OrderByDescending(...).ThenBy(e => e.Id) for a stable pick, or return all with salary == max.","source":"Priority list (zip)","core":true,"tier":2},{"id":"p20","category":"Coding","topic":"LINQ Coding","difficulty":"Medium","question":"LINQ: find the second-highest salary.","answer":"var second = employees\n  .Select(e => e.Salary)\n  .Distinct()                       // handle duplicate salaries\n  .OrderByDescending(s => s)\n  .Skip(1)\n  .FirstOrDefault();                // 0 if only one distinct salary\n\nNth highest: .Skip(n - 1).FirstOrDefault().\nEmployees earning the second-highest salary:\nvar names = employees.Where(e => e.Salary == second).Select(e => e.Name);\nSample data: distinct salaries 150k, 120k, 110k, 95k, 85k, 80k → second highest = 120,000 (Amit).\nMention Distinct is what makes it correct with ties, and in EF Core this translates to ORDER BY ... OFFSET 1 ROWS FETCH NEXT 1.","source":"Priority list (zip)","core":true,"tier":2},{"id":"p21","category":"Coding","topic":"LINQ Coding","difficulty":"Medium","question":"LINQ: departments having more than 5 employees, and the average salary of each department.","answer":"var bigDepts = employees\n  .GroupBy(e => e.Department)\n  .Where(g => g.Count() > 5)                       // like SQL HAVING\n  .Select(g => new { Department = g.Key, Count = g.Count() });\n\nvar avgSalary = employees\n  .GroupBy(e => e.Department)\n  .Select(g => new { Department = g.Key, Average = g.Average(e => e.Salary) })\n  .OrderByDescending(x => x.Average);\n\nSample data: IT avg = (120k+150k+110k)/3 = 126,666.67; HR = 82,500; Payroll = 95,000; no department has more than 5 employees in the sample, so the first query returns empty – say that out loud in the interview, it shows you checked.","source":"Priority list (zip)","core":true,"tier":2},{"id":"p22","category":"Coding","topic":"LINQ Coding","difficulty":"Easy","question":"LINQ: sort employees by salary descending and return the top 3.","answer":"var top3 = employees\n  .OrderByDescending(e => e.Salary)\n  .ThenBy(e => e.Name)          // stable tie-break\n  .Take(3)\n  .ToList();\n\nSample result: Rohit 150,000; Amit 120,000; Vikas 110,000.\nQuery syntax: (from e in employees orderby e.Salary descending select e).Take(3).\nIn EF Core this becomes SELECT TOP(3) ... ORDER BY Salary DESC. For \"top 3 distinct salaries\" use .Select(e => e.Salary).Distinct().OrderByDescending(s => s).Take(3).","source":"Priority list (zip)","core":true,"tier":2},{"id":"p23","category":"SQL","topic":"Indexing","difficulty":"Medium","question":"Why should you index foreign keys? How does indexing help JOINs?","answer":"SQL Server automatically creates an index for a PRIMARY KEY (clustered by default) but NOT for a FOREIGN KEY.\nWhen you JOIN Employee.DepartmentId = Department.DepartmentId or filter by DepartmentId, without an index on Employee.DepartmentId the engine must scan the whole Employee table.\nCREATE NONCLUSTERED INDEX IX_Employee_DepartmentId ON Employee(DepartmentId);\nBenefits: index seeks instead of scans in joins; faster WHERE DepartmentId = @id; faster DELETE/UPDATE on the parent table (FK checks look up child rows); fewer locks → less blocking and fewer deadlocks.\nDesign: PK = clustered index (EmployeeId); FK columns = non-clustered indexes; add INCLUDE columns if the join query always reads the same few columns.\nEF Core migrations create FK indexes automatically; hand-written schemas often miss them.","source":"Priority list (zip)","core":true,"tier":2},{"id":"p24","category":"SQL","topic":"Performance","difficulty":"Senior","question":"How do you read an execution plan? Table scan vs index scan vs index seek vs key lookup.","answer":"Get it with \"Include Actual Execution Plan\" (Ctrl+M) in SSMS, read right-to-left, and look at the most expensive operators and at estimated vs actual rows.\n• Table scan – reads every row of a heap (no clustered index). Bad on big tables.\n• Clustered index scan / index scan – reads the whole index. Fine for small tables or when most rows are needed; a red flag for selective queries.\n• Index seek – navigates the B-tree directly to matching rows. What you want for selective WHERE/JOIN.\n• Key lookup – after a non-clustered seek, goes back to the clustered index to fetch columns not in the index. Many lookups are expensive → fix with a covering index (INCLUDE the extra columns).\nAlso watch: big gaps between estimated and actual rows (stale statistics / parameter sniffing), sorts and hash matches spilling to tempdb, implicit conversions (e.g. NVARCHAR vs VARCHAR) that prevent seeks, missing-index hints.\nIndex seek vs index scan: seek touches only matching rows (usually fast); scan touches every row of the index.","source":"Priority list (zip)","core":true,"tier":2},{"id":"p25","category":"SQL","topic":"Performance","difficulty":"Medium","question":"How do you identify whether an index is missing or not being used?","answer":"Missing index:\n• Actual execution plan shows a green \"Missing Index\" hint and scans on selective predicates.\n• DMVs: sys.dm_db_missing_index_details / _groups / _group_stats (equality, inequality, included columns, impact).\n• Query Store / Database Engine Tuning Advisor for the workload.\nNot being used:\n• sys.dm_db_index_usage_stats – indexes with zero seeks/scans/lookups but many updates cost writes and give nothing.\n• Plan shows a scan even though an index exists → check for functions on the column (WHERE YEAR(OrderDate)=2025), implicit conversions, leading wildcard LIKE '%abc', wrong column order in a composite index, low selectivity, or stale statistics.\nAction: create/adjust covering indexes, drop unused duplicates, update statistics, rewrite non-SARGable predicates. Don't blindly add every suggested index – each one slows writes.","source":"Priority list (zip)","core":true,"tier":2},{"id":"p26","category":"SQL","topic":"Performance","difficulty":"Senior","question":"What is parameter sniffing and how can it affect stored procedure performance?","answer":"When a procedure runs the first time, SQL Server \"sniffs\" the parameter values and compiles a plan optimised for them, then caches and reuses that plan for later calls.\nProblem: if the first call used an unusual value (e.g. @CustomerId with 10 rows) the cached plan (nested loops + seek) can be terrible for a value with 1 million rows – the same procedure is suddenly slow for some inputs or after a plan recompile.\nSymptoms: SP fast for some parameters and slow for others; fast in SSMS but slow from the app (different SET options → different cached plans).\nFixes:\n• OPTION (RECOMPILE) on the problem statement (fresh plan each run; CPU cost).\n• OPTIMIZE FOR (@p UNKNOWN) or OPTIMIZE FOR a typical value.\n• Copy parameters into local variables (generic plan).\n• Update statistics; split into separate procedures for very different data shapes.\n• SQL Server 2022: Parameter Sensitive Plan optimization; Query Store to force a known good plan.","source":"Priority list (zip)","core":true,"tier":2},{"id":"p27","category":"SQL","topic":"Procedures & Functions","difficulty":"Medium","question":"Nested stored procedure executions – how do they work and what are the best practices?","answer":"A stored procedure can EXEC another (e.g. usp_PlaceOrder calls usp_ReserveStock and usp_CreateInvoice). Nesting is limited to 32 levels (@@NESTLEVEL shows the current level).\nBest practices:\n• Transactions: only the outermost procedure should BEGIN/COMMIT; a ROLLBACK anywhere rolls back everything and sets @@TRANCOUNT to 0. Check IF @@TRANCOUNT = 0 BEGIN TRAN (or use SAVE TRANSACTION for partial rollback).\n• Error handling: TRY/CATCH with THROW in each level so errors bubble up; SET XACT_ABORT ON.\n• Pass data with parameters / table-valued parameters; return with OUTPUT params rather than temp tables shared across levels.\n• Temp tables created in the outer SP are visible to inner SPs – convenient but creates hidden coupling.\n• Keep nesting shallow; deep chains are hard to debug and tune (each has its own plan).","source":"Priority list (zip)","core":true,"tier":2},{"id":"p28","category":"SQL","topic":"Procedures & Functions","difficulty":"Medium","question":"How do you read multiple result sets from a stored procedure in C# (ADO.NET or Dapper)?","answer":"A procedure can return several SELECTs, e.g. order header + order lines in one round trip.\nADO.NET:\nusing var cmd = new SqlCommand(\"usp_GetOrder\", con) { CommandType = CommandType.StoredProcedure };\ncmd.Parameters.AddWithValue(\"@Id\", id);\nusing var reader = await cmd.ExecuteReaderAsync();\nwhile (await reader.ReadAsync()) { /* header */ }\nawait reader.NextResultAsync();                 // move to the second result set\nwhile (await reader.ReadAsync()) { /* lines */ }\n\nDapper:\nusing var multi = await con.QueryMultipleAsync(\"usp_GetOrder\", new { Id = id }, commandType: CommandType.StoredProcedure);\nvar order = await multi.ReadSingleAsync<Order>();\nvar lines = (await multi.ReadAsync<OrderLine>()).ToList();\nRead result sets in the same order the procedure returns them. EF Core doesn't map multiple result sets directly – use the underlying connection or Dapper for this.","source":"Priority list (zip)","core":true,"tier":2},{"id":"p29","category":"SQL","topic":"Procedures & Functions","difficulty":"Senior","question":"Ad-hoc SQL vs stored procedure – is a stored procedure always faster? (plan caching myth)","answer":"Myth: \"SPs are faster because they're precompiled.\" In modern SQL Server both SPs and PARAMETERISED ad-hoc queries (sp_executesql, EF Core, Dapper with parameters) get their plans compiled on first execution and cached for reuse, so performance is usually the same.\nWhat actually matters:\n• Parameterisation – non-parameterised ad-hoc SQL with literals creates a new plan per value (plan-cache bloat) and risks SQL injection.\n• Round trips – an SP can do multi-step logic in one call.\nWhy teams still use SPs: security (grant EXECUTE only), encapsulating complex set-based logic near the data, DBA-tunable without redeploying the app, reuse across apps.\nWhy ORMs/ad-hoc: faster development, logic in versioned C# code, easier unit testing, dynamic filters.\nAnswer: \"Not inherently faster; parameterised queries are cached too. I use SPs for complex data-heavy operations and reporting, EF Core for standard CRUD.\"","source":"Priority list (zip)","core":true,"tier":2},{"id":"p30","category":"SQL","topic":"Troubleshooting","difficulty":"Senior","question":"A stored procedure that normally takes 2 seconds suddenly takes 30 seconds. How would you investigate?","answer":"1. Check it's the SP, not the environment: run it in SSMS with the same parameters, SET STATISTICS IO, TIME ON.\n2. Blocking: is it waiting? sp_WhoIsActive / sys.dm_exec_requests (wait_type, blocking_session_id). A long transaction or deadlock victim retries?\n3. Plan change: compare the current plan with the previous one in Query Store (plan regression). Parameter sniffing is the most common cause of \"suddenly slow\".\n4. Statistics: stale after a big data load → UPDATE STATISTICS; check if row counts grew a lot.\n5. Index changes: dropped/disabled index, fragmentation, new data distribution.\n6. Resource pressure: CPU, memory grants, tempdb spills, I/O latency at that time.\nFix accordingly: force last good plan (Query Store), OPTION(RECOMPILE)/OPTIMIZE FOR, update stats, add a covering index, shorten the blocking transaction. Then add monitoring/alerts so it's caught early.","source":"Priority list (zip)","core":true,"tier":2},{"id":"p31","category":"SQL","topic":"Troubleshooting","difficulty":"Senior","question":"The stored procedure's execution plan looks fine, but the API still takes 5 seconds. How do you troubleshoot?","answer":"The bottleneck is outside the query, so trace the whole request path: Application → API → Database → execution plan → indexes/blocking/CPU/IO.\n1. Measure where time goes: logging with timestamps / Stopwatch, Application Insights / OpenTelemetry distributed tracing, MiniProfiler.\n2. Many DB calls? N+1 queries, calling the SP in a loop, chatty EF lazy loading.\n3. Data size: returning huge result sets, serialization of large object graphs, no pagination, no compression.\n4. Connection issues: connection pool exhaustion (not disposing connections), opening connections per call, network latency to the DB.\n5. Async misuse: .Result/.Wait() causing thread-pool starvation; synchronous I/O.\n6. Other dependencies: external HTTP calls, file I/O, heavy mapping/logging, missing caching.\n7. Infrastructure: cold starts, app pool recycles, CPU/memory limits in production.\nThen fix the specific cause and verify with the same measurement.","source":"Priority list (zip)","core":true,"tier":2},{"id":"p32","category":"SQL","topic":"Troubleshooting","difficulty":"Senior","question":"A query runs in 100 ms in SSMS but takes 5 seconds from the application. What could be the reasons?","answer":"1. Different cached plans due to SET options – SSMS uses SET ARITHABORT ON, ADO.NET uses OFF, so the app gets its own (possibly sniffed, bad) plan. Classic parameter sniffing.\n2. Parameter data types – app sends NVARCHAR for a VARCHAR column → implicit conversion → index scan instead of seek. Fix parameter types (in EF: HasColumnType / IsUnicode(false)).\n3. Different parameter values than the ones you tested.\n4. The app fetches much more data or runs extra queries (N+1), or the time is in network transfer and serialization.\n5. Blocking only at app run time (concurrent transactions).\n6. Connection-level issues: pool exhaustion, opening new connections, remote DB latency.\nHow I'd prove it: capture the app's actual query and parameters (Extended Events / Profiler / EF logging), compare plans in Query Store, then fix (correct parameter types, OPTION(RECOMPILE)/OPTIMIZE FOR, index).","source":"Priority list (zip)","core":true,"tier":2},{"id":"p33","category":"Coding","topic":"SQL Coding","difficulty":"Medium","question":"SQL: find employees whose salary is higher than their manager's.","answer":"Self-join the Employee table (ManagerId references EmployeeId):\nSELECT e.EmployeeId, e.Name, e.Salary, m.Name AS ManagerName, m.Salary AS ManagerSalary\nFROM Employee e\nINNER JOIN Employee m ON e.ManagerId = m.EmployeeId\nWHERE e.Salary > m.Salary;\n\nExplain: e = employee row, m = the manager row for the same table; INNER JOIN excludes the top boss (NULL ManagerId). Index ManagerId to make the join a seek.","source":"Priority list (zip)","core":true,"tier":2},{"id":"p34","category":"Coding","topic":"SQL Coding","difficulty":"Medium","question":"SQL: find the top 2 highest-paid employees from each department.","answer":"WITH Ranked AS (\n  SELECT EmployeeId, Name, DepartmentId, Salary,\n         DENSE_RANK() OVER (PARTITION BY DepartmentId ORDER BY Salary DESC) AS Rnk\n  FROM Employee\n)\nSELECT EmployeeId, Name, DepartmentId, Salary\nFROM Ranked\nWHERE Rnk <= 2\nORDER BY DepartmentId, Salary DESC;\n\nPARTITION BY restarts the ranking per department. Use ROW_NUMBER() if you need exactly 2 rows even with ties, DENSE_RANK() to include everyone tied at the top two salaries. Mention that this pattern (window function + CTE) solves every \"top N per group\" question.","source":"Priority list (zip)","core":true,"tier":2},{"id":"p35","category":"Coding","topic":"SQL Coding","difficulty":"Easy","question":"SQL: find employees who do not belong to any department.","answer":"If DepartmentId is NULL or points to a department that doesn't exist:\nSELECT e.EmployeeId, e.Name\nFROM Employee e\nLEFT JOIN Department d ON e.DepartmentId = d.DepartmentId\nWHERE d.DepartmentId IS NULL;\n\nAlternative:\nSELECT EmployeeId, Name FROM Employee e\nWHERE NOT EXISTS (SELECT 1 FROM Department d WHERE d.DepartmentId = e.DepartmentId);\nAvoid NOT IN when the subquery column can contain NULL (NOT IN then returns no rows). Opposite question – departments with no employees: Department LEFT JOIN Employee ... WHERE e.EmployeeId IS NULL.","source":"Priority list (zip)","core":true,"tier":2},{"id":"p36","category":"Architecture","topic":"Real-time Scenarios","difficulty":"Senior","question":"An API returns 100,000 employee records and takes 8 seconds. How would you optimize it?","answer":"1. Question the requirement: no UI needs 100k rows at once → server-side pagination (page/pageSize or keyset/cursor pagination), filtering and sorting in the database.\n2. Return only needed fields: project to a slim DTO with Select, not full entities with navigation properties.\n3. Query: AsNoTracking, proper indexes on filter/sort columns, check the execution plan.\n4. Transfer: response compression (Brotli/Gzip), avoid serializing large object graphs.\n5. Large exports: stream the result (IAsyncEnumerable) or generate the file asynchronously in a background job and give a download link.\n6. Cache stable data (IMemoryCache/Redis/output caching) with sensible invalidation.\n7. Front end: virtual scrolling / infinite scroll in Angular with paged API calls.\nMeasure before and after (e.g. with Application Insights) and mention the result only if you actually did it.","source":"Priority list (zip)","core":true,"tier":2},{"id":"p37","category":"Architecture","topic":"Real-time Scenarios","difficulty":"Senior","question":"An API works fast locally but is slow in production. How would you investigate?","answer":"Differences between local and production are the suspects:\n1. Data volume – production has millions of rows; missing indexes or scans that don't show locally. Check execution plans with production-like data.\n2. Network – DB/app in different regions, latency per round trip × chatty calls (N+1).\n3. Configuration – Debug vs Release, logging level too verbose (e.g. logging every SQL), missing caching, different connection strings/pool size.\n4. Concurrency – real traffic: thread-pool starvation from sync-over-async, connection pool exhaustion, blocking/locks in the DB.\n5. Resources – CPU/memory limits of the container/App Service plan, cold starts, GC pressure.\n6. External dependencies – third-party APIs, auth provider, file storage slower in prod.\nTools: Application Insights / OpenTelemetry traces, structured logs with timings and correlation IDs, SQL Query Store, dotnet-counters/dotnet-trace. Find where the time goes, fix that, verify.","source":"Priority list (zip)","core":true,"tier":2},{"id":"p38","category":"Architecture","topic":"Real-time Scenarios","difficulty":"Senior","question":"Your database contains duplicate customer records. How would you identify, clean and prevent future duplicates?","answer":"Identify:\nSELECT Email, COUNT(*) FROM Customer GROUP BY Email HAVING COUNT(*) > 1;\n(Use normalised keys – LOWER(TRIM(Email)), phone digits only – and fuzzy matching on names if needed.)\nClean (keep the oldest/most complete row, re-point child records first):\nWITH d AS (SELECT *, ROW_NUMBER() OVER (PARTITION BY LOWER(Email) ORDER BY CreatedOn) rn FROM Customer)\n-- 1. UPDATE Orders SET CustomerId = <kept id> for duplicates\n-- 2. DELETE FROM d WHERE rn > 1;   (in a transaction, after a backup)\nPrevent:\n• UNIQUE constraint / unique index on the business key (Email), filtered index if nullable.\n• Validate in the API (check before insert) and handle the unique-violation error gracefully (409 Conflict).\n• Idempotency keys for create requests so retries don't insert twice; debounce/disable double-submit in Angular.","source":"Priority list (zip)","core":true,"tier":2},{"id":"p39","category":"Architecture","topic":"Real-time Scenarios","difficulty":"Senior","question":"Your API is receiving 1,000 requests per second. How would you make the application scalable?","answer":"1. Stateless API + horizontal scaling behind a load balancer (multiple instances / Kubernetes / App Service scale-out); no in-memory session – use JWT or a distributed store.\n2. Async all the way to free threads during I/O; avoid blocking calls.\n3. Caching: in-memory for hot reference data, Redis for shared cache, output/response caching for GETs, CDN for static files.\n4. Database: indexes, efficient queries, connection pooling, read replicas for reads, CQRS for heavy read paths, avoid long transactions.\n5. Offload slow work to queues + background workers (emails, reports).\n6. Protect the system: rate limiting (built-in RateLimiter middleware), timeouts, retries with circuit breakers.\n7. Measure: load testing (k6/JMeter), monitoring with Application Insights; scale on metrics (CPU, queue length).\nInterview line: \"Scale horizontally with stateless services, cache aggressively, and move slow work off the request path.\"","source":"Priority list (zip)","core":true,"tier":2},{"id":"p40","category":"Architecture","topic":"Real-time Scenarios","difficulty":"Senior","question":"A production API suddenly starts returning HTTP 500 errors. What steps would you follow?","answer":"1. Assess impact: which endpoints, how many users, since when (dashboards/alerts).\n2. Check what changed: recent deployment, config/secret change, certificate expiry, DB migration, dependency outage. If a deployment caused it → roll back first, investigate after.\n3. Read logs: global exception handler logs with correlation IDs, Application Insights failures, stack traces.\n4. Check dependencies: database (connection failures, timeouts, deadlocks), external APIs, disk/memory, connection-pool exhaustion.\n5. Reproduce with the same input in a lower environment; fix; add a regression test.\n6. Communicate status to stakeholders while working.\n7. Post-mortem: root cause, fix, prevention (alerts, health checks, better validation returning 400 instead of 500, retries/circuit breakers).\nUse the structure: Problem → Investigation → Root cause → Fix → Prevention.","source":"Priority list (zip)","core":true,"tier":2},{"id":"p41","category":"Angular","topic":"Angular Core","difficulty":"Easy","question":"Explain Angular component architecture and how data flows with @Input and @Output.","answer":"A component = TypeScript class (logic and data) + HTML template (view) + CSS/SCSS styles (component-scoped). Components form a tree of parent-child components; the root is AppComponent.\nData flow:\n• @Input – parent → child:  @Input() userName!: string;   <app-user [userName]=\"name\"><\/app-user>\n• @Output – child → parent via events:  @Output() userClick = new EventEmitter<User>();  this.userClick.emit(user);   <app-user (userClick)=\"onSelect($event)\">\n• Services (with RxJS subjects/signals) for sibling or distant components.\nNewer syntax: input(), output(), model() signal functions.\nDesign: \"smart\" container components fetch data via services; \"dumb\" presentational components only use inputs/outputs – reusable and easy to test.\nInterview line: \"Angular promotes modular, reusable UI components.\"","source":"Priority list (zip)","core":true,"tier":2},{"id":"p42","category":"Angular","topic":"Angular Core","difficulty":"Easy","question":"Component vs Module in Angular?","answer":"Component\n• Purpose: UI building block. Contains template, logic and styles. Responsibility: render and manage a view.\n• Example: UserProfileComponent, LoginFormComponent.\nModule (NgModule)\n• Purpose: logical grouping container. Contains components, directives, pipes and service providers; imports other modules.\n• Responsibility: organise application structure, control scope (what's declared/exported), enable lazy loading of a feature.\n• Example: AuthModule, SharedModule, AppModule.\nBenefits of modules: clear feature boundaries, lazy loading for performance, shared declarations.\nNote: since Angular 17, standalone components are the default and can import their own dependencies, so modules are optional – but many existing projects still use them.\nInterview line: \"Components build UI; modules organise and load them.\"","source":"Priority list (zip)","core":true,"tier":2},{"id":"p43","category":"Angular","topic":"Angular Core","difficulty":"Easy","question":"constructor() vs ngOnInit() in Angular – what goes where?","answer":"constructor()\n• TypeScript class feature, runs at class instantiation.\n• Purpose: dependency injection and simple field initialisation. @Input values are NOT available yet.\n  constructor(private userService: UserService, private router: Router) { this.isLoading = false; }\nngOnInit()\n• Angular lifecycle hook, called ONCE after the first ngOnChanges, when @Input properties are set.\n• Purpose: component initialisation – API calls, subscriptions, logic that depends on inputs.\n  ngOnInit(): void { this.userService.getUser(this.userId).subscribe(u => this.user = u); }\nOrder: constructor (DI) → inputs set → ngOnInit → view rendered.\nKeep constructors light so components are cheap to create and easy to test.\nInterview line: \"Constructor injects; ngOnInit initialises.\"","source":"Priority list (zip)","core":true,"tier":2},{"id":"p44","category":"Angular","topic":"Implementation","difficulty":"Medium","question":"What are Angular HTTP interceptors and their common use cases?","answer":"An interceptor sits between HttpClient and the backend and can inspect/modify every outgoing request and incoming response – one central place for HTTP cross-cutting concerns.\nCommon uses:\n1. Authentication token injection – add Authorization: Bearer <JWT> to every request.\n2. Global error handling – catch 401 (redirect to login / refresh token), 403, 500 and show user-friendly messages.\n3. Logging / timing of API calls; loader spinner on/off.\n4. Retry transient failures, caching GET responses, adding headers (correlation ID, language).\n\nexport const errorInterceptor: HttpInterceptorFn = (req, next) =>\n  next(req).pipe(catchError((err: HttpErrorResponse) => {\n    if (err.status === 401) inject(Router).navigate(['/login']);\n    inject(ToastService).error(err.error?.message ?? 'Something went wrong');\n    return throwError(() => err);\n  }));\nRegister: provideHttpClient(withInterceptors([authInterceptor, errorInterceptor])) – order matters (requests run in order, responses in reverse). Class-based: implements HttpInterceptor + HTTP_INTERCEPTORS multi provider.\nInterview line: \"Interceptors keep HTTP concerns clean and centralised.\"","source":"Priority list (zip)","core":true,"tier":2},{"id":"p45","category":"Coding","topic":"C# Coding","difficulty":"Easy","question":"C#: count the number of words in a string. Input: \"I am a .NET Developer\" → 5","answer":"static int CountWords(string s)\n{\n    if (string.IsNullOrWhiteSpace(s)) return 0;\n    return s.Split(new[] { ' ', '\\t', '\\n' }, StringSplitOptions.RemoveEmptyEntries).Length;\n}\nWithout Split (interviewers sometimes ask):\nint count = 0; bool inWord = false;\nforeach (char c in s) {\n    if (char.IsWhiteSpace(c)) inWord = false;\n    else if (!inWord) { inWord = true; count++; }\n}\nEdge cases: multiple spaces, leading/trailing spaces, empty/null. O(n) time.","source":"Priority list (zip)","core":true,"tier":2},{"id":"p46","category":"Coding","topic":"C# Coding","difficulty":"Easy","question":"C#: find the missing number in an array 1..n. Input: {1,2,3,4,5,7,8,9} → 6","answer":"Sum formula (one number missing from 1..n):\nstatic int FindMissing(int[] arr)\n{\n    int n = arr.Length + 1;              // 9\n    long expected = (long)n * (n + 1) / 2;   // 45\n    long actual = 0;\n    foreach (int x in arr) actual += x;     // 39\n    return (int)(expected - actual);        // 6\n}\nO(n) time, O(1) space. XOR alternative avoids overflow: XOR 1..n with all elements; the result is the missing number.\nIf the array may be unsorted – still works. If several numbers can be missing: use a HashSet and check 1..n.","source":"Priority list (zip)","core":true,"tier":2},{"id":"p47","category":"Coding","topic":"C# Coding","difficulty":"Easy","question":"C#: find duplicate elements in an integer array, and remove duplicates.","answer":"Find duplicates:\nstatic List<int> FindDuplicates(int[] arr)\n{\n    var seen = new HashSet<int>(); var dups = new HashSet<int>();\n    foreach (int x in arr)\n        if (!seen.Add(x)) dups.Add(x);     // Add returns false if already present\n    return dups.ToList();\n}\nRemove duplicates (keep first occurrence order):\nstatic int[] RemoveDuplicates(int[] arr)\n{\n    var seen = new HashSet<int>(); var result = new List<int>();\n    foreach (int x in arr) if (seen.Add(x)) result.Add(x);\n    return result.ToArray();\n}\nLINQ: arr.Distinct().ToArray(); duplicates: arr.GroupBy(x => x).Where(g => g.Count() > 1).Select(g => g.Key).\nO(n) time with HashSet vs O(n²) with nested loops – say this.","source":"Priority list (zip)","core":true,"tier":2},{"id":"p48","category":"Coding","topic":"C# Coding","difficulty":"Easy","question":"C#: find the first non-repeating character in a string.","answer":"static char? FirstNonRepeating(string s)\n{\n    var counts = new Dictionary<char, int>();\n    foreach (char c in s) counts[c] = counts.GetValueOrDefault(c) + 1;\n    foreach (char c in s) if (counts[c] == 1) return c;     // second pass keeps original order\n    return null;\n}\n\"swiss\" → 'w'. Two passes, O(n) time, O(k) space for distinct chars.\nLINQ: s.GroupBy(c => c).FirstOrDefault(g => g.Count() == 1)?.Key (GroupBy preserves first-appearance order).\nClarify: case-sensitive? ignore spaces?","source":"Priority list (zip)","core":true,"tier":2},{"id":"p49","category":"Coding","topic":"C# Coding","difficulty":"Easy","question":"C#: check whether two strings are anagrams.","answer":"static bool IsAnagram(string a, string b)\n{\n    a = a.Replace(\" \", \"\").ToLower(); b = b.Replace(\" \", \"\").ToLower();\n    if (a.Length != b.Length) return false;\n    var count = new int[26];                       // for a–z; use Dictionary for Unicode\n    foreach (char c in a) count[c - 'a']++;\n    foreach (char c in b) if (--count[c - 'a'] < 0) return false;\n    return true;\n}\n\"listen\"/\"silent\" → true. O(n) time.\nSimple alternative: sort both and compare – string.Concat(a.OrderBy(c => c)) == string.Concat(b.OrderBy(c => c)) – O(n log n).","source":"Priority list (zip)","core":true,"tier":2},{"id":"p50","category":"Coding","topic":"C# Coding","difficulty":"Easy","question":"C#: reverse the words in a sentence. \"I am a developer\" → \"developer a am I\"","answer":"static string ReverseWords(string s)\n{\n    var words = s.Split(' ', StringSplitOptions.RemoveEmptyEntries);\n    Array.Reverse(words);\n    return string.Join(\" \", words);\n}\nWithout built-ins: split manually into a list, then build the result with a StringBuilder from the last word to the first.\nVariant: reverse each word's letters but keep order → string.Join(\" \", words.Select(w => new string(w.Reverse().ToArray()))).","source":"Priority list (zip)","core":true,"tier":2},{"id":"p51","category":"Coding","topic":"C# Coding","difficulty":"Easy","question":"C#: find the maximum and minimum element in an array without built-in methods.","answer":"static (int Min, int Max) MinMax(int[] arr)\n{\n    if (arr == null || arr.Length == 0) throw new ArgumentException(\"Array is empty\");\n    int min = arr[0], max = arr[0];\n    for (int i = 1; i < arr.Length; i++)\n    {\n        if (arr[i] < min) min = arr[i];\n        if (arr[i] > max) max = arr[i];\n    }\n    return (min, max);\n}\nSingle pass, O(n) time, O(1) space. Mention the empty-array edge case and that you start from arr[0], not int.MinValue/MaxValue (both work, arr[0] is cleaner).","source":"Priority list (zip)","core":true,"tier":2},{"id":"p52","category":"Coding","topic":"C# Coding","difficulty":"Easy","question":"C#: find common elements between two arrays.","answer":"static List<int> Common(int[] a, int[] b)\n{\n    var setA = new HashSet<int>(a);\n    var result = new HashSet<int>();\n    foreach (int x in b) if (setA.Contains(x)) result.Add(x);\n    return result.ToList();\n}\nO(n + m) with HashSet vs O(n·m) nested loops. LINQ: a.Intersect(b).\nIf both arrays are sorted: two-pointer technique, O(n + m) with O(1) extra space.","source":"Priority list (zip)","core":true,"tier":2},{"id":"p53","category":"Coding","topic":"C# Coding","difficulty":"Easy","question":"C#: check whether a string is a palindrome.","answer":"static bool IsPalindrome(string s)\n{\n    int i = 0, j = s.Length - 1;\n    while (i < j)\n    {\n        if (!char.IsLetterOrDigit(s[i])) { i++; continue; }      // optional: ignore spaces/punctuation\n        if (!char.IsLetterOrDigit(s[j])) { j--; continue; }\n        if (char.ToLower(s[i]) != char.ToLower(s[j])) return false;\n        i++; j--;\n    }\n    return true;\n}\nTwo pointers: O(n) time, O(1) space. Quick version: s == new string(s.Reverse().ToArray()) (extra memory).","source":"Priority list (zip)","core":true,"tier":2},{"id":"p54","category":"Coding","topic":"C# Coding","difficulty":"Easy","question":"C#: find the frequency of each character in a string.","answer":"static Dictionary<char, int> CharFrequency(string s)\n{\n    var freq = new Dictionary<char, int>();\n    foreach (char c in s)\n    {\n        if (c == ' ') continue;\n        freq[c] = freq.TryGetValue(c, out var n) ? n + 1 : 1;\n    }\n    return freq;\n}\nforeach (var kv in CharFrequency(\"programming\")) Console.WriteLine($\"{kv.Key}: {kv.Value}\");   // r:2 g:2 m:2 ...\nLINQ: s.GroupBy(c => c).Select(g => new { Char = g.Key, Count = g.Count() }).\nO(n) time. Explain approach → code → edge cases → complexity.","source":"Priority list (zip)","core":true,"tier":2},{"id":"q001","category":".NET","topic":"OOP & C# Core","difficulty":"Easy","question":"What are the main concepts of OOPS? What are classes and objects?","answer":"Four pillars: inheritance, polymorphism, abstraction, encapsulation. A class is a blueprint (fields, properties, methods, constructors); an object is a runtime instance of that class created with new.","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q002","category":".NET","topic":"OOP & C# Core","difficulty":"Easy","question":"What is Inheritance? Why is Inheritance important?","answer":"A parent-child relationship where the derived class reuses the base class's members. It gives code reuse and lets you treat derived types through the base type (e.g. PermanentEmployee : Employee).","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q003","category":".NET","topic":"OOP & C# Core","difficulty":"Easy","question":"What are the different types of Inheritance?","answer":"Single, multilevel, hierarchical, and multiple. C# supports multiple inheritance only through interfaces, not classes.","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q004","category":".NET","topic":"OOP & C# Core","difficulty":"Easy","question":"How to prevent a class from being inherited?","answer":"Mark it sealed. A static class is also implicitly sealed and cannot be instantiated.","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q005","category":".NET","topic":"OOP & C# Core","difficulty":"Medium","question":"What is Abstraction?","answer":"Exposing only what the caller needs and hiding the details. A driver uses the steering wheel without knowing the engine; an Employee exposes CalculateSalary but hides CalculateBasic/CalculateHRA. Implemented via abstract classes, interfaces, and access modifiers.","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q006","category":".NET","topic":"OOP & C# Core","difficulty":"Medium","question":"What is Encapsulation?","answer":"Bundling data and the methods that operate on it into one unit, and controlling access with private fields and public properties so invariants (e.g. no negative salary) are enforced in one place.","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q007","category":".NET","topic":"OOP & C# Core","difficulty":"Medium","question":"What is Polymorphism and what are its types?","answer":"One name, many forms. Compile-time polymorphism = method overloading; runtime polymorphism = method overriding via virtual/override, resolved on the actual object type.","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q008","category":".NET","topic":"OOP & C# Core","difficulty":"Medium","question":"What is Method Overloading? In how many ways a method can be overloaded?","answer":"Same method name, different signatures in the same class. Vary by number of parameters, type of parameters, or order of parameters. Return type alone does not count.","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q010","category":".NET","topic":"OOP & C# Core","difficulty":"Medium","question":"What is the difference between Method Overriding and Method Hiding?","answer":"Overriding (virtual/override) replaces behaviour even when called through a base reference. Hiding (new keyword) only hides the base member; calling through a base reference still runs the base version.","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q011","category":".NET","topic":"OOP & C# Core","difficulty":"Medium","question":"What are the advantages and limitations of OOPS?","answer":"Advantages: reuse via inheritance, flexibility via polymorphism, data protection via encapsulation, modular and easier to extend. Limitations: more design effort, can be overkill for small scripts, deep hierarchies become rigid.","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q014","category":".NET","topic":"Abstract Class & Interface","difficulty":"Medium","question":"Why to even create Interfaces?","answer":"To enforce a contract (every employee type must implement SetSalary), to decouple callers from implementations for DI and mocking, and to allow multiple inheritance.","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q015","category":".NET","topic":"Abstract Class & Interface","difficulty":"Easy","question":"Can an Interface have a Constructor?","answer":"No. Interfaces cannot be instantiated, so they cannot have constructors.","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q016","category":".NET","topic":"Abstract Class & Interface","difficulty":"Medium","question":"Can you create an instance of an Abstract class or an Interface?","answer":"No. But an abstract class constructor does run when a derived object is created, to initialise the base part.","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q017","category":".NET","topic":"C# General","difficulty":"Easy","question":"What are Access Specifiers? What is the default access modifier in a class?","answer":"public, private, protected, internal, protected internal, private protected. A top-level class defaults to internal; class members default to private.","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q018","category":".NET","topic":"C# General","difficulty":"Easy","question":"What is Boxing and Unboxing?","answer":"Boxing converts a value type to object (implicit, heap allocation). Unboxing casts it back (explicit, copy). In hot paths it adds GC pressure; generics avoid it.","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q019","category":".NET","topic":"C# General","difficulty":"Easy","question":"Difference between String and StringBuilder? When to use what?","answer":"string is immutable, every change creates a new instance. StringBuilder is mutable, so use it when concatenating in loops or building large text.","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q020","category":".NET","topic":"C# General","difficulty":"Easy","question":"What are the basic string operations in C#?","answer":"Concat or +, Replace, Trim, Contains, Substring, Split, IndexOf, ToUpper/ToLower, string interpolation.","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q021","category":".NET","topic":"C# General","difficulty":"Easy","question":"What are Nullable types?","answer":"Value types that can hold null, declared with ? (int?). Use HasValue/Value or ?? to read them.","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q022","category":".NET","topic":"C# General","difficulty":"Medium","question":"Explain Generics in C#? When and why to use them?","answer":"Type parameters (List<T>) make classes/methods type-safe and reusable without casting or boxing, which improves performance and catches type errors at compile time.","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q023","category":".NET","topic":"Exception Handling","difficulty":"Easy","question":"How to implement Exception Handling in C#?","answer":"try for risky code, catch for specific exceptions (most specific first), finally for cleanup, throw to rethrow or raise. Log in catch.","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q024","category":".NET","topic":"Exception Handling","difficulty":"Easy","question":"Can we execute multiple Catch blocks?","answer":"You can declare multiple catch blocks, but only one executes for a given exception: the first matching one.","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q025","category":".NET","topic":"Exception Handling","difficulty":"Easy","question":"What is a Finally block and give an example when to use it?","answer":"Runs whether or not an exception occurred. Used to release resources such as closing a DB connection.","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q026","category":".NET","topic":"Exception Handling","difficulty":"Easy","question":"Can we have only Try block without Catch block?","answer":"Yes, if it has a finally block (try/finally).","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q028","category":".NET","topic":"Loops & Collections","difficulty":"Easy","question":"What are the Loop types in C#?","answer":"while, do-while, for, foreach. do-while runs at least once; foreach iterates any IEnumerable.","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q029","category":".NET","topic":"Loops & Collections","difficulty":"Easy","question":"What is the difference between continue and break statement?","answer":"continue skips to the next iteration; break exits the loop entirely.","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q030","category":".NET","topic":"Loops & Collections","difficulty":"Easy","question":"What is the difference between Array and ArrayList?","answer":"Array is fixed size and strongly typed. ArrayList grows dynamically and stores object (boxing, no type safety). Prefer List<T> today.","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q031","category":".NET","topic":"Loops & Collections","difficulty":"Easy","question":"What is the difference between ArrayList and Hashtable?","answer":"ArrayList stores items by index; Hashtable stores key-value pairs and retrieves by key. Generic equivalents: List<T> and Dictionary<TKey,TValue>.","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q032","category":".NET","topic":"Loops & Collections","difficulty":"Medium","question":"What are Collections in C# and what are their types?","answer":"Non-generic (ArrayList, Hashtable), generic (List, Dictionary, HashSet, Queue, Stack), and concurrent (ConcurrentDictionary, ConcurrentQueue) for multithreading.","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q033","category":".NET","topic":"Loops & Collections","difficulty":"Medium","question":"What is IEnumerable in C#?","answer":"The interface that makes a collection iterable with foreach, via GetEnumerator(). List<T> and most collections implement it.","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q034","category":".NET","topic":"Loops & Collections","difficulty":"Medium","question":"What is the difference between IEnumerable and IEnumerator?","answer":"IEnumerable is the collection side (GetEnumerator). IEnumerator is the cursor that does the iteration: Current, MoveNext, Reset.","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q035","category":".NET","topic":"Loops & Collections","difficulty":"Senior","question":"Difference between IEnumerable and IQueryable? Why use IQueryable for SQL?","answer":"IEnumerable runs LINQ in memory after data is loaded. IQueryable builds an expression tree the provider translates to SQL, so filtering happens in the database and less data crosses the network.","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q037","category":".NET","topic":"Methods & Delegates","difficulty":"Easy","question":"What is the purpose of params keyword?","answer":"Lets a method accept a variable number of arguments as an array: Sum(params int[] nums).","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q038","category":".NET","topic":"Methods & Delegates","difficulty":"Medium","question":"What is a Constructor and what are its types?","answer":"Special method run on object creation. Types: default, parameterised, copy, static (runs once per type), private (blocks external instantiation).","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q039","category":".NET","topic":"Methods & Delegates","difficulty":"Medium","question":"When to use Private constructor?","answer":"Classes with only static members, and the Singleton pattern, to stop outside code from creating instances.","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q040","category":".NET","topic":"Methods & Delegates","difficulty":"Medium","question":"What are Extension Methods in C#? When to use them?","answer":"Static methods in a static class whose first parameter uses this, so they appear as instance methods on an existing type you cannot modify (LINQ is built this way).","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q041","category":".NET","topic":"Methods & Delegates","difficulty":"Medium","question":"What is a Delegate? When to use them?","answer":"A type-safe reference to a method. Used to pass behaviour as a parameter, for callbacks and events; Func/Action are built-in delegates.","source":"Udemy 300 Q course","core":false,"tier":3},{"id":"q042","category":".NET","topic":"Methods & Delegates","difficulty":"Medium","question":"What are Multicast Delegates?","answer":"A delegate holding several methods, combined with +=. Invoking it calls them in order; the return v
